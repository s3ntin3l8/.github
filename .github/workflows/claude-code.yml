name: Claude Code (reusable)

# Reusable workflow: any repo can call this to get the "@claude" on-demand assistant
# (issue/PR comments, PR reviews, issues) wired up with ONE shared configuration,
# instead of copy-pasting the same claude.yml into every repo.
#
# WHY TWO "Run Claude Code" STEPS BELOW: the first version of this workflow granted
# mcp__github_inline_comment__create_inline_comment + Bash(gh pr review:*) and nudged
# usage via --append-system-prompt, but @claude reviews still landed as a single plain
# issue_comment -- no inline comments, no formal review verdict (see
# s3ntin3l8/pocket-portfolio-tracker#558's actual run logs). Root cause, confirmed by
# reading anthropics/claude-code-action's source (src/modes/detector.ts,
# src/create-prompt/index.ts): any @mention-triggered comment event runs in "tag mode"
# by default, whose prompt template HARDCODES (unconditionally, repeated 5x):
#   "What You CANNOT Do: - Submit formal GitHub PR reviews - Approve pull requests -
#    Post multiple comments (you only update your initial comment)"
# --append-system-prompt only ADDS to the system prompt; it cannot remove or override
# this task-prompt content, so it loses to the more authoritative "CANNOT" framing.
# The only way to escape this template is "agent mode": supplying a custom `prompt:`
# input on a comment/review event switches detectMode() to "agent", and in agent mode
# generatePrompt() returns ONLY `context.prompt` -- no template, no restrictions, but
# also ZERO automatic behavior (no sticky comment, no todo checklist, no auto git
# fetch/diff, no CLAUDE.md-reading instruction) -- everything must be spelled out in
# our own prompt, which is what the "Run Claude Code (PR)" step below does.
#
# Routing is by EVENT CONTEXT, not by parsing the comment text (fragile keyword
# matching like "contains 'review'" would misfire on things like "review items
# addressed..."): PR-attached events (issue_comment on a PR, pull_request_review_comment,
# pull_request_review) go through agent mode with a custom review+implement prompt;
# issue-only events (issues, issue_comment on a non-PR issue) are left running in tag
# mode exactly as before -- there's no "cannot review a PR" problem to escape there.
#
# WHY THE PR PROMPT USES `gh api .../reviews` INSTEAD OF THE mcp__github_inline_comment
# TOOL: the first agent-mode version used mcp__github_inline_comment__create_inline_comment
# for line-anchored feedback. It worked (inline comments posted correctly), but the
# action's own src/entrypoints/post-buffered-inline-comments.ts posts each buffered
# comment with a SEPARATE octokit.rest.pulls.createReviewComment call in a plain loop --
# no batching, no pending-review object -- so N inline comments produce N separate
# single-comment reviews, plus a further +1 from our own explicit `gh pr review` verdict
# call. That's hardcoded in the action's shipped code; no prompt can change it. GitHub's
# REST API itself supports inline comments AND a verdict in ONE atomic call
# (`POST /pulls/{pr}/reviews` takes a `comments` array plus `body`/`event`), so the
# prompt below has Claude build that payload directly via `gh api` instead of using the
# action's tool -- one clean review object instead of several.
#
# WHY THERE'S A "Checkout PR branch" STEP: agent mode does ZERO automatic git setup of
# its own (confirmed in src/modes/agent/index.ts -- no fetch, no checkout, no branch
# switch; it relies entirely on whatever the calling workflow already prepared). Our own
# `actions/checkout` step only checks out `main` (the default ref for issue_comment
# events) -- never the PR's actual branch. Compare tag mode, which calls its own
# internal setupBranch() (src/github/operations/branch.ts) to `git fetch origin --depth
# <N> <branch>` + `git checkout <branch>` BEFORE Claude ever runs, so tag mode's Claude
# always has the PR's real files sitting locally and can just Read() them or run small
# per-file `git diff` commands. Without this, PR-mode Claude was stranded on `main` with
# no local view of the PR's changes -- forcing it to pull one giant `gh pr diff` blob
# and slice it with awk/sed/python3 pipelines, which then hit the Bash tool's
# multi-operation rejection (none of those were granted) and burned enough turns that a
# large multi-file PR (s3ntin3l8/pocket-portfolio-tracker#564) never got a review posted
# at all -- confirmed via show_full_output logs (no gh api .../reviews call ever
# appears in the trace). `gh pr checkout <N>` is the standard, fork-aware equivalent of
# tag mode's setupBranch(): fetches + checks out the PR's head branch in one command.
# This also fixes implementation requests (prompt step 5): without an actual checkout of
# the PR branch, any `git commit`+push would have landed on `main`, not the PR -- a
# second, latent bug this same fix resolves.
#
# Triggers (define in the CALLING repo's workflow, not here -- this is `workflow_call`,
# same convention as hermes-review.yml in this repo). Typical caller `on:`:
#   issue_comment: [created]
#   pull_request_review_comment: [created]
#   issues: [opened, assigned]
#   pull_request_review: [submitted]
# The trusted-commenter + "@claude" mention gate lives HERE (in the job's `if:`), not
# per-caller, so it can't drift between repos.
#
# Required caller setup (once per calling repo):
#   1. Repo secret CLAUDE_CODE_OAUTH_TOKEN (Claude Code OAuth token).
#   2. permissions: contents: read, pull-requests: write, issues: read, id-token: write,
#      actions: read -- declared in the CALLER (workflow_call jobs can't set their own
#      top-level permissions that the caller doesn't grant), matching hermes-review.yml's
#      convention of leaving permissions to the caller.
#
# Minimal caller example (Node repo with lint/typecheck/test):
#   jobs:
#     claude:
#       permissions:
#         contents: read
#         pull-requests: write
#         issues: read
#         id-token: write
#         actions: read
#       uses: s3ntin3l8/.github/.github/workflows/claude-code.yml@main
#       with:
#         setup-node: true
#         build-tools: '"Bash(npm run lint*)" "Bash(npm run typecheck*)" "Bash(npm run test*)" "Bash(npm test*)" "Bash(npm ci*)"'
#       secrets: inherit
#
# Minimal caller example (no build step needed):
#   jobs:
#     claude:
#       permissions: { contents: read, pull-requests: write, issues: read, id-token: write, actions: read }
#       uses: s3ntin3l8/.github/.github/workflows/claude-code.yml@main
#       secrets: inherit

on:
  workflow_call:
    inputs:
      setup-node:
        required: false
        type: boolean
        default: false
        description: >-
          Install Node (via actions/setup-node) and run `npm ci` before invoking
          Claude, so build-tools like `npm run lint`/`npm test` are actually runnable
          in the sandbox rather than failing with "command not found".
      node-version:
        required: false
        type: string
        default: "26"
        description: Node version to install when setup-node is true.
      build-tools:
        required: false
        type: string
        default: ""
        description: >-
          Extra space-separated, already-quoted --allowedTools entries to append (e.g.
          '"Bash(npm run lint*)" "Bash(npm test*)"'). Repo-specific build/test commands
          live here; the review-capable tools (inline comments + gh pr review) are
          always granted by this workflow and don't need to be repeated by callers.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
        description: Claude Code OAuth token (from `claude setup-token`).

jobs:
  claude:
    # Restrict to trusted commenters -- otherwise any user on a public repo could
    # post "@claude" and trigger the workflow (API usage, and whatever repo access
    # the action's own token carries). Identical gate across every calling repo,
    # centralized here instead of copy-pasted.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["MEMBER", "OWNER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["MEMBER", "OWNER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["MEMBER", "OWNER", "COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["MEMBER", "OWNER", "COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Bash is otherwise the Claude Code action's sandbox: without a Node toolchain
      # already on PATH, a Node repo's build-tools would just fail with "command not
      # found". Skipped entirely for non-Node callers (setup-node: false, default).
      - name: Setup Node
        if: ${{ inputs.setup-node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        if: ${{ inputs.setup-node }}
        run: npm ci

      # Same PR-vs-issue idiom hermes-review.yml already uses to resolve its target
      # (github.event.issue.pull_request != null && event == issue_comment), reused
      # here so both workflows agree on what counts as "this comment is on a PR".
      - name: Resolve PR number
        id: pr
        if: >
          github.event_name == 'pull_request_review_comment' ||
          github.event_name == 'pull_request_review' ||
          (github.event_name == 'issue_comment' && github.event.issue.pull_request != null)
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      # See the top-of-file comment on why this step exists -- agent mode does no git
      # setup of its own, so without this Claude would be stranded on `main`.
      - name: Checkout PR branch
        if: >
          github.event_name == 'pull_request_review_comment' ||
          github.event_name == 'pull_request_review' ||
          (github.event_name == 'issue_comment' && github.event.issue.pull_request != null)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr checkout ${{ steps.pr.outputs.number }}

      # PR-attached mention: agent mode (see the top-of-file comment for why). Handles
      # both review/feedback AND implementation requests -- full parity with what tag
      # mode does on issues, minus tag mode's false "cannot submit reviews" framing.
      - name: Run Claude Code (PR)
        id: claude-pr
        if: >
          github.event_name == 'pull_request_review_comment' ||
          github.event_name == 'pull_request_review' ||
          (github.event_name == 'issue_comment' && github.event.issue.pull_request != null)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true

          additional_permissions: |
            actions: read

          # Agent mode does none of tag mode's automatic context-gathering, so this
          # prompt has to spell out everything tag mode normally does for free:
          # fetching the diff, reading CLAUDE.md, classifying the request, and how to
          # actually post a response (there is no sticky comment / update-comment tool
          # in agent mode -- gh pr comment / gh pr review are the only output channels).
          prompt: |
            You are responding to an @claude mention on PR #${{ steps.pr.outputs.number }}
            in ${{ github.repository }}.

            The user's request (act only on this; other PR comments are context only):
            ---
            ${{ github.event.comment.body || github.event.review.body }}
            ---

            Steps:
            1. Your local checkout is already on this PR's actual branch. Get an
               overview with `git diff origin/main...HEAD --stat`, then look at
               specific files one at a time with `git diff origin/main...HEAD -- <file>`
               or the Read tool on the file itself -- much easier to work with than one
               giant diff dump. Run `gh pr view ${{ steps.pr.outputs.number }}` for the
               PR description. Read CLAUDE.md and other relevant files for repo
               conventions. (`gh pr diff ${{ steps.pr.outputs.number }}` is available
               too if you want the whole diff at once, but prefer the per-file approach
               above for anything beyond a tiny PR.)
            2. Classify the request: review/feedback, a question, an implementation
               request, or a mix -- handle accordingly, combining as needed.
            3. For review/feedback with specific line-level findings, post ONE clean
               formal review instead of several separate ones:
               a. Get the PR's head commit SHA:
                  `gh pr view ${{ steps.pr.outputs.number }} --json headRefOid -q .headRefOid`
               b. Write a JSON file shaped like this (one entry per finding; include a
                  GitHub ```suggestion``` code block inside a comment's body whenever
                  you're proposing a concrete edit, so it can be applied with one click).
                  Structure the "body" field like this (matches the format this org's
                  other review bot already uses, so both read consistently -- omit a
                  section's bullet and write "- None" if empty, but keep the heading):
                  "## Review\n\n**Verdict:** <one-line summary>\n\n### Critical\n- <blocking issues, or \"None\">\n\n### Warnings\n- <non-blocking issues worth fixing, or \"None\">\n\n### Suggestions\n- <optional improvements, or \"None\">\n\n### Looks Good\n- <what's solid about this change>"
                  {
                    "commit_id": "<head sha>",
                    "body": "<the structured body above>",
                    "event": "COMMENT",
                    "comments": [
                      {"path": "<file>", "line": <line>, "body": "<finding, specific and under ~280 chars>"}
                    ]
                  }
                  Use `"event": "REQUEST_CHANGES"` instead of `"COMMENT"` if something
                  found should block merge. Never use `"APPROVE"` -- it may be rejected
                  for automated tokens on this repo, don't rely on it working. An empty
                  `comments` array is fine for a verdict with no specific line to anchor.
               c. Submit it in one call:
                  `gh api repos/${{ github.repository }}/pulls/${{ steps.pr.outputs.number }}/reviews --method POST --input <file>`
               d. If that call fails for any reason, fall back to
                  `gh pr review --comment` or `--request-changes` with your findings
                  written out in the body instead -- a working verdict without inline
                  anchors beats no response at all.
            4. For questions or feedback with no specific line to anchor to, post via
               `gh pr comment ${{ steps.pr.outputs.number }} --body "..."`.
            5. For implementation requests: edit files locally with your file tools,
               then stage/commit/push with git commands via Bash (you're already on the
               PR's branch, so a plain push lands on it directly), then post a summary
               of what changed with `gh pr comment`.
            6. This is the ONLY way your response reaches the user -- nothing else is
               visible. Never approve/merge/close the PR beyond what's explicitly
               requested.

          # `Bash(git diff:*)`/`Bash(git log:*)` are what the "Checkout PR branch" step
          # above enables -- small, per-file local diffs instead of one giant remote
          # blob that needs shell-pipeline slicing (the thing that starved
          # pocket-portfolio-tracker#564 of turns and never posted a review at all).
          # gh pr diff / gh pr view / gh pr comment are lifted directly from Anthropic's
          # own examples/pr-review-comprehensive.yml -- the read/comment channels this
          # prompt relies on since agent mode does no automatic comment posting.
          # `Bash(gh api:*)` (broad trailing wildcard, matching this file's established
          # convention -- see the note on exact-string rules below) is what the
          # single-review-call step above needs; scoped tighter patterns like
          # "gh api repos/*/pulls/*/reviews*" risk NOT matching if the permission
          # matcher doesn't support mid-string globs, which silently denies the call
          # with no human to fall back on in CI. `gh pr review` stays granted as the
          # prompt's own explicit fallback. Read/Glob/Grep are included explicitly since
          # agent mode may not carry tag mode's baseline tool defaults.
          claude_args: |
            --allowedTools "Bash(gh api:*)" "Bash(gh pr review:*)" "Bash(gh pr diff:*)" "Bash(gh pr view:*)" "Bash(gh pr comment:*)" "Bash(git diff:*)" "Bash(git log:*)" "Bash(git status:*)" "Bash(git add:*)" "Bash(git commit:*)" "Bash(git rm:*)" "Bash(git push:*)" "Read" "Glob" "Grep" ${{ inputs.build-tools }}

      # Issue-only mention: unchanged tag mode, exactly as before this fix -- issues
      # have no "cannot review a PR" problem to escape, so no reason to touch this path.
      - name: Run Claude Code (issue)
        id: claude-issue
        if: >
          github.event_name == 'issues' ||
          (github.event_name == 'issue_comment' && github.event.issue.pull_request == null)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true

          additional_permissions: |
            actions: read

          # No `prompt:` here -- Claude follows whatever the summoning comment/issue
          # asked for, in tag mode's default template (todo checklist, sticky comment,
          # CLAUDE.md-reading, implement-and-push), same as before this fix.
          #
          # Exact-string --allowedTools rules (no trailing wildcard) only match that
          # literal command -- e.g. "Bash(npm run lint)" alone does NOT match "npm run
          # lint --fix" or any other variation Claude might type; every caller-supplied
          # build-tools entry should carry a trailing `*`.
          claude_args: |
            --allowedTools ${{ inputs.build-tools }}
