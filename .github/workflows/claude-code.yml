name: Claude Code (reusable)

# Reusable workflow: any repo can call this to get the "@claude" on-demand assistant
# (issue/PR comments, PR reviews, issues) wired up with ONE shared configuration,
# instead of copy-pasting the same claude.yml into every repo. See s3ntin3l8/pocket-
# portfolio-tracker's investigation into why @claude reviews landed as a single plain
# PR comment with no reviewer-role verdict and no inline suggested edits: `gh pr
# review` (Bash) only sets a top-level verdict/body -- it cannot anchor a comment to a
# line or emit a ```suggestion``` block. The actual missing piece was the action's
# built-in `mcp__github_inline_comment__create_inline_comment` tool (confirmed against
# anthropics/claude-code-action's own examples/pr-review-comprehensive.yml), which is
# now granted by default below alongside `gh pr review` for the formal verdict.
#
# Triggers (define in the CALLING repo's workflow, not here -- this is `workflow_call`,
# same convention as hermes-review.yml in this repo). Typical caller `on:`:
#   issue_comment: [created]
#   pull_request_review_comment: [created]
#   issues: [opened, assigned]
#   pull_request_review: [submitted]
# The trusted-commenter + "@claude" mention gate lives HERE (in the job's `if:`), not
# per-caller, so it can't drift between repos.
#
# Required caller setup (once per calling repo):
#   1. Repo secret CLAUDE_CODE_OAUTH_TOKEN (Claude Code OAuth token).
#   2. permissions: contents: read, pull-requests: write, issues: read, id-token: write,
#      actions: read -- declared in the CALLER (workflow_call jobs can't set their own
#      top-level permissions that the caller doesn't grant), matching hermes-review.yml's
#      convention of leaving permissions to the caller.
#
# Minimal caller example (Node repo with lint/typecheck/test):
#   jobs:
#     claude:
#       permissions:
#         contents: read
#         pull-requests: write
#         issues: read
#         id-token: write
#         actions: read
#       uses: s3ntin3l8/.github/.github/workflows/claude-code.yml@main
#       with:
#         setup-node: true
#         build-tools: '"Bash(npm run lint*)" "Bash(npm run typecheck*)" "Bash(npm run test*)" "Bash(npm test*)" "Bash(npm ci*)"'
#       secrets: inherit
#
# Minimal caller example (no build step needed):
#   jobs:
#     claude:
#       permissions: { contents: read, pull-requests: write, issues: read, id-token: write, actions: read }
#       uses: s3ntin3l8/.github/.github/workflows/claude-code.yml@main
#       secrets: inherit

on:
  workflow_call:
    inputs:
      setup-node:
        required: false
        type: boolean
        default: false
        description: >-
          Install Node (via actions/setup-node) and run `npm ci` before invoking
          Claude, so build-tools like `npm run lint`/`npm test` are actually runnable
          in the sandbox rather than failing with "command not found".
      node-version:
        required: false
        type: string
        default: "26"
        description: Node version to install when setup-node is true.
      build-tools:
        required: false
        type: string
        default: ""
        description: >-
          Extra space-separated, already-quoted --allowedTools entries to append (e.g.
          '"Bash(npm run lint*)" "Bash(npm test*)"'). Repo-specific build/test commands
          live here; the review-capable tools (inline comments + gh pr review) are
          always granted by this workflow and don't need to be repeated by callers.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
        description: Claude Code OAuth token (from `claude setup-token`).

jobs:
  claude:
    # Restrict to trusted commenters -- otherwise any user on a public repo could
    # post "@claude" and trigger the workflow (API usage, and whatever repo access
    # the action's own token carries). Identical gate across every calling repo,
    # centralized here instead of copy-pasted.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["MEMBER", "OWNER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["MEMBER", "OWNER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["MEMBER", "OWNER", "COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["MEMBER", "OWNER", "COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Bash is otherwise the Claude Code action's sandbox: without a Node toolchain
      # already on PATH, a Node repo's build-tools would just fail with "command not
      # found". Skipped entirely for non-Node callers (setup-node: false, default).
      - name: Setup Node
        if: ${{ inputs.setup-node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        if: ${{ inputs.setup-node }}
        run: npm ci

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # No `prompt:`/`direct_prompt:` here on purpose -- Claude follows whatever the
          # summoning comment asked for (review, fix a bug, update docs, ...). The
          # review-specific behavior below is steered via --append-system-prompt so it
          # only kicks in when a review is actually requested, instead of a static
          # `prompt:` that would force every "@claude" mention into review mode.
          #
          # Exact-string --allowedTools rules (no trailing wildcard) only match that
          # literal command -- e.g. "Bash(npm run lint)" alone does NOT match "npm run
          # lint --fix" or any other variation Claude might type; every entry below
          # (and any caller-supplied build-tools) should carry a trailing `*`.
          #
          # Two review-capable tools are always granted:
          #  - mcp__github_inline_comment__create_inline_comment: lets Claude anchor
          #    feedback to specific lines and include GitHub ```suggestion``` blocks
          #    (one-click-applyable edits) -- this was the actual missing piece; a
          #    plain PR comment was all that was previously possible.
          #  - "Bash(gh pr review:*)": lets Claude submit a formal review with an
          #    Approve/Request-Changes/Comment verdict (reviewer role), not just a
          #    comment. Scoped to just this subcommand, not the vendor example's
          #    broader `gh pr *` (no merge/close/edit access needed).
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment" "Bash(gh pr review:*)" ${{ inputs.build-tools }}
            --append-system-prompt "When asked to review a pull request, act as a formal reviewer: post line-specific feedback using the mcp__github_inline_comment__create_inline_comment tool, and whenever you propose a concrete code change, include a GitHub \`\`\`suggestion\`\`\` code block inside that inline comment so it can be applied with one click. After posting inline comments, submit an overall verdict with 'gh pr review --approve', '--request-changes', or '--comment' plus a brief summary. Do not settle for a single plain top-level PR comment when a review is requested."
