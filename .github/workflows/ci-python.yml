name: Python CI

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: '3.12'
      coverage-fail-under:
        required: false
        type: string
        default: '70'
      coverage-source:
        description: "Module/package to measure coverage for (passed to pytest --cov). Set this for repos whose package isn't named 'app'."
        required: false
        type: string
        default: 'app'
      runner:
        description: "Runner label(s) for the type-and-test job, e.g. a self-hosted label. Defaults to GitHub-hosted."
        required: false
        type: string
        default: 'ubuntu-latest'
      strict-checks:
        description: "Fail the job on mypy/pip-audit findings instead of reporting them advisory-only. Flip on once a repo's baseline is clean."
        required: false
        type: boolean
        default: false
      test-parallel:
        description: >-
          Run pytest in this many parallel workers (e.g. '4'). Empty keeps the
          suite serial. Uses `--dist loadfile`, which keeps every test module
          inside one worker so module-scoped fixtures and import-time setup
          stay together. The caller must have pytest-xdist installed.
        required: false
        type: string
        default: ''
      detect-secrets:
        description: >-
          Scan for secrets. Set to false when the caller runs its own secrets
          gate (e.g. a frontend job that would otherwise repeat a scan the
          Python job already did).
        required: false
        type: boolean
        default: true
      detect-secrets-scope:
        description: >-
          'all' scans every tracked file; 'changed' scans only the files that
          differ from the base commit. 'changed' needs the full history in the
          checkout, so it deepens the fetch.
        required: false
        type: string
        default: 'all'
      cache-dependency-path:
        description: >-
          Path to the requirements file that keys the pip cache. Without it
          setup-python falls back to `**/requirements.txt`, so a change to a
          requirements-dev.txt never busts the cache.
        required: false
        type: string
        default: ''
    secrets:
      CODECOV_TOKEN:
        required: false
      DOCKERHUB_USERNAME:
        description: "Optional. With DOCKERHUB_TOKEN, authenticates Docker Hub pulls (testcontainers etc.) to avoid the anonymous rate limit."
        required: false
      DOCKERHUB_TOKEN:
        required: false

jobs:
  # Fast, dependency-light feedback: ruff needs no ML/runtime deps, so this
  # reports in seconds instead of waiting behind type-and-test's full install.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Lint and format check with ruff
        run: ruff check . && ruff format --check .

  # Runs mypy, detect-secrets, pip-audit, and pytest. ruff/format live in the
  # separate `lint` job above — this job no longer lints, hence the name.
  type-and-test:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # 'changed' scope diffs against the base commit, so the history has
          # to be there. '0' is a non-empty string, so the expression below
          # stays truthy — the numeric 0 would not.
          fetch-depth: ${{ inputs.detect-secrets-scope == 'changed' && '0' || '1' }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Prefer an explicit dev/test requirements file. Otherwise fall back to an
          # editable install of the project (PEP 621 / setuptools) so both the tooling
          # AND the package itself are importable regardless of src/flat layout. Only
          # then plain runtime requirements. This avoids a silent "green but ran
          # nothing" when a repo keeps its dev deps in pyproject.toml and there is no
          # requirements-dev.txt for the command -v guards below to find.
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          elif [ -f pyproject.toml ] || [ -f setup.py ] || [ -f setup.cfg ]; then
            pip install -e ".[dev]" 2>/dev/null || pip install -e ".[test]" 2>/dev/null || pip install -e .
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
      - name: Log in to Docker Hub
        # Anonymous pulls from shared runner IPs hit Docker Hub's rate limit
        # (429); falls back to anonymous when the secrets are absent.
        uses: s3ntin3l8/.github/.github/actions/dockerhub-login@3b9d7cfd58090eb37898f24d654a0788f944e090 # main @ 2026-10-10
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Type check with mypy
        # Advisory by default (continue-on-error): a repo that has never run mypy
        # would otherwise go instantly red on adoption. Set strict-checks: true
        # once the repo's mypy baseline is clean to make this a hard gate.
        continue-on-error: ${{ !inputs.strict-checks }}
        run: |
          if command -v mypy &> /dev/null; then mypy .; fi
      - name: Detect secrets
        # Always a hard gate: a committed secret should fail the build regardless
        # of strict-checks. Callers that run their own gate set
        # `detect-secrets: false` so the same tree is not scanned twice.
        if: ${{ inputs.detect-secrets && hashFiles('.secrets.baseline') != '' }}
        env:
          SCOPE: ${{ inputs.detect-secrets-scope }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if command -v detect-secrets-hook &> /dev/null && [ -f .secrets.baseline ]; then
            if [ "$SCOPE" != "changed" ]; then
              git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline --
              exit 0
            fi
            # 'changed' scope: only the files this push touched can have
            # introduced a secret.
            #
            # detect-secrets matches a known secret by filename, hash and
            # type -- not by line number. A secret that shifts lines is still
            # recognised, and the hook rewrites the baseline's line number
            # and exits 3 rather than reporting the secret as new. That is
            # why a changed file whose baselined secret moved still fails the
            # build until the baseline is refreshed.
            base=""
            for candidate in "$PR_BASE_SHA" "$MERGE_GROUP_BASE_SHA" "$PUSH_BEFORE_SHA"; do
              if [ -n "$candidate" ] \
                && [ "$candidate" != "0000000000000000000000000000000000000000" ] \
                && git cat-file -e "${candidate}^{commit}" 2>/dev/null; then
                base="$candidate"
                break
              fi
            done
            if [ -z "$base" ]; then
              echo "::notice::No base commit available; scanning the whole tree."
              git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline --
              exit 0
            fi
            echo "Scanning the files changed since $base"
            # The file list is NUL-delimited and unquoted. A path with
            # whitespace in it must not be split into several arguments, and a
            # path with non-ASCII characters must not be C-quoted -- either
            # would make detect-secrets skip the file and report a clean
            # scan. `--` ends the option list, so a filename that starts with
            # a dash is a filename and not an option.
            # Per-job temp dir, not a fixed /tmp path: a self-hosted runner can host
            # two jobs at once, and they must not clobber each other's list.
            scan_list="$RUNNER_TEMP/scanned-files.bin"
            git -c core.quotepath=false diff --name-only -z --diff-filter=ACMR "$base" HEAD -- \
              > "$scan_list"
            # The files the baseline listed before this change, so removing a
            # baseline entry for a file this push did not touch is still
            # caught: the secret is found, and with no entry it is new.
            # A base with no baseline file has nothing to add. But if there IS one and
            # it cannot be read, say so: dropping it silently would scan fewer files
            # and still report a clean scan.
            if git cat-file -e "$base:.secrets.baseline" 2>/dev/null; then
              if ! command -v jq > /dev/null; then
                echo "::error::jq is required to read the previous .secrets.baseline but is not installed on this runner."
                exit 1
              fi
              git show "$base:.secrets.baseline" \
                | jq -j '.results | keys[] | ., "\u0000"' >> "$scan_list"
            fi
            if [ ! -s "$scan_list" ]; then
              echo "No files to scan."
              exit 0
            fi
            xargs -0 -a "$scan_list" detect-secrets-hook --baseline .secrets.baseline --
          fi
      - name: Dependency security scan
        # Advisory by default (continue-on-error): pinned/held major versions
        # commonly carry known CVEs that can't be bumped independently. Set
        # strict-checks: true once the repo's pip-audit baseline is clean.
        continue-on-error: ${{ !inputs.strict-checks }}
        run: |
          if command -v pip-audit &> /dev/null; then
            if [ -f requirements.txt ]; then
              pip-audit -r requirements.txt
            elif [ -f pyproject.toml ]; then
              # No requirements.txt: audit the resolved environment (the editable
              # install above pulled in the project's runtime deps).
              pip-audit
            fi
          fi
      - name: Run tests with coverage
        env:
          COVERAGE_SOURCE: ${{ inputs.coverage-source }}
          COVERAGE_FAIL_UNDER: ${{ inputs.coverage-fail-under }}
          TEST_PARALLEL: ${{ inputs.test-parallel }}
          # The suite gets a throwaway HOME and XDG directories, so a test
          # that reads the environment cannot reach the runner's real files.
          # TEST_ISOLATION_ROOT carries the root so the repository's own
          # conftest can give each parallel worker its own config root --
          # without that, the workers share one database file.
          TEST_ISOLATION_ROOT: ${{ runner.temp }}/test-isolation
        run: |
          if command -v pytest &> /dev/null; then
            mkdir -p "$TEST_ISOLATION_ROOT"
            parallel=()
            if [ -n "$TEST_PARALLEL" ]; then
              parallel=(-n "$TEST_PARALLEL" --dist loadfile)
            fi
            HOME="$TEST_ISOLATION_ROOT" \
            USERPROFILE="$TEST_ISOLATION_ROOT" \
            APPDATA="$TEST_ISOLATION_ROOT/AppData/Roaming" \
            LOCALAPPDATA="$TEST_ISOLATION_ROOT/AppData/Local" \
            XDG_CONFIG_HOME="$TEST_ISOLATION_ROOT/.config" \
            XDG_DATA_HOME="$TEST_ISOLATION_ROOT/.local/share" \
              pytest "${parallel[@]}" --basetemp "$TEST_ISOLATION_ROOT/pytest-tmp" \
                --cov="$COVERAGE_SOURCE" --cov-report=xml --junitxml=junit.xml \
                --cov-fail-under="$COVERAGE_FAIL_UNDER"
          fi
      - name: Upload coverage reports to Codecov
        continue-on-error: true  # reporting only; a Codecov outage must not fail CI
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Upload test results to Codecov (Test Analytics)
        # Upload even when tests FAIL — that is the point of Test Analytics — but
        # skip cleanly when there is no junit.xml (e.g. a lint-only repo with no pytest).
        if: ${{ !cancelled() && hashFiles('junit.xml') != '' }}
        continue-on-error: true  # reporting only; a Codecov outage must not fail CI
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit.xml
          fail_ci_if_error: false
