name: Workflow lint

on:
  pull_request:
    paths:
      - .github/workflows/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/**

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11 -ignore 'SC2086|SC2163' .github/workflows/*.yml

  # Advisory for now: the baseline has ~85 high-severity findings (mostly
  # unpinned-uses). Not a required check; drop continue-on-error once the
  # baseline is clean so new findings block.
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Audit GitHub Actions workflows
        run: |
          python -m pip install zizmor==1.30.1
          zizmor --offline --format plain .github/workflows
