name: Repo settings audit

# Fails when a public, non-archived repo of this owner does not require approval
# for ALL outside collaborators' fork PR workflows (`all_external_contributors`).
# That admin toggle is the real control keeping fork PRs off self-hosted runners
# (an in-file guard is not: a fork PR runs its own copy of the workflow file), and
# nothing else observes it. See SECURITY.md and s3ntin3l8/.github#139.
#
# Needs the repo secret REPO_SETTINGS_TOKEN: a fine-grained PAT (or App token) for
# this owner, all repositories, with "Administration: read" and "Metadata: read".
# The Hermes review App token gets 403 on this endpoint, so it cannot be reused.

on:
  schedule:
    - cron: '17 5 * * 1' # Mondays 05:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: repo-settings-audit
  cancel-in-progress: false

jobs:
  fork-pr-approval:
    name: fork-pr-approval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.REPO_SETTINGS_TOKEN }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Check fork-pr-contributor-approval on every public repo
        shell: bash
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::REPO_SETTINGS_TOKEN is not set; the audit cannot run (see header comment)."
            exit 1
          fi
          repos=$(gh repo list "$OWNER" --visibility public --no-archived --limit 1000 --json name --jq '.[].name') || {
            echo "::error::could not list repositories for $OWNER"
            exit 1
          }
          [ -n "$repos" ] || { echo "::error::no public repositories found for $OWNER"; exit 1; }
          bad=0
          while read -r name; do
            policy=$(gh api "repos/$OWNER/$name/actions/permissions/fork-pr-contributor-approval" --jq .approval_policy 2>/dev/null) || policy="<unreadable>"
            if [ "$policy" = "all_external_contributors" ]; then
              echo "ok    $name"
            else
              echo "::error title=Fork PR approval::$OWNER/$name has approval_policy=$policy (want all_external_contributors)"
              bad=$((bad + 1))
            fi
          done <<< "$repos"
          echo "$bad repo(s) out of policy"
          [ "$bad" -eq 0 ]
