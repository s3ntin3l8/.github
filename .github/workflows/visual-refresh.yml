name: Visual refresh

# Keeps a repo's committed screenshots (README, PWA manifest, marketing stills) from going stale: runs the
# repo's `make screenshots`, and only when an image changed by more than a pixel tolerance pushes the result to
# one rolling branch and opens (or updates) one pull request. The caller adds `schedule` + `workflow_dispatch`.
# The tolerance matters: re-renders are not byte-identical (sub-pixel jitter in badges), so `git diff` is no
# trigger. The comparison is visual-kit's own `compare`, run from the image the repo pins in `visual/Dockerfile`.
#
# Identity and CI: the branch is pushed and the PR opened with GITHUB_TOKEN. GitHub then creates the PR's
# `pull_request` runs but holds them at `action_required` until a maintainer approves; with `actions: write` the
# same token approves them itself. That bypasses the approval gate for this workflow's own push, so the guards
# below are part of the design: only the `bot/` branch it just force-pushed, only runs whose head_sha is the
# commit it just pushed. The code pushed is images regenerated from the default branch by the repo's own target.
on:
  workflow_call:
    inputs:
      target:
        description: Make target that regenerates the images (it must leave them where `paths` says).
        required: false
        type: string
        default: 'screenshots'
      paths:
        description: Space-separated folders or files the target writes, relative to the repo root.
        required: false
        type: string
        default: 'docs/screenshots frontend/public/screenshots'
      max-diff-pixels:
        description: >-
          A PNG counts as changed when more than this many pixels differ (visual-kit compare). One number for every
          image: a scene's own `maxDiffPixels` in scenes.json does not apply, because the README/PWA files are named
          by the readme profile, not the check profile.
        required: false
        type: number
        default: 20
      branch:
        description: Rolling branch the refresh is force-pushed to. Must start with `bot/`.
        required: false
        type: string
        default: 'bot/refresh-screenshots'
      title:
        description: Pull request title (and commit message).
        required: false
        type: string
        default: 'chore: refresh screenshots'
      dockerfile:
        description: Dockerfile whose first FROM line names the visual-kit image used for the comparison.
        required: false
        type: string
        default: 'visual/Dockerfile'
      python-version:
        description: Python for the demo (empty = not installed).
        required: false
        type: string
        default: ''
      node-version:
        description: Node for the demo's frontend (empty = not installed).
        required: false
        type: string
        default: ''
      timeout-minutes:
        required: false
        type: number
        default: 45

# One refresh at a time per repo: two runs would force-push the same branch over each other.
concurrency:
  group: visual-refresh-${{ github.repository }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: write # push the rolling branch
      pull-requests: write # open or update the PR
      actions: write # approve the held pull_request runs of that push
    env:
      TARGET: ${{ inputs.target }}
      IMAGE_PATHS: ${{ inputs.paths }}
      MAX_DIFF_PIXELS: ${{ inputs.max-diff-pixels }}
      BRANCH: ${{ inputs.branch }}
      TITLE: ${{ inputs.title }}
      DOCKERFILE: ${{ inputs.dockerfile }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Refuse a branch that is not a bot branch
        run: |
          case "$BRANCH" in
            bot/?*) ;;
            *) echo "::error::branch must start with 'bot/' (got '$BRANCH'): the self-approval below is only allowed there."; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Always the default branch, whatever ref a maintainer dispatched from: the bot branch is built on top of
          # this checkout, so a dispatch from a feature branch must not carry its commits into an auto-approved PR.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        if: ${{ inputs.python-version != '' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Set up Node
        if: ${{ inputs.node-version != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Prepare the demo's dependencies
        run: |
          if [ -f .github/visual-setup.sh ]; then
            bash .github/visual-setup.sh
          else
            echo "No .github/visual-setup.sh: assuming the target needs nothing beyond Docker."
          fi

      - name: Regenerate the images
        run: make "$TARGET"

      - name: Compare old and new images
        id: compare
        run: |
          set -euo pipefail
          # Only the paths that exist: a repo may have just one of the default folders, and git errors on the other.
          existing=()
          for p in $IMAGE_PATHS; do
            # Kept when it exists or is still tracked, so a folder the target deleted reports its images as removed.
            if [ -e "$p" ] || [ -n "$(git ls-files -- "$p")" ]; then existing+=("$p"); fi
          done
          if [ "${#existing[@]}" -eq 0 ]; then
            echo "::error::none of the 'paths' input exists after 'make $TARGET' ($IMAGE_PATHS): check the input."
            exit 1
          fi
          printf '%s\n' "${existing[@]}" > "$RUNNER_TEMP/paths.txt"
          if [ -z "$(git status --porcelain -- "${existing[@]}")" ]; then
            echo "Nothing changed on disk."
            echo "refresh=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          image=$(awk 'toupper($1) == "FROM" { print $2; exit }' "$DOCKERFILE")
          if [ -z "$image" ]; then
            echo "::error::no FROM line in $DOCKERFILE: cannot tell which visual-kit image to compare with."
            exit 1
          fi
          # beyond FROM TO [ROWS]: sets BEYOND to how many images differ between two commits by more than the
          # tolerance (an added, removed or non-image file always counts) and appends a table row for each to ROWS.
          cat > "$RUNNER_TEMP/lib.sh" <<LIB
          IMAGE='$image'
          LIB
          cat >> "$RUNNER_TEMP/lib.sh" <<'LIB'
          beyond() {
            local from=$1 to=$2 rows=${3:-/dev/null} code file dir key n
            BEYOND=0
            rm -rf "$RUNNER_TEMP/cmp"; mkdir -p "$RUNNER_TEMP/cmp"; : > "$RUNNER_TEMP/cmp/dirs.txt"
            # Written to a file first so a failing git diff fails the step instead of looking like "nothing changed".
            xargs -d '\n' git -c core.quotePath=false diff --no-renames --name-status "$from" "$to" -- < "$RUNNER_TEMP/paths.txt" > "$RUNNER_TEMP/names.txt"
            while IFS=$'\t' read -r code file; do
              # The self-approval is justified by "only images": enforce it, do not assume it.
              case "$file" in
                *.png) ;;
                *) echo "::error::the target changed '$file', which is not a PNG: refusing to commit and auto-approve it."; exit 1 ;;
              esac
              case "$code" in
                A) BEYOND=$((BEYOND + 1)); echo "| \`$file\` | added |" >> "$rows"; continue ;;
                D) BEYOND=$((BEYOND + 1)); echo "| \`$file\` | removed |" >> "$rows"; continue ;;
              esac
              dir=$(dirname "$file"); key=$(printf '%s' "$dir" | tr '/' '_')
              mkdir -p "$RUNNER_TEMP/cmp/$key/old" "$RUNNER_TEMP/cmp/$key/new"
              git show "$from:$file" > "$RUNNER_TEMP/cmp/$key/old/$(basename "$file")"
              git show "$to:$file" > "$RUNNER_TEMP/cmp/$key/new/$(basename "$file")"
              printf '%s\n' "$dir" >> "$RUNNER_TEMP/cmp/dirs.txt"
            # shellcheck disable=SC2086
            done < "$RUNNER_TEMP/names.txt"
            while IFS= read -r dir; do
              [ -n "$dir" ] || continue
              key=$(printf '%s' "$dir" | tr '/' '_')
              docker run --rm --user "$(id -u):$(id -g)" -v "$RUNNER_TEMP/cmp/$key:/w" "$IMAGE" compare \
                --base /w/old --head /w/new --out /w/out --max-diff-pixels "$MAX_DIFF_PIXELS" > /dev/null
              n=$(jq '[.entries[] | select(.result == "changed")] | length' "$RUNNER_TEMP/cmp/$key/out/summary.json")
              BEYOND=$((BEYOND + n))
              jq -r --arg d "$dir" '.entries[] | select(.result == "changed") | "| `\($d)/\(.file)` | \(.pixels) px differ |"' \
                "$RUNNER_TEMP/cmp/$key/out/summary.json" >> "$rows"
            done < <(sort -u "$RUNNER_TEMP/cmp/dirs.txt")
          }
          LIB
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/lib.sh"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B "$BRANCH"
          git add -A -- "${existing[@]}"
          git commit -q -m "$TITLE"
          : > "$RUNNER_TEMP/rows.md"
          beyond HEAD^ HEAD "$RUNNER_TEMP/rows.md"
          echo "Images beyond ${MAX_DIFF_PIXELS} px: $BEYOND"
          if [ "$BEYOND" -eq 0 ]; then
            echo "Only jitter-level differences: not worth a PR."
            echo "refresh=false" >> "$GITHUB_OUTPUT"
          else
            echo "refresh=true" >> "$GITHUB_OUTPUT"
            echo "beyond=$BEYOND" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the rolling branch
        id: push
        if: ${{ steps.compare.outputs.refresh == 'true' }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/lib.sh"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          # A refresh the branch already holds (same base, images within the tolerance of it) is not pushed again:
          # a new commit would restart CI for nothing, and a re-render is never byte-identical.
          if git fetch -q "$remote" "$BRANCH" 2>/dev/null && [ "$(git rev-parse FETCH_HEAD^)" = "$(git rev-parse HEAD^)" ]; then
            beyond FETCH_HEAD HEAD
            if [ "$BEYOND" -eq 0 ]; then
              echo "The branch already holds this refresh."
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          git push -q --force "$remote" "HEAD:refs/heads/$BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open or update the pull request
        if: ${{ steps.compare.outputs.refresh == 'true' }}
        env:
          BEYOND: ${{ steps.compare.outputs.beyond }}
        run: |
          set -euo pipefail
          {
            echo "Regenerated by \`make $TARGET\` ([run]($RUN_URL)); $BEYOND image(s) differ by more than $MAX_DIFF_PIXELS px from \`$BASE_BRANCH\`."
            echo
            echo "| Image | Change |"
            echo "| --- | --- |"
            cat "$RUNNER_TEMP/rows.md"
            echo
            echo "Jitter-level differences in other images are included in the commit but did not trigger this PR."
            echo "This branch is rewritten by the next refresh; merge it or close it."
          } > "$RUNNER_TEMP/body.md"
          number=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$REPO" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
            echo "Updated #$number."
          else
            gh pr create --repo "$REPO" --head "$BRANCH" --base "$BASE_BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          fi

      - name: Approve the pull_request runs held for the pushed commit
        if: ${{ steps.push.outputs.pushed == 'true' }}
        env:
          SHA: ${{ steps.push.outputs.sha }}
        run: |
          set -euo pipefail
          # Guard: only the bot branch just force-pushed, and only runs for exactly that commit.
          case "$BRANCH" in bot/?*) ;; *) echo "::error::refusing to approve runs outside bot/*"; exit 1 ;; esac
          approved=0
          for _ in $(seq 1 24); do
            ids=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&event=pull_request&per_page=100" \
              --jq ".workflow_runs[] | select(.head_sha == \"$SHA\" and .head_branch == \"$BRANCH\" and .head_repository.full_name == \"$REPO\" and .conclusion == \"action_required\") | .id")
            for id in $ids; do
              gh api -X POST "repos/$REPO/actions/runs/$id/approve" --silent && approved=$((approved + 1))
            done
            # The runs appear a few seconds after the push, not all at once: keep looking until a pass finds none.
            if [ -n "$ids" ]; then sleep 10; continue; fi
            if [ "$approved" -gt 0 ]; then break; fi
            sleep 10
          done
          echo "Approved $approved held run(s) for $SHA."
          if [ "$approved" -eq 0 ]; then
            echo "::warning::no held pull_request run appeared for $SHA; if checks never start, approve them by hand."
          fi
