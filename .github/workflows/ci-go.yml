name: Go CI

on:
  workflow_call:
    inputs:
      go-version:
        description: "Override the Go version (e.g. '1.23'). Leave empty (default) to derive it from go-version-file (go.mod). NOTE: setup-go gives go-version precedence over go-version-file when both are set, so this must be empty for go.mod to win."
        required: false
        type: string
        default: ''
      go-version-file:
        description: "Path to a file with a 'go X.Y' directive. Used to pick the Go version when go-version is empty (the default)."
        required: false
        type: string
        default: 'go.mod'
      coverage-fail-under:
        description: "Minimum coverage percent required (0 disables the check, matching Go's -cover behavior)."
        required: false
        type: string
        default: '0'
      govulncheck-ignore:
        description: "Comma-separated govulncheck finding IDs (e.g. 'GO-2026-5932') to suppress. Only the listed IDs are ignored -- any other finding still fails the job. Leave empty (default) to fail on any finding, matching prior behavior. Use only for findings that are individually reviewed and have no available fix; re-check periodically and drop the ID once a real fix exists."
        required: false
        type: string
        default: ''
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version-file }}
          cache: true
      - name: Pre-build setup (optional)
        # Convention-based escape hatch for project-specific setup — most
        # commonly stubbing //go:embed assets so the backend builds in isolation
        # from the frontend. Put the logic in a version-controlled, reviewable
        # .github/ci-prebuild.sh; the workflow stays layout-agnostic and there is
        # no command string passed through workflow inputs.
        shell: bash
        run: |
          if [ -f .github/ci-prebuild.sh ]; then
            echo "::group::pre-build (.github/ci-prebuild.sh)"
            bash .github/ci-prebuild.sh
            echo "::endgroup::"
          fi
      - name: Format check with gofmt
        shell: bash
        run: |
          files="$(git ls-files '*.go')"
          if [ -z "$files" ]; then
            echo "No .go files; skipping gofmt."
            exit 0
          fi
          unformatted="$(gofmt -l $files)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - name: Static analysis with go vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Install the Go test tooling
        # Both tools are installed from the Go module proxy, and each one's
        # own go.mod declares the minimum Go it needs. `GOTOOLCHAIN=local`
        # (set by actions/setup-go) means the toolchain cannot be fetched to
        # satisfy that, so `@latest` breaks the build for every repository
        # whose Go is older than the newest release's requirement -- which is
        # what happened with golang.org/x/vuln v1.9.0 (Go 1.26) against a
        # Go 1.25 runner. Pick the newest release the runner's Go actually
        # satisfies instead, so a new upstream release cannot turn every
        # repository red at once.
        shell: bash
        run: |
          version_ge() { [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -1)" = "$2" ]; }
          go_minor="$(go env GOVERSION | sed 's/^go//' | cut -d. -f1,2)"

          pick() {
            # $1: "go-minor:version" entries, newest requirement first
            local entry need ver
            for entry in $1; do
              need="${entry%%:*}"
              ver="${entry##*:}"
              if version_ge "$go_minor" "$need"; then
                echo "$ver"
                return 0
              fi
            done
            echo ""
          }

          gotestsum_version="$(pick '1.24:v1.13.0 1.23:v1.12.3 1.21:v1.12.2 1.13:v1.12.0')"
          govulncheck_version="$(pick '1.26:v1.9.0 1.25:v1.7.0 1.22:v1.1.4 1.21:v1.1.3 1.18:v1.1.2')"

          if [ -n "$gotestsum_version" ]; then
            echo "Installing gotestsum $gotestsum_version for $(go env GOVERSION)"
            go install "gotest.tools/gotestsum@${gotestsum_version}"
          else
            echo "::error::No gotestsum release supports Go $go_minor."
            exit 1
          fi
          if [ -n "$govulncheck_version" ]; then
            echo "Installing govulncheck $govulncheck_version for $(go env GOVERSION)"
            go install "golang.org/x/vuln/cmd/govulncheck@${govulncheck_version}"
          else
            echo "::error::No govulncheck release supports Go $go_minor."
            exit 1
          fi
      - name: Test with coverage
        # gotestsum runs `go test` and additionally writes a JUnit report for
        # Codecov Test Analytics. -coverpkg=./... forces per-package coverage so
        # the report reflects the full module, not just packages with tests.
        run: |
          "$(go env GOPATH)/bin/gotestsum" --junitfile junit.xml --format pkgname -- \
            -race -coverprofile=coverage.txt -covermode=atomic -coverpkg=./... ./...
      - name: Enforce coverage threshold
        # coverage-fail-under=0 disables the check (the default) so a brand-new
        # project doesn't fail out of the box. Bump the input in the caller
        # once the project has meaningful coverage to track.
        if: ${{ inputs.coverage-fail-under != '0' }}
        shell: bash
        env:
          COVERAGE_FAIL_UNDER: ${{ inputs.coverage-fail-under }}
        run: |
          pct="$(go tool cover -func=coverage.txt | awk '/^total:/ {gsub("%","",$3); print $3}')"
          echo "Total coverage: ${pct}%"
          awk -v got="$pct" -v need="$COVERAGE_FAIL_UNDER" \
            'BEGIN { if (got+0 < need+0) { printf "::error::coverage %.2f%% below threshold %.2f%%\n", got, need; exit 1 } }'
      - name: Upload coverage to Codecov
        continue-on-error: true  # reporting only; a Codecov outage must not fail CI
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt
          flags: go
          fail_ci_if_error: false
      - name: Upload test results to Codecov (Test Analytics)
        # Upload even when tests FAIL — the point of Test Analytics — when the
        # gotestsum JUnit report exists.
        if: ${{ !cancelled() && hashFiles('junit.xml') != '' }}
        continue-on-error: true  # reporting only; a Codecov outage must not fail CI
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit.xml
          flags: go
          fail_ci_if_error: false
      - name: Vulnerability scan with govulncheck
        # govulncheck is shipped as a module in the Go toolchain family, so we
        # install it on the fly rather than committing a pre-installed runner.
        # JSON output is used instead of relying on govulncheck's own exit
        # code -- that code is always 0 in `-format json` mode, by design, so
        # the pass/fail decision (and the govulncheck-ignore allowlist) is
        # applied here against the parsed findings instead.
        shell: bash
        env:
          GOVULNCHECK_IGNORE: ${{ inputs.govulncheck-ignore }}
        run: |
          "$(go env GOPATH)/bin/govulncheck" -format json ./... > govulncheck.json

          mapfile -t ignore < <(tr ',' '\n' <<<"$GOVULNCHECK_IGNORE" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' || true)
          mapfile -t found < <(jq -r 'select(.finding != null) | .finding.osv' govulncheck.json | sort -u)

          reported=()
          ignored=()
          for id in "${found[@]}"; do
            skip=""
            for ig in "${ignore[@]}"; do
              if [ "$id" = "$ig" ]; then
                skip="1"
                break
              fi
            done
            if [ -n "$skip" ]; then
              ignored+=("$id")
            else
              reported+=("$id")
            fi
          done

          if [ "${#ignored[@]}" -gt 0 ]; then
            echo "::warning::govulncheck-ignore suppressed: ${ignored[*]}"
          fi
          if [ "${#reported[@]}" -gt 0 ]; then
            echo "::error::govulncheck found unignored vulnerabilities: ${reported[*]}"
            exit 1
          fi
          echo "govulncheck: clean"
