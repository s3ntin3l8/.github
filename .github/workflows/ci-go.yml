name: Go CI

on:
  workflow_call:
    inputs:
      go-version:
        description: "Override the Go version (e.g. '1.23'). Leave empty (default) to derive it from go-version-file (go.mod). NOTE: setup-go gives go-version precedence over go-version-file when both are set, so this must be empty for go.mod to win."
        required: false
        type: string
        default: ''
      go-version-file:
        description: "Path to a file with a 'go X.Y' directive. Used to pick the Go version when go-version is empty (the default)."
        required: false
        type: string
        default: 'go.mod'
      coverage-fail-under:
        description: "Minimum coverage percent required (0 disables the check, matching Go's -cover behavior)."
        required: false
        type: string
        default: '0'
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version-file }}
          cache: true
      - name: Pre-build setup (optional)
        # Convention-based escape hatch for project-specific setup — most
        # commonly stubbing //go:embed assets so the backend builds in isolation
        # from the frontend. Put the logic in a version-controlled, reviewable
        # .github/ci-prebuild.sh; the workflow stays layout-agnostic and there is
        # no command string passed through workflow inputs.
        shell: bash
        run: |
          if [ -f .github/ci-prebuild.sh ]; then
            echo "::group::pre-build (.github/ci-prebuild.sh)"
            bash .github/ci-prebuild.sh
            echo "::endgroup::"
          fi
      - name: Format check with gofmt
        shell: bash
        run: |
          files="$(git ls-files '*.go')"
          if [ -z "$files" ]; then
            echo "No .go files; skipping gofmt."
            exit 0
          fi
          unformatted="$(gofmt -l $files)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - name: Static analysis with go vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test with coverage
        # gotestsum runs `go test` and additionally writes a JUnit report for
        # Codecov Test Analytics. -coverpkg=./... forces per-package coverage so
        # the report reflects the full module, not just packages with tests.
        run: |
          go install gotest.tools/gotestsum@latest
          "$(go env GOPATH)/bin/gotestsum" --junitfile junit.xml --format pkgname -- \
            -race -coverprofile=coverage.txt -covermode=atomic -coverpkg=./... ./...
      - name: Enforce coverage threshold
        # coverage-fail-under=0 disables the check (the default) so a brand-new
        # project doesn't fail out of the box. Bump the input in the caller
        # once the project has meaningful coverage to track.
        if: ${{ inputs.coverage-fail-under != '0' }}
        shell: bash
        env:
          COVERAGE_FAIL_UNDER: ${{ inputs.coverage-fail-under }}
        run: |
          pct="$(go tool cover -func=coverage.txt | awk '/^total:/ {gsub("%","",$3); print $3}')"
          echo "Total coverage: ${pct}%"
          awk -v got="$pct" -v need="$COVERAGE_FAIL_UNDER" \
            'BEGIN { if (got+0 < need+0) { printf "::error::coverage %.2f%% below threshold %.2f%%\n", got, need; exit 1 } }'
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt
          flags: go
          fail_ci_if_error: false
      - name: Upload test results to Codecov (Test Analytics)
        # Upload even when tests FAIL — the point of Test Analytics — when the
        # gotestsum JUnit report exists.
        if: ${{ !cancelled() && hashFiles('junit.xml') != '' }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit.xml
          flags: go
          fail_ci_if_error: false
      - name: Vulnerability scan with govulncheck
        # govulncheck is shipped as a module in the Go toolchain family, so we
        # install it on the fly rather than committing a pre-installed runner.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
