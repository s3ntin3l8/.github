name: Cleanup GHCR

# Manifest-aware GHCR pruning, reusable across repos.
#
# Container images are often multi-arch (e.g. linux/amd64,arm64), so each tag is
# a manifest list whose per-arch and buildx attestation child manifests show up
# as *untagged* versions — referenced, not garbage. A naive untagged-delete
# (actions/delete-package-versions with delete-only-untagged) can't tell a live
# child manifest from a dangling one: it leaves a floor of untagged entries it
# can never clear and risks clipping a child of an older tag, breaking it on one
# architecture. This action parses the manifest lists, deletes only genuinely
# dangling digests, and validates that every surviving tag still resolves.
#
# Two kinds of *tagged* leftovers need their own rule, because the untagged sweep
# never sees them:
#   - `sha-<shortsha>` build tags (one per edge build): keep the newest N.
#   - `audit-<run>-<attempt>` candidate tags from docker-publish's `audit-command`
#     flow. They stay on the audited digest after it is promoted; on a superseded
#     :edge build or a failed audit they are the image's only tag and keep it alive
#     forever. `delete-tags` on a tag whose image has other tags only unlinks the
#     tag; the image goes (with its per-arch children, attestations and cosign
#     signature) only when that was its last tag.

on:
  workflow_call:
    inputs:
      package-name:
        required: true
        type: string
      package-type:
        required: false
        type: string
        default: 'container'
      dry-run:
        description: 'Simulate — log what would be deleted without deleting'
        required: false
        type: boolean
        default: false
      # Accepted for back-compat with existing callers; no longer wired. The
      # manifest-aware action keeps every referenced child automatically, so the
      # old "keep N untagged" workaround (for the non-aware delete action) is
      # unnecessary — and `keep-n-untagged` is mutually exclusive with
      # `delete-untagged`, which we use to clear all genuinely-dangling digests.
      min-versions-to-keep:
        required: false
        type: number
        default: 0
      # docker-publish.yml stamps a unique `sha-<shortsha>` tag on every edge build
      # (type=sha in its metadata-action block), separate from the moving `edge` tag.
      # Those are genuinely tagged, not untagged, so the untagged-pruning step below
      # never touches them — left alone they accumulate one image per push to main
      # forever. Keep only the newest N as a rollback/debug window.
      keep-n-sha-tagged:
        description: 'How many sha-<shortsha> build tags to retain, newest first'
        required: false
        type: number
        default: 10
      # docker-publish's `audit-command` flow tags the candidate `audit-<run>-<attempt>`
      # and never removes it (see the header). Keep it long enough to inspect a failed
      # audit; the evidence artifact itself lives 90 days in Actions.
      audit-retention:
        description: 'How long to keep audit-<run>-<attempt> candidate tags, e.g. "7 days"'
        required: false
        type: string
        default: '7 days'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # dataaxiom/ghcr-cleanup-action v1.2.2 (pinned — the action can delete
      # registry images; Dependabot bumps the comment + SHA together).
      - name: Prune dangling GHCR images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f
        with:
          package: ${{ inputs.package-name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          delete-untagged: true
          delete-partial-images: true
          delete-ghost-images: true
          validate: true
          dry-run: ${{ inputs.dry-run }}

      # Scoped to the `sha-*` pattern via delete-tags, so `edge`/semver/`latest` tags
      # are never even considered — only stale per-commit build tags are pruned.
      - name: Prune old sha-tagged build images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f
        with:
          package: ${{ inputs.package-name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          delete-tags: 'sha-*'
          keep-n-tagged: ${{ inputs.keep-n-sha-tagged }}
          validate: true
          dry-run: ${{ inputs.dry-run }}

      # The `audit-*` tag is dropped from a promoted image (it keeps its release/edge
      # tags) and takes a superseded or failed-audit image with it once it is old enough.
      - name: Prune old audit candidate tags
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f
        with:
          package: ${{ inputs.package-name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          delete-tags: 'audit-*'
          older-than: ${{ inputs.audit-retention }}
          validate: true
          dry-run: ${{ inputs.dry-run }}
