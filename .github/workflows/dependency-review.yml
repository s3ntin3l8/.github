name: 'Dependency Review'

on:
  workflow_call:

jobs:
  dependency-review:
    # Free on public repos; requires GitHub Advanced Security on private ones
    # (would otherwise fail the job with a 403). Skip silently — matches the
    # consumer-side guard in `pocket-portfolio-tracker` and any future Pattern
    # A' wrapper. Bake it into the reusable so every caller is auto-protected
    # without per-wrapper config.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
