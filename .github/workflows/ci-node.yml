name: Node.js CI

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '22'
      build-script:
        required: false
        type: string
        default: 'build'
      test-script:
        description: >-
          npm script to run for tests. Set to 'test:coverage' (or any script
          that generates a coverage report) to enable coverage upload and
          optional threshold enforcement.
        required: false
        type: string
        default: 'test'
      coverage-fail-under:
        description: >-
          Minimum coverage percent required. 0 (the default) disables the
          check so a new project doesn't fail out of the box. Bump once the
          project has meaningful coverage to track. Only effective when the
          test script produces a coverage/coverage-summary.json (vitest v8).
        required: false
        type: string
        default: '0'
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # Detect scripts with `npm pkg get` (exact key lookup) instead of grepping
      # `npm run` output — the latter matched any script whose name OR body merely
      # contained "test"/"lint", and happily ran the `npm init` default
      # `"test": "...exit 1"` stub. `npm pkg get scripts.X` returns `{}` when absent.
      - name: Lint
        run: |
          lint=$(npm pkg get scripts.lint)
          if [ "$lint" != "{}" ] && [ -n "$lint" ]; then
            npm run lint
          else
            echo "No lint script defined; skipping."
          fi
      - name: Test
        run: |
          # Use the caller-specified test script (defaults to 'test').
          # If the script doesn't exist, fall back gracefully.
          script_key="${{ inputs.test-script }}"
          script_val=$(npm pkg get "scripts.$script_key")
          if [ "$script_val" = "{}" ] || [ -z "$script_val" ]; then
            echo "No '$script_key' script defined; skipping tests."
          elif printf '%s' "$script_val" | grep -q "no test specified"; then
            echo "Default 'npm init' test stub detected; skipping."
          else
            npm run "$script_key"
          fi
      - name: Enforce coverage threshold
        # coverage-fail-under=0 disables the check (the default) so a brand-new
        # project doesn't fail out of the box. Only runs when a vitest v8
        # coverage summary exists.
        if: ${{ inputs.coverage-fail-under != '0' }}
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "::error::coverage-fail-under is set but coverage/coverage-summary.json was not found. Ensure your test script generates vitest v8 coverage."
            exit 1
          fi
          pct=$(jq '.total.lines.pct' coverage/coverage-summary.json)
          echo "Total line coverage: ${pct}%"
          awk -v got="$pct" -v need="${{ inputs.coverage-fail-under }}" \
            'BEGIN { if (got+0 < need+0) { printf "::error::coverage %.1f%% below threshold %s%%\n", got, need; exit 1 } }'
      - name: Upload coverage to Codecov
        # Upload if a coverage report was generated (vitest v8 writes to
        # coverage/ by default). Not an error if absent — the project may not
        # have coverage configured.
        if: ${{ hashFiles('coverage/coverage-summary.json') != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          flags: node
          fail_ci_if_error: false
      - name: Build
        run: |
          build=$(npm pkg get "scripts.${{ inputs.build-script }}")
          if [ "$build" != "{}" ] && [ -n "$build" ]; then
            npm run "${{ inputs.build-script }}"
          else
            echo "No '${{ inputs.build-script }}' script defined; skipping build."
          fi