name: Node.js CI

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '22'
      working-directory:
        description: >-
          Directory containing package.json (relative to the repo root). All
          shell steps run there; `actions/setup-node` and Codecov paths are
          computed relative to the repo root. Default '.' assumes a
          top-level package.json.
        required: false
        type: string
        default: '.'
      cache-dependency-path:
        description: >-
          Path to the lockfile (relative to the repo root) for npm cache
          keying. Default 'package-lock.json' assumes a top-level lockfile;
          override to 'web/package-lock.json' (etc.) for monorepos.
        required: false
        type: string
        default: 'package-lock.json'
      build-script:
        required: false
        type: string
        default: 'build'
      build-env:
        description: >-
          Extra environment variables for the build step, one KEY=VALUE per
          line (e.g. 'NEXT_TELEMETRY_DISABLED=1'). Blank and '#' comment lines
          are ignored. Empty (the default) sets nothing.
        required: false
        type: string
        default: ''
      typecheck-script:
        description: >-
          npm script for type checking (e.g. 'typecheck'). Empty string (the
          default) skips the step entirely. Pass 'typecheck' to opt in.
        required: false
        type: string
        default: ''
      test-script:
        description: >-
          npm script to run for tests. Set to 'test:coverage' (or any script
          that generates a coverage report) to enable coverage upload and
          optional threshold enforcement.
        required: false
        type: string
        default: 'test'
      coverage-fail-under:
        description: >-
          Minimum coverage percent required. 0 (the default) disables the
          check so a new project doesn't fail out of the box. Bump once the
          project has meaningful coverage to track. Only effective when the
          test script writes an istanbul json-summary report
          (coverage/coverage-summary.json — vitest v8, jest, c8, ...).
        required: false
        type: string
        default: '0'
      test-shards:
        description: >-
          Split the test step across N parallel jobs (vitest/jest `--shard`
          syntax, appended to the test script via `npm run <script> --
          --shard=i/N`). 1 (the default) is a NO-OP: the original single
          `lint-and-test` job runs unchanged, so every existing caller is
          unaffected unless it explicitly opts in. When > 1, tests run in a
          `test-shard` matrix + a `test-merge` job that combines per-shard
          coverage and enforces `coverage-fail-under` once over the union —
          per-shard coverage is NEVER gated individually. Sharded coverage
          merging requires the test script's coverage reporter to include
          istanbul's `json` reporter (which writes `coverage-final.json`) in
          addition to `json-summary` — vitest: add `"json"` to
          `coverage.reporter`; jest: add `"json"` to `coverageReporters`.
          Requires an npm script that accepts pass-through CLI args (true for
          `vitest run ...` and `jest ...`).
        required: false
        type: string
        default: '1'
      turbo-cache:
        description: >-
          Cache Turborepo's local cache directories (`**/.turbo` under
          working-directory) across CI runs, keyed by commit SHA with an
          OS-scoped restore-key fallback. On by default — safe even for
          non-Turborepo callers (`actions/cache` no-ops on a path that
          doesn't exist, just a cheap cache-miss check) and can't produce a
          stale/wrong result for Turborepo callers either, since Turbo's own
          hashing is content-based: a changed input simply misses and
          reruns. Set to `false` to opt out.
        required: false
        type: boolean
        default: true
      strict-checks:
        description: >-
          Fail the job on detect-secrets findings instead of reporting them
          advisory-only (same convention as ci-python.yml's input of the same
          name). Defaults to false: a repo whose baseline is stale relative to
          its current tree, or that has never audited it, would otherwise go
          instantly red on adoption. Flip to true once `detect-secrets scan
          --baseline .secrets.baseline` (and, for real findings, `detect-secrets
          audit .secrets.baseline`) comes back clean.
        required: false
        type: boolean
        default: false
      format-check-script:
        description: >-
          npm script for format checking (e.g. 'format:check'). Empty string (the
          default) skips the step entirely. Pass 'format:check' to opt in.
        required: false
        type: string
        default: ''
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  # Computes the shard matrix as a JSON array (e.g. test-shards=3 -> [1,2,3]) so
  # `test-shard` below can consume it via `strategy.matrix.shard`. Only runs when
  # sharding is actually requested — kept out of `lint-and-test` so that job's step
  # list stays byte-for-byte identical to before this input existed.
  shard-plan:
    if: ${{ fromJSON(inputs.test-shards) > 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - id: plan
        env:
          TEST_SHARDS: ${{ inputs.test-shards }}
        run: |
          shards=$(jq -nc --argjson n "$TEST_SHARDS" '[range(1; $n + 1)]')
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # `defaults: run` applies only to `run:` steps; `actions/setup-node`, the Codecov
    # `uses:` steps, and `actions/cache` run with the workspace root and need
    # explicitly-constructed paths (see WD_PREFIX env var below).
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    # WD_PREFIX is either '' (working-directory == '.') or 'subdir/' (working-directory == 'subdir').
    # All workspace-root-relative paths (codecov `directory:`, actions/cache `path:`,
    # etc.) are constructed from this so they work whether the package lives at the
    # repo root or in a subdirectory. The shell-based coverage/test-results checks
    # below are NOT built from this — they use plain relative paths inside the
    # `defaults: run: working-directory` and therefore naturally resolve correctly
    # without manual prefixing.
    # SHARDED-here is true when this run's Test/coverage steps are handled by the
    # separate test-shard + test-merge jobs instead of inline below — every step from
    # "Test" through "Upload test results to Codecov" is gated on it being false, so
    # with the default test-shards=1 this job's step list and behavior are unchanged
    # from before test-shards existed.
    env:
      WD_PREFIX: ${{ inputs.working-directory == '.' && '' || format('{0}/', inputs.working-directory) }}
      SHARDED: ${{ fromJSON(inputs.test-shards) > 1 }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
      - name: Cache Turbo
        if: ${{ inputs.turbo-cache }}
        uses: actions/cache@v4
        with:
          path: ${{ format('{0}**/.turbo', env.WD_PREFIX) }}
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - name: Install dependencies
        run: npm ci
      # Opt-in on file presence (same convention as ci-python.yml): a repo gets
      # scanning for free the moment it commits a .secrets.baseline, no caller
      # YAML change needed. hashFiles() is workspace-root-relative regardless of
      # `defaults: run: working-directory`, so this and the step below correctly
      # look at the repo root even for monorepo callers. Advisory by default
      # (continue-on-error) — verified against three real repos with existing
      # baselines before this landed: one was clean, but two had stale
      # baselines/unaudited findings (mostly false-positive "Secret Keyword"
      # hits on GitHub Actions' own `secrets:` YAML key) that would have gone
      # instantly red as a hard gate. Set strict-checks: true once a repo's
      # baseline is verified clean. Pinned to the same detect-secrets version
      # .pre-commit-config.yaml uses, so CI and local pre-commit can't diverge.
      # Uses actions/setup-python rather than the runner's system Python to
      # avoid PEP 668 "externally-managed-environment" errors on newer Ubuntu
      # images.
      - name: Set up Python (for detect-secrets)
        if: ${{ hashFiles('.secrets.baseline') != '' }}
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Detect secrets
        if: ${{ hashFiles('.secrets.baseline') != '' }}
        continue-on-error: ${{ !inputs.strict-checks }}
        working-directory: .
        run: |
          pip install --quiet detect-secrets==1.5.0
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
      # Detect scripts with `npm pkg get` (exact key lookup) instead of grepping
      # `npm run` output — the latter matched any script whose name OR body merely
      # contained "test"/"lint", and happily ran the `npm init` default
      # `"test": "...exit 1"` stub. `npm pkg get scripts.X` returns `{}` when absent.
      # Caller-controlled inputs are passed via `env:` (never inlined into run).
      - name: Lint
        run: |
          lint=$(npm pkg get scripts.lint)
          if [ "$lint" != "{}" ] && [ -n "$lint" ]; then
            npm run lint
          else
            echo "No lint script defined; skipping."
          fi
      - name: Format check
        if: ${{ inputs.format-check-script != '' }}
        env:
          FORMAT_CHECK_SCRIPT: ${{ inputs.format-check-script }}
        run: |
          fc_val=$(npm pkg get "scripts.$FORMAT_CHECK_SCRIPT")
          if [ "$fc_val" = "{}" ] || [ -z "$fc_val" ]; then
            echo "No '$FORMAT_CHECK_SCRIPT' script defined; skipping."
          else
            npm run "$FORMAT_CHECK_SCRIPT"
          fi
      - name: Typecheck
        if: ${{ inputs.typecheck-script != '' }}
        env:
          TYPECHECK_SCRIPT: ${{ inputs.typecheck-script }}
        run: |
          tc_val=$(npm pkg get "scripts.$TYPECHECK_SCRIPT")
          if [ "$tc_val" = "{}" ] || [ -z "$tc_val" ]; then
            echo "No '$TYPECHECK_SCRIPT' script defined; skipping."
          else
            npm run "$TYPECHECK_SCRIPT"
          fi
      - name: Test
        if: ${{ env.SHARDED == 'false' }}
        env:
          TEST_SCRIPT: ${{ inputs.test-script }}
        run: |
          # Use the caller-specified test script (defaults to 'test').
          # If the script doesn't exist, fall back gracefully.
          script_val=$(npm pkg get "scripts.$TEST_SCRIPT")
          if [ "$script_val" = "{}" ] || [ -z "$script_val" ]; then
            echo "No '$TEST_SCRIPT' script defined; skipping tests."
          elif printf '%s' "$script_val" | grep -q "no test specified"; then
            echo "Default 'npm init' test stub detected; skipping."
          else
            npm run "$TEST_SCRIPT"
          fi
      - name: Probe coverage artifacts
        # `hashFiles()` in an `if:` is workspace-root-relative, which would
        # miss files inside a non-default `working-directory`. Do the check
        # in the shell (which inherits the working-directory from defaults)
        # and surface the result as a step output for downstream steps.
        # `always()` so the outputs are still set when the test step above
        # fails — the coverage-upload step can then skip gracefully instead
        # of the workflow bailing on a missing-output reference.
        if: ${{ always() && env.SHARDED == 'false' }}
        id: probe
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "has_coverage=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_coverage=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f junit.xml ] || ls test-results/*.xml >/dev/null 2>&1; then
            echo "has_junit=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_junit=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Enforce coverage threshold
        # coverage-fail-under=0 disables the check (the default) so a brand-new
        # project doesn't fail out of the box. Only runs when an istanbul
        # json-summary report exists (vitest v8 / jest / c8).
        if: ${{ env.SHARDED == 'false' && inputs.coverage-fail-under != '0' && steps.probe.outputs.has_coverage == 'true' }}
        env:
          COVERAGE_FAIL_UNDER: ${{ inputs.coverage-fail-under }}
        run: |
          pct=$(jq '.total.lines.pct' coverage/coverage-summary.json)
          echo "Total line coverage: ${pct}%"
          awk -v got="$pct" -v need="$COVERAGE_FAIL_UNDER" \
            'BEGIN { if (got+0 < need+0) { printf "::error::coverage %.1f%% below threshold %s%%\n", got, need; exit 1 } }'
      - name: Enforce coverage threshold (missing report)
        if: ${{ env.SHARDED == 'false' && inputs.coverage-fail-under != '0' && steps.probe.outputs.has_coverage == 'false' }}
        env:
          COVERAGE_FAIL_UNDER: ${{ inputs.coverage-fail-under }}
        run: |
          echo "::error::coverage-fail-under is set but coverage/coverage-summary.json was not found. Ensure your test script writes an istanbul json-summary report."
          exit 1
      - name: Upload coverage to Codecov
        # Upload if a coverage report was generated (istanbul json-summary writes
        # to coverage/). Not an error if absent — the project may not have
        # coverage configured.
        if: ${{ env.SHARDED == 'false' && steps.probe.outputs.has_coverage == 'true' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ${{ format('{0}coverage', env.WD_PREFIX) }}
          flags: node
          fail_ci_if_error: false
      - name: Upload test results to Codecov (Test Analytics)
        # Enabled when the test runner emits JUnit XML — configure it in your
        # project (vitest: --reporter=junit --outputFile=./test-results/junit.xml;
        # jest: jest-junit). Uploaded even on test failure (the point of Analytics).
        if: ${{ env.SHARDED == 'false' && !cancelled() && steps.probe.outputs.has_junit == 'true' }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: node
          fail_ci_if_error: false
      - name: Build
        env:
          BUILD_SCRIPT: ${{ inputs.build-script }}
          BUILD_ENV: ${{ inputs.build-env }}
        run: |
          build=$(npm pkg get "scripts.$BUILD_SCRIPT")
          if [ "$build" != "{}" ] && [ -n "$build" ]; then
            # Export caller-provided build env (KEY=VALUE lines), scoped to this step.
            if [ -n "$BUILD_ENV" ]; then
              while IFS= read -r line; do
                case "$line" in ''|'#'*) continue ;; esac
                export "$line"
              done <<< "$BUILD_ENV"
            fi
            npm run "$BUILD_SCRIPT"
          else
            echo "No '$BUILD_SCRIPT' script defined; skipping build."
          fi

  # Only runs when test-shards > 1 (see shard-plan). Runs in parallel with
  # lint-and-test (no `needs:` between them) — lint/typecheck/build no longer block
  # on, or get blocked by, the sharded test matrix.
  test-shard:
    needs: shard-plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.shard-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
      - name: Cache Turbo
        if: ${{ inputs.turbo-cache }}
        uses: actions/cache@v4
        with:
          path: ${{ inputs.working-directory == '.' && '' || format('{0}/', inputs.working-directory) }}**/.turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - name: Install dependencies
        run: npm ci
      # lint-and-test's Lint/Typecheck steps get workspace dependencies built for
      # free via Turbo's `dependsOn: ["^build"]` graph (see turbo.json), since Test
      # used to run later in that same job/filesystem. This job never runs Lint, so
      # it needs its own explicit build — callers whose tests resolve workspace
      # packages via each package's *built* output rather than source (e.g. a web
      # app with no src-alias override) fail import resolution without this.
      - name: Build dependencies
        env:
          BUILD_SCRIPT: ${{ inputs.build-script }}
          BUILD_ENV: ${{ inputs.build-env }}
        run: |
          build=$(npm pkg get "scripts.$BUILD_SCRIPT")
          if [ "$build" != "{}" ] && [ -n "$build" ]; then
            if [ -n "$BUILD_ENV" ]; then
              while IFS= read -r line; do
                case "$line" in ''|'#'*) continue ;; esac
                export "$line"
              done <<< "$BUILD_ENV"
            fi
            npm run "$BUILD_SCRIPT"
          else
            echo "No '$BUILD_SCRIPT' script defined; skipping build."
          fi
      - name: Test (shard ${{ matrix.shard }}/${{ inputs.test-shards }})
        env:
          TEST_SCRIPT: ${{ inputs.test-script }}
          SHARD: ${{ matrix.shard }}
          TOTAL_SHARDS: ${{ inputs.test-shards }}
        run: |
          script_val=$(npm pkg get "scripts.$TEST_SCRIPT")
          if [ "$script_val" = "{}" ] || [ -z "$script_val" ]; then
            echo "::error::No '$TEST_SCRIPT' script defined; test-shards > 1 requires one."
            exit 1
          fi
          npm run "$TEST_SCRIPT" -- --shard="${SHARD}/${TOTAL_SHARDS}"
      - name: Upload shard coverage
        # coverage-final.json is istanbul's raw per-file hit-map (NOT the
        # coverage-summary.json percentages) — test-merge needs the hit-maps to
        # compute an accurate union, since averaging per-shard percentages would be
        # wrong (shards cover disjoint file sets, not equal-sized samples of the same
        # files). Requires the caller's coverage reporter list to include "json".
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: |
            ${{ inputs.working-directory }}/coverage/coverage-final.json
            ${{ inputs.working-directory }}/junit.xml
            ${{ inputs.working-directory }}/test-results/*.xml
          if-no-files-found: ignore
          retention-days: 1

  # Only runs when test-shards > 1. Merges every shard's raw coverage hit-map into
  # one accurate report and enforces coverage-fail-under exactly once, over the
  # union — never per-shard (a per-shard gate would be meaningless, since no single
  # shard sees the whole codebase).
  test-merge:
    needs: test-shard
    if: ${{ always() && fromJSON(inputs.test-shards) > 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      WD_PREFIX: ${{ inputs.working-directory == '.' && '' || format('{0}/', inputs.working-directory) }}
    steps:
      # Unlike lint-and-test/test-shard, this job doesn't need source to merge
      # coverage or run tests — but codecov/codecov-action does need a real git
      # checkout present to resolve the repo root and relativize the shard
      # coverage's absolute (`/home/runner/work/...`) file paths against it.
      # Without this, Codecov's backend can't reconcile those paths against the
      # repo tree it fetches from GitHub and rejects the upload as an unusable
      # report (path mismatch / source code unavailable) — silent since the
      # upload step itself has fail_ci_if_error: false, so CI stays green while
      # every commit's coverage (and any PR diffed against it as a base) is lost.
      - uses: actions/checkout@v6
      - name: Fail if any shard failed
        # `needs: test-shard` without this check would leave test-merge simply not
        # running (shown as "skipped") when a shard fails — a skipped required check
        # can read as passing in some branch-protection configurations. Fail loudly
        # and explicitly instead.
        if: ${{ needs.test-shard.result != 'success' }}
        run: |
          echo "::error::One or more test shards failed (needs.test-shard.result=${{ needs.test-shard.result }})."
          exit 1
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-*
          path: ${{ inputs.working-directory }}/.shard-artifacts
      - name: Merge shard coverage
        run: |
          mkdir -p .nyc_output coverage
          # Flatten each shard's coverage-final.json into .nyc_output/ under a unique
          # name — nyc's report command aggregates every *.json file found there.
          find .shard-artifacts -name coverage-final.json | nl -ba | while read -r idx path; do
            cp "$path" ".nyc_output/shard-${idx}.json"
          done
          if [ -z "$(ls -A .nyc_output 2>/dev/null)" ]; then
            echo "::error::No shard produced coverage/coverage-final.json — ensure the coverage reporter list includes \"json\" (see the test-shards input description)."
            exit 1
          fi
          # --exclude '' neutralizes nyc's own default exclude-glob list (test files,
          # mocha/karma/webpack configs, etc.) — each shard's coverage-final.json
          # already reflects exactly the file set the caller's own coverage tool
          # (e.g. Vitest, per its own coverage.exclude config) decided to instrument
          # and report. Re-applying nyc's unrelated defaults on top at merge time
          # would silently skew the merged percentage away from what a single
          # non-sharded run would produce.
          # --reporter=json regenerates a merged coverage-final.json — the RAW
          # per-line report Codecov's uploader actually parses (json-summary is
          # percentages-only and Codecov can't ingest it; a non-sharded run's
          # coverage/ has this because the caller's own coverage.reporter list
          # already includes "json", which is what feeds Codecov today).
          npx --yes nyc report --temp-dir .nyc_output --report-dir coverage \
            --reporter=json-summary --reporter=json --reporter=text --exclude ''
      - name: Enforce coverage threshold
        if: ${{ inputs.coverage-fail-under != '0' }}
        env:
          COVERAGE_FAIL_UNDER: ${{ inputs.coverage-fail-under }}
        run: |
          pct=$(jq '.total.lines.pct' coverage/coverage-summary.json)
          echo "Total line coverage (merged across ${{ inputs.test-shards }} shards): ${pct}%"
          awk -v got="$pct" -v need="$COVERAGE_FAIL_UNDER" \
            'BEGIN { if (got+0 < need+0) { printf "::error::coverage %.1f%% below threshold %s%%\n", got, need; exit 1 } }'
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ${{ format('{0}coverage', env.WD_PREFIX) }}
          flags: node
          fail_ci_if_error: false
      - name: Upload test results to Codecov (Test Analytics)
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: node
          fail_ci_if_error: false
