name: Node.js CI

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '22'
      working-directory:
        description: >-
          Directory containing package.json (relative to the repo root). All
          shell steps run there; `actions/setup-node` and Codecov paths are
          computed relative to the repo root. Default '.' assumes a
          top-level package.json.
        required: false
        type: string
        default: '.'
      cache-dependency-path:
        description: >-
          Path to the lockfile (relative to the repo root) for npm cache
          keying. Default 'package-lock.json' assumes a top-level lockfile;
          override to 'web/package-lock.json' (etc.) for monorepos.
        required: false
        type: string
        default: 'package-lock.json'
      build-script:
        required: false
        type: string
        default: 'build'
      shard-build-script:
        description: >-
          npm script to build the code a `test-shard` job needs, overriding
          `build-script` for the shard jobs ONLY. Empty (the default) means
          "use `build-script`". Set it to 'none' to skip the build step in
          every shard job: a `test-shard` job runs the test suite against
          the SOURCE tree, so a caller whose tests do not resolve workspace
          packages through their built output (e.g. a TS project whose tests
          import `src/` directly) pays for a full `npm run build` per shard
          for nothing. `lint-and-test` still builds once, so a broken build
          is still caught.

          The skip is the literal string 'none', not an empty string: an
          empty value is indistinguishable from "not set" and means "use
          `build-script`".
        required: false
        type: string
        default: ''
      build-env:
        description: >-
          Extra environment variables for the build step, one KEY=VALUE per
          line (e.g. 'NEXT_TELEMETRY_DISABLED=1'). Blank and '#' comment lines
          are ignored. Empty (the default) sets nothing.
        required: false
        type: string
        default: ''
      typecheck-script:
        description: >-
          npm script for type checking (e.g. 'typecheck'). Empty string (the
          default) skips the step entirely. Pass 'typecheck' to opt in.
        required: false
        type: string
        default: ''
      test-script:
        description: >-
          npm script to run for tests. Set to 'test:coverage' (or any script
          that generates a coverage report) to enable coverage upload and
          optional threshold enforcement.
        required: false
        type: string
        default: 'test'
      coverage-fail-under:
        description: >-
          Minimum coverage percent required. 0 (the default) disables the
          check so a new project doesn't fail out of the box. Bump once the
          project has meaningful coverage to track. Only effective when the
          test script writes an istanbul json-summary report
          (coverage/coverage-summary.json — vitest v8, jest, c8, ...).
        required: false
        type: string
        default: '0'
      test-shards:
        description: >-
          Split the test step across N parallel jobs (vitest/jest `--shard`
          syntax, appended to the test script via `npm run <script> --
          --shard=i/N`). 1 (the default) is a NO-OP: the original single
          `lint-and-test` job runs unchanged, so every existing caller is
          unaffected unless it explicitly opts in. When > 1, tests run in a
          `test-shard` matrix + a `test-merge` job that combines per-shard
          coverage and enforces `coverage-fail-under` once over the union —
          per-shard coverage is NEVER gated individually. Sharded coverage
          merging requires the test script's coverage reporter to include
          istanbul's `json` reporter (which writes `coverage-final.json`) in
          addition to `json-summary` — vitest: add `"json"` to
          `coverage.reporter`; jest: add `"json"` to `coverageReporters`.
          Requires an npm script that accepts pass-through CLI args (true for
          `vitest run ...` and `jest ...`).
        required: false
        type: string
        default: '1'
      test-shard-matrix:
        description: >-
          The shard matrix as a JSON array of shard indices (e.g. '[1,2,3,4]'),
          consumed directly by the `test-shard` job's `strategy.matrix.shard`.
          Unlike `test-shards`, this needs no `shard-plan` job to compute the
          array — GitHub cannot build a numeric range into a matrix, which is
          why the count-based input has to spend a whole runner job on `jq`.
          When set, `test-shard-matrix` wins over `test-shards` and the
          `shard-plan` job is skipped. The shard COUNT still has to be
          passed as `test-shards` for the `--shard=i/N` argument and the
          `test-merge` job's `if:`, so set both.
        required: false
        type: string
        default: ''
      artifact-prefix:
        description: >-
          A short prefix that namespaces this caller's shard coverage
          artifacts, e.g. '-frontend'. The artifacts are named
          `coverage-shard<prefix>-<n>` and `test-merge` downloads
          `coverage-shard<prefix>-*`.

          It matters when ONE workflow run calls this reusable workflow more
          than once with sharding on: artifact names are scoped to the RUN,
          not to the caller, so two sharded callers both uploading
          `coverage-shard-1` collide — and `test-merge` then downloads the
          WRONG map (the other caller's), silently merging two workspaces'
          coverage into one report. Give each sharded caller its own prefix
          ('-backend', '-frontend', ...). Empty (the default) keeps today's
          names exactly, which is correct for the common case of a single
          sharded caller per run.
        required: false
        type: string
        default: ''
      turbo-cache:
        description: >-
          Cache Turborepo's local cache directories (`**/.turbo` under
          working-directory) across CI runs, keyed by commit SHA with an
          OS-scoped restore-key fallback. On by default — safe even for
          non-Turborepo callers (`actions/cache` no-ops on a path that
          doesn't exist, just a cheap cache-miss check) and can't produce a
          stale/wrong result for Turborepo callers either, since Turbo's own
          hashing is content-based: a changed input simply misses and
          reruns. Set to `false` to opt out.
        required: false
        type: boolean
        default: true
      next-cache:
        description: >-
          Cache Next.js's build cache (`**/.next/cache` under working-directory)
          across CI runs, so `next build` reuses compiled output and the
          optimised-image cache instead of starting cold. Keyed by the lockfile
          plus a hash of the JS/TS sources, with restore-key fallbacks to the
          same lockfile and then the OS: this is the layout Next.js documents,
          and a partial hit is safe because Next validates its own cache
          entries. On by default for the same reason as `turbo-cache`:
          `actions/cache` no-ops on a path that doesn't exist, so a caller
          without Next.js pays only a cheap cache-miss check. Set to `false`
          to opt out (e.g. when Turborepo already restores `.next`).
        required: false
        type: boolean
        default: true
      strict-checks:
        description: >-
          Fail the job on detect-secrets findings instead of reporting them
          advisory-only (same convention as ci-python.yml's input of the same
          name). Defaults to false: a repo whose baseline is stale relative to
          its current tree, or that has never audited it, would otherwise go
          instantly red on adoption. Flip to true once `detect-secrets scan
          --baseline .secrets.baseline` (and, for real findings, `detect-secrets
          audit .secrets.baseline`) comes back clean.
        required: false
        type: boolean
        default: false
      format-check-script:
        description: >-
          npm script for format checking (e.g. 'format:check'). Empty string (the
          default) skips the step entirely. Pass 'format:check' to opt in.
        required: false
        type: string
        default: ''
      detect-secrets:
        description: >
          Scan for secrets. Set to false when the caller already runs a secrets
          gate over the same tree (e.g. a Python job in the same workflow), so
          the whole repository is not scanned twice per run.
        required: false
        type: boolean
        default: true
      detect-secrets-scope:
        description: >
          'all' scans every tracked file; 'changed' scans only the files that
          differ from the base commit. 'changed' needs the full history in the
          checkout, so it deepens the fetch.
        required: false
        type: string
        default: 'all'
      test-pool:
        description: >
          Vitest worker pool (e.g. 'vmThreads'). Empty keeps Vitest's default.
          'vmThreads' reuses one jsdom environment per worker instead of
          building one per test file, which is markedly faster on jsdom suites.
        required: false
        type: string
        default: ''
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  # Computes the shard matrix as a JSON array (e.g. test-shards=3 -> [1,2,3]) so
  # `test-shard` below can consume it via `strategy.matrix.shard`. Only runs when
  # sharding is actually requested — kept out of `lint-and-test` so that job's step
  # list stays byte-for-byte identical to before this input existed.
  #
  # SKIPPED when the caller supplies `test-shard-matrix` directly: this job
  # spends a whole runner (spin-up included) to run `jq` and emit `[1..N]`,
  # which the caller can just as well write out. `test-shard-matrix` wins
  # when both are set.
  shard-plan:
    if: ${{ fromJSON(inputs.test-shards) > 1 && inputs.test-shard-matrix == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - id: plan
        env:
          TEST_SHARDS: ${{ inputs.test-shards }}
        run: |
          shards=$(jq -nc --argjson n "$TEST_SHARDS" '[range(1; $n + 1)]')
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # `defaults: run` applies only to `run:` steps; `actions/setup-node`, the Codecov
    # `uses:` steps, and `actions/cache` run with the workspace root and need
    # explicitly-constructed paths (see WD_PREFIX env var below).
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    # WD_PREFIX is either '' (working-directory == '.') or 'subdir/' (working-directory == 'subdir').
    # All workspace-root-relative paths (codecov `directory:`, actions/cache `path:`,
    # etc.) are constructed from this so they work whether the package lives at the
    # repo root or in a subdirectory. The shell-based coverage/test-results checks
    # below are NOT built from this — they use plain relative paths inside the
    # `defaults: run: working-directory` and therefore naturally resolve correctly
    # without manual prefixing.
    # SHARDED-here is true when this run's Test/coverage steps are handled by the
    # separate test-shard + test-merge jobs instead of inline below — every step from
    # "Test" through "Upload test results to Codecov" is gated on it being false, so
    # with the default test-shards=1 this job's step list and behavior are unchanged
    # from before test-shards existed.
    env:
      WD_PREFIX: ${{ format('{0}/', inputs.working-directory) }}
      SHARDED: ${{ fromJSON(inputs.test-shards) > 1 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # 'changed' scope diffs against the base commit, so the history has
          # to be there. '0' is a non-empty string, so the expression below
          # stays truthy — the numeric 0 would not.
          fetch-depth: ${{ inputs.detect-secrets-scope == 'changed' && '0' || '1' }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
      - name: Cache Turbo
        if: ${{ inputs.turbo-cache }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ format('{0}**/.turbo', env.WD_PREFIX) }}
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - name: Cache Next.js build
        if: ${{ inputs.next-cache }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.WD_PREFIX }}**/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles(inputs.cache-dependency-path) }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx', '!**/node_modules/**', '!**/.next/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles(inputs.cache-dependency-path) }}-
            nextjs-${{ runner.os }}-
      - name: Install dependencies
        run: npm ci
      # Opt-in on file presence (same convention as ci-python.yml): a repo gets
      # scanning for free the moment it commits a .secrets.baseline, no caller
      # YAML change needed. hashFiles() is workspace-root-relative regardless of
      # `defaults: run: working-directory`, so this and the step below correctly
      # look at the repo root even for monorepo callers. Advisory by default
      # (continue-on-error) — verified against three real repos with existing
      # baselines before this landed: one was clean, but two had stale
      # baselines/unaudited findings (mostly false-positive "Secret Keyword"
      # hits on GitHub Actions' own `secrets:` YAML key) that would have gone
      # instantly red as a hard gate. Set strict-checks: true once a repo's
      # baseline is verified clean. Pinned to the same detect-secrets version
      # .pre-commit-config.yaml uses, so CI and local pre-commit can't diverge.
      # Uses actions/setup-python rather than the runner's system Python to
      # avoid PEP 668 "externally-managed-environment" errors on newer Ubuntu
      # images.
      - name: Set up Python (for detect-secrets)
        if: ${{ inputs.detect-secrets && hashFiles('.secrets.baseline') != '' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      # `pip install detect-secrets==1.5.0` below was previously uncached,
      # measured at ~20+ seconds per run in a real caller — on top of being a
      # single pinned version with no requirements file to key `setup-python`'s
      # own `cache: 'pip'` off of (unlike ci-python.yml's per-project deps).
      # Deliberately NOT keyed like "Cache Turbo" above (per-commit SHA +
      # restore-keys fallback): that pattern exists because Turbo cache
      # validity depends on the exact source tree at that commit, whereas
      # pip's own cache directory is already content-addressed internally by
      # package/wheel hash — a stable, version-agnostic key is strictly
      # better here (no restore-keys needed since this key never changes, and
      # a future bump of the pinned detect-secrets version doesn't require
      # touching this key at all; pip simply adds the new version's wheels
      # to the same warmed cache on next miss).
      - name: Cache pip (detect-secrets)
        if: ${{ inputs.detect-secrets && hashFiles('.secrets.baseline') != '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-detect-secrets-${{ runner.os }}
      - name: Detect secrets
        if: ${{ inputs.detect-secrets && hashFiles('.secrets.baseline') != '' }}
        continue-on-error: ${{ !inputs.strict-checks }}
        working-directory: .
        env:
          SCOPE: ${{ inputs.detect-secrets-scope }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          pip install --quiet detect-secrets==1.5.0
          if [ "$SCOPE" != "changed" ]; then
            git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline --
            exit 0
          fi
          # 'changed' scope: only the files this push touched can have
          # introduced a secret.
          #
          # detect-secrets matches a known secret by filename, hash and type
          # -- not by line number. A secret that shifts lines is still
          # recognised, and the hook rewrites the baseline's line number and
          # exits 3 rather than reporting the secret as new. That is why a
          # changed file whose baselined secret moved still fails the build
          # until the baseline is refreshed.
          base=""
          for candidate in "$PR_BASE_SHA" "$MERGE_GROUP_BASE_SHA" "$PUSH_BEFORE_SHA"; do
            if [ -n "$candidate" ] \
              && [ "$candidate" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "${candidate}^{commit}" 2>/dev/null; then
              base="$candidate"
              break
            fi
          done
          if [ -z "$base" ]; then
            echo "::notice::No base commit available; scanning the whole tree."
            git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline --
            exit 0
          fi
          echo "Scanning the files changed since $base"
          # The file list is NUL-delimited and unquoted. A path with
          # whitespace in it must not be split into several arguments, and a
          # path with non-ASCII characters must not be C-quoted -- either
          # would make detect-secrets skip the file and report a clean
          # scan. `--` ends the option list, so a filename that starts with
          # a dash is a filename and not an option.
          # Per-job temp dir, not a fixed /tmp path: a self-hosted runner can host
          # two jobs at once, and they must not clobber each other's list.
          scan_list="$RUNNER_TEMP/scanned-files.bin"
          git -c core.quotepath=false diff --name-only -z --diff-filter=ACMR "$base" HEAD -- \
            > "$scan_list"
          # The files the baseline listed before this change, so removing a
          # baseline entry for a file this push did not touch is still
          # caught: the secret is found, and with no entry it is new.
          # A base with no baseline file has nothing to add. But if there IS one and
          # it cannot be read, say so: dropping it silently would scan fewer files
          # and still report a clean scan.
          if git cat-file -e "$base:.secrets.baseline" 2>/dev/null; then
            if ! command -v jq > /dev/null; then
              echo "::error::jq is required to read the previous .secrets.baseline but is not installed on this runner."
              exit 1
            fi
            git show "$base:.secrets.baseline" \
              | jq -j '.results | keys[] | ., "\u0000"' >> "$scan_list"
          fi
          if [ ! -s "$scan_list" ]; then
            echo "No files to scan."
            exit 0
          fi
          xargs -0 -a "$scan_list" detect-secrets-hook --baseline .secrets.baseline --
      # Detect scripts with `npm pkg get` (exact key lookup) instead of grepping
      # `npm run` output — the latter matched any script whose name OR body merely
      # contained "test"/"lint", and happily ran the `npm init` default
      # `"test": "...exit 1"` stub. `npm pkg get scripts.X` returns `{}` when absent.
      # Caller-controlled inputs are passed via `env:` (never inlined into run).
      - name: Lint
        run: |
          lint=$(npm pkg get scripts.lint)
          if [ "$lint" != "{}" ] && [ -n "$lint" ]; then
            npm run lint
          else
            echo "No lint script defined; skipping."
          fi
      - name: Format check
        if: ${{ inputs.format-check-script != '' }}
        env:
          FORMAT_CHECK_SCRIPT: ${{ inputs.format-check-script }}
        run: |
          fc_val=$(npm pkg get "scripts.$FORMAT_CHECK_SCRIPT")
          if [ "$fc_val" = "{}" ] || [ -z "$fc_val" ]; then
            echo "No '$FORMAT_CHECK_SCRIPT' script defined; skipping."
          else
            npm run "$FORMAT_CHECK_SCRIPT"
          fi
      - name: Typecheck
        if: ${{ inputs.typecheck-script != '' }}
        env:
          TYPECHECK_SCRIPT: ${{ inputs.typecheck-script }}
        run: |
          tc_val=$(npm pkg get "scripts.$TYPECHECK_SCRIPT")
          if [ "$tc_val" = "{}" ] || [ -z "$tc_val" ]; then
            echo "No '$TYPECHECK_SCRIPT' script defined; skipping."
          else
            npm run "$TYPECHECK_SCRIPT"
          fi
      - name: Test
        if: ${{ env.SHARDED == 'false' }}
        env:
          TEST_SCRIPT: ${{ inputs.test-script }}
          TEST_POOL: ${{ inputs.test-pool }}
        run: |
          # Use the caller-specified test script (defaults to 'test').
          # If the script doesn't exist, fall back gracefully.
          script_val=$(npm pkg get "scripts.$TEST_SCRIPT")
          if [ "$script_val" = "{}" ] || [ -z "$script_val" ]; then
            echo "No '$TEST_SCRIPT' script defined; skipping tests."
          elif printf '%s' "$script_val" | grep -q "no test specified"; then
            echo "Default 'npm init' test stub detected; skipping."
          else
            pool=()
            if [ -n "$TEST_POOL" ]; then
              pool=(-- --pool="$TEST_POOL")
            fi
            npm run "$TEST_SCRIPT" "${pool[@]}"
          fi
      - name: Probe coverage artifacts
        # `hashFiles()` in an `if:` is workspace-root-relative, which would
        # miss files inside a non-default `working-directory`. Do the check
        # in the shell (which inherits the working-directory from defaults)
        # and surface the result as a step output for downstream steps.
        # `always()` so the outputs are still set when the test step above
        # fails — the coverage-upload step can then skip gracefully instead
        # of the workflow bailing on a missing-output reference.
        if: ${{ always() && env.SHARDED == 'false' }}
        id: probe
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "has_coverage=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_coverage=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f junit.xml ] || ls test-results/*.xml >/dev/null 2>&1; then
            echo "has_junit=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_junit=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Enforce coverage threshold
        # coverage-fail-under=0 disables the check (the default) so a brand-new
        # project doesn't fail out of the box. Only runs when an istanbul
        # json-summary report exists (vitest v8 / jest / c8).
        if: ${{ env.SHARDED == 'false' && inputs.coverage-fail-under != '0' && steps.probe.outputs.has_coverage == 'true' }}
        env:
          COVERAGE_FAIL_UNDER: ${{ inputs.coverage-fail-under }}
        run: |
          pct=$(jq '.total.lines.pct' coverage/coverage-summary.json)
          echo "Total line coverage: ${pct}%"
          awk -v got="$pct" -v need="$COVERAGE_FAIL_UNDER" \
            'BEGIN { if (got+0 < need+0) { printf "::error::coverage %.1f%% below threshold %s%%\n", got, need; exit 1 } }'
      - name: Enforce coverage threshold (missing report)
        if: ${{ env.SHARDED == 'false' && inputs.coverage-fail-under != '0' && steps.probe.outputs.has_coverage == 'false' }}
        env:
          COVERAGE_FAIL_UNDER: ${{ inputs.coverage-fail-under }}
        run: |
          echo "::error::coverage-fail-under is set but coverage/coverage-summary.json was not found. Ensure your test script writes an istanbul json-summary report."
          exit 1
      - name: Upload coverage to Codecov
        # Upload if a coverage report was generated (istanbul json-summary writes
        # to coverage/). Not an error if absent — the project may not have
        # coverage configured.
        if: ${{ env.SHARDED == 'false' && steps.probe.outputs.has_coverage == 'true' }}
        continue-on-error: true  # reporting only; a Codecov outage must not fail CI
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ${{ format('{0}coverage', env.WD_PREFIX) }}
          flags: node
          fail_ci_if_error: false
      - name: Upload test results to Codecov (Test Analytics)
        # Enabled when the test runner emits JUnit XML — configure it in your
        # project (vitest: --reporter=junit --outputFile=./test-results/junit.xml;
        # jest: jest-junit). Uploaded even on test failure (the point of Analytics).
        if: ${{ env.SHARDED == 'false' && !cancelled() && steps.probe.outputs.has_junit == 'true' }}
        continue-on-error: true  # reporting only; a Codecov outage must not fail CI
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: node
          fail_ci_if_error: false
      - name: Build
        env:
          BUILD_SCRIPT: ${{ inputs.build-script }}
          BUILD_ENV: ${{ inputs.build-env }}
        run: |
          build=$(npm pkg get "scripts.$BUILD_SCRIPT")
          if [ "$build" != "{}" ] && [ -n "$build" ]; then
            # Export caller-provided build env (KEY=VALUE lines), scoped to this step.
            if [ -n "$BUILD_ENV" ]; then
              while IFS= read -r line; do
                case "$line" in ''|'#'*) continue ;; esac
                export "$line"
              done <<< "$BUILD_ENV"
            fi
            npm run "$BUILD_SCRIPT"
          else
            echo "No '$BUILD_SCRIPT' script defined; skipping build."
          fi

  # Only runs when test-shards > 1 (see shard-plan). Runs in parallel with
  # lint-and-test (no `needs:` between them) — lint/typecheck/build no longer block
  # on, or get blocked by, the sharded test matrix.
  #
  # `!cancelled()` + an explicit readiness condition, rather than `always()`:
  # a job whose `needs:` a skipped job is itself skipped, so the shard job
  # would disappear when `shard-plan` is skipped (which is what
  # `test-shard-matrix` does). `!cancelled()` keeps a cancelled run from
  # starting fresh shards, and the second clause keeps a FAILED `shard-plan`
  # from starting shards with no matrix — in that case the job is skipped,
  # exactly as before, and `test-merge`'s "Fail if any shard failed" guard
  # turns it into a red required check.
  test-shard:
    needs: shard-plan
    if: ${{ !cancelled() && fromJSON(inputs.test-shards) > 1 && (needs.shard-plan.result == 'success' || inputs.test-shard-matrix != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    strategy:
      fail-fast: false
      matrix:
        # The caller's explicit matrix wins; otherwise fall back to the array
        # `shard-plan` computed from `test-shards`. The final `|| '[]'` keeps
        # `fromJSON` from erroring on an empty string if `shard-plan` itself
        # failed — an empty matrix leaves the shard job skipped, which
        # `test-merge`'s "Fail if any shard failed" guard turns into a red
        # required check (exactly as before this input existed).
        shard: ${{ fromJSON(inputs.test-shard-matrix || needs.shard-plan.outputs.shards || '[]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
      - name: Cache Turbo
        if: ${{ inputs.turbo-cache }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ format('{0}/', inputs.working-directory) }}**/.turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - name: Cache Next.js build
        if: ${{ inputs.next-cache }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ format('{0}/', inputs.working-directory) }}**/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles(inputs.cache-dependency-path) }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx', '!**/node_modules/**', '!**/.next/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles(inputs.cache-dependency-path) }}-
            nextjs-${{ runner.os }}-
      - name: Install dependencies
        run: npm ci
      # lint-and-test's Lint/Typecheck steps get workspace dependencies built for
      # free via Turbo's `dependsOn: ["^build"]` graph (see turbo.json), since Test
      # used to run later in that same job/filesystem. This job never runs Lint, so
      # it needs its own explicit build — callers whose tests resolve workspace
      # packages via each package's *built* output rather than source (e.g. a web
      # app with no src-alias override) fail import resolution without this.
      #
      # `shard-build-script` overrides `build-script` for the shard jobs only.
      # A caller whose tests run against the SOURCE tree (no src-alias override
      # needed) can set it to an empty string to skip this step entirely —
      # otherwise every shard pays for a full build it never uses. An empty
      # script name resolves to `{}` from `npm pkg get`, which the guard below
      # already treats as "skip the build".
      - name: Build dependencies
        env:
          BUILD_SCRIPT: ${{ inputs.shard-build-script || inputs.build-script }}
          BUILD_ENV: ${{ inputs.build-env }}
        run: |
          if [ "$BUILD_SCRIPT" = "none" ]; then
            echo "shard-build-script=none: this caller's shard jobs run against the source tree, so the build is skipped."
            exit 0
          fi
          build=$(npm pkg get "scripts.$BUILD_SCRIPT")
          if [ "$build" != "{}" ] && [ -n "$build" ]; then
            if [ -n "$BUILD_ENV" ]; then
              while IFS= read -r line; do
                case "$line" in ''|'#'*) continue ;; esac
                export "$line"
              done <<< "$BUILD_ENV"
            fi
            npm run "$BUILD_SCRIPT"
          else
            echo "No '$BUILD_SCRIPT' script defined; skipping build."
          fi
      - name: Test (shard ${{ matrix.shard }}/${{ inputs.test-shards }})
        env:
          TEST_SCRIPT: ${{ inputs.test-script }}
          TEST_POOL: ${{ inputs.test-pool }}
          SHARD: ${{ matrix.shard }}
          TOTAL_SHARDS: ${{ inputs.test-shards }}
          TEST_SHARD_MATRIX: ${{ inputs.test-shard-matrix }}
        run: |
          script_val=$(npm pkg get "scripts.$TEST_SCRIPT")
          if [ "$script_val" = "{}" ] || [ -z "$script_val" ]; then
            echo "::error::No '$TEST_SCRIPT' script defined; test-shards > 1 requires one."
            exit 1
          fi
          pool=()
          if [ -n "$TEST_POOL" ]; then
            pool=(--pool="$TEST_POOL")
          fi
          # When the caller supplied the matrix explicitly, its LENGTH is the
          # shard count — deriving it here means a matrix whose length
          # disagrees with `test-shards` still produces a correct
          # `--shard=i/N` (and therefore a correct, complete split) instead of
          # a malformed one.
          total="$TOTAL_SHARDS"
          if [ -n "$TEST_SHARD_MATRIX" ]; then
            total=$(printf '%s' "$TEST_SHARD_MATRIX" | jq 'length')
          fi
          npm run "$TEST_SCRIPT" -- --shard="${SHARD}/${total}" "${pool[@]}"
      - name: Upload shard coverage
        # coverage-final.json is istanbul's raw per-file hit-map (NOT the
        # coverage-summary.json percentages) — test-merge needs the hit-maps to
        # compute an accurate union, since averaging per-shard percentages would be
        # wrong (shards cover disjoint file sets, not equal-sized samples of the same
        # files). Requires the caller's coverage reporter list to include "json".
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-shard${{ inputs.artifact-prefix }}-${{ matrix.shard }}
          path: |
            ${{ inputs.working-directory }}/coverage/coverage-final.json
            ${{ inputs.working-directory }}/junit.xml
            ${{ inputs.working-directory }}/test-results/*.xml
          if-no-files-found: ignore
          retention-days: 1

  # Only runs when test-shards > 1. Merges every shard's raw coverage hit-map into
  # one accurate report and enforces coverage-fail-under exactly once, over the
  # union — never per-shard (a per-shard gate would be meaningless, since no single
  # shard sees the whole codebase).
  test-merge:
    needs: test-shard
    if: ${{ always() && fromJSON(inputs.test-shards) > 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      WD_PREFIX: ${{ format('{0}/', inputs.working-directory) }}
    steps:
      # Unlike lint-and-test/test-shard, this job doesn't need source to merge
      # coverage or run tests — but codecov/codecov-action does need a real git
      # checkout present to resolve the repo root and relativize the shard
      # coverage's absolute (`/home/runner/work/...`) file paths against it.
      # Without this, Codecov's backend can't reconcile those paths against the
      # repo tree it fetches from GitHub and rejects the upload as an unusable
      # report (path mismatch / source code unavailable) — silent since the
      # upload step itself has fail_ci_if_error: false, so CI stays green while
      # every commit's coverage (and any PR diffed against it as a base) is lost.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A red shard must not stop the test-results upload below: failing runs are the
      # case Codecov Test Analytics exists for. So the artifacts are downloaded
      # regardless, the coverage steps run only when every shard passed (a partial
      # merge is meaningless), and the explicit failure comes last.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ !cancelled() }}
        with:
          pattern: coverage-shard${{ inputs.artifact-prefix }}-*
          path: ${{ inputs.working-directory }}/.shard-artifacts
      - name: Merge shard coverage
        if: ${{ needs.test-shard.result == 'success' }}
        env:
          TEST_SHARDS: ${{ inputs.test-shards }}
          TEST_SHARD_MATRIX: ${{ inputs.test-shard-matrix }}
        run: |
          mkdir -p .nyc_output coverage
          # Flatten each shard's coverage-final.json into .nyc_output/ under a unique
          # name — nyc's report command aggregates every *.json file found there.
          find .shard-artifacts -name coverage-final.json | nl -ba | while read -r idx path; do
            cp "$path" ".nyc_output/shard-${idx}.json"
          done
          if [ -z "$(ls -A .nyc_output 2>/dev/null)" ]; then
            echo "::error::No shard produced coverage/coverage-final.json — ensure the coverage reporter list includes \"json\" (see the test-shards input description)."
            exit 1
          fi
          # Every shard must have contributed EXACTLY one map. A count that
          # is too low means a shard's artifact was overwritten by another
          # caller in this run uploading the same artifact name (artifact
          # names are scoped to the run, not the caller) — which merges the
          # WRONG workspace's coverage into this report and silently reports
          # a wrong percentage. A count that is too high means a stray
          # artifact was picked up by the download pattern. Either way, fail
          # loudly instead of reporting a number that means nothing.
          map_count=$(find .shard-artifacts -name coverage-final.json | wc -l | tr -d ' ')
          expected="$TEST_SHARDS"
          if [ -n "$TEST_SHARD_MATRIX" ]; then
            expected=$(printf '%s' "$TEST_SHARD_MATRIX" | jq 'length')
          fi
          if [ "$map_count" -ne "$expected" ]; then
            echo "::error::Expected $expected shard coverage map(s) but found $map_count — a shard artifact is missing, or another caller in this workflow uploaded an artifact with the same name. Give each sharded caller its own 'artifact-prefix'."
            exit 1
          fi
          # --exclude '' neutralizes nyc's own default exclude-glob list (test files,
          # mocha/karma/webpack configs, etc.) — each shard's coverage-final.json
          # already reflects exactly the file set the caller's own coverage tool
          # (e.g. Vitest, per its own coverage.exclude config) decided to instrument
          # and report. Re-applying nyc's unrelated defaults on top at merge time
          # would silently skew the merged percentage away from what a single
          # non-sharded run would produce.
          # --reporter=json regenerates a merged coverage-final.json — the RAW
          # per-line report Codecov's uploader actually parses (json-summary is
          # percentages-only and Codecov can't ingest it; a non-sharded run's
          # coverage/ has this because the caller's own coverage.reporter list
          # already includes "json", which is what feeds Codecov today).
          #
          # nyc is PINNED. `npx --yes nyc` fetches whatever npm serves at that
          # moment, so the coverage gate would run third-party code of
          # unstated version on every CI run, and would break whenever that
          # version's release happens to be broken. Bump the pin deliberately,
          # not by surprise.
          npx --yes nyc@18.0.0 report --temp-dir .nyc_output --report-dir coverage \
            --reporter=json-summary --reporter=json --reporter=text --exclude ''
      - name: Enforce coverage threshold
        if: ${{ needs.test-shard.result == 'success' && inputs.coverage-fail-under != '0' }}
        env:
          COVERAGE_FAIL_UNDER: ${{ inputs.coverage-fail-under }}
          TEST_SHARDS: ${{ inputs.test-shards }}
        run: |
          pct=$(jq '.total.lines.pct' coverage/coverage-summary.json)
          echo "Total line coverage (merged across ${TEST_SHARDS} shards): ${pct}%"
          awk -v got="$pct" -v need="$COVERAGE_FAIL_UNDER" \
            'BEGIN { if (got+0 < need+0) { printf "::error::coverage %.1f%% below threshold %s%%\n", got, need; exit 1 } }'
      - name: Upload coverage to Codecov
        if: ${{ needs.test-shard.result == 'success' }}
        continue-on-error: true  # reporting only; a Codecov outage must not fail CI
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ${{ format('{0}coverage', env.WD_PREFIX) }}
          flags: node
          fail_ci_if_error: false
      - name: Upload test results to Codecov (Test Analytics)
        if: ${{ !cancelled() }}
        continue-on-error: true  # reporting only; a Codecov outage must not fail CI
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: node
          fail_ci_if_error: false
      - name: Fail if any shard failed
        # `needs: test-shard` without this check would leave test-merge simply not
        # running (shown as "skipped") when a shard fails — a skipped required check
        # can read as passing in some branch-protection configurations. Fail loudly
        # and explicitly instead. Last, so the uploads above still happen.
        if: ${{ always() && needs.test-shard.result != 'success' }}
        run: |
          echo "::error::One or more test shards failed (needs.test-shard.result=${{ needs.test-shard.result }})."
          exit 1
