name: Node.js CI

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '22'
      build-script:
        required: false
        type: string
        default: 'build'

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # Detect scripts with `npm pkg get` (exact key lookup) instead of grepping
      # `npm run` output — the latter matched any script whose name OR body merely
      # contained "test"/"lint", and happily ran the `npm init` default
      # `"test": "...exit 1"` stub. `npm pkg get scripts.X` returns `{}` when absent.
      - name: Lint
        run: |
          lint=$(npm pkg get scripts.lint)
          if [ "$lint" != "{}" ] && [ -n "$lint" ]; then
            npm run lint
          else
            echo "No lint script defined; skipping."
          fi
      - name: Test
        run: |
          test_script=$(npm pkg get scripts.test)
          if [ "$test_script" = "{}" ] || [ -z "$test_script" ]; then
            echo "No test script defined; skipping."
          elif printf '%s' "$test_script" | grep -q "no test specified"; then
            echo "Default 'npm init' test stub detected; skipping."
          else
            npm run test
          fi
      - name: Build
        run: |
          build=$(npm pkg get "scripts.${{ inputs.build-script }}")
          if [ "$build" != "{}" ] && [ -n "$build" ]; then
            npm run "${{ inputs.build-script }}"
          else
            echo "No '${{ inputs.build-script }}' script defined; skipping build."
          fi
