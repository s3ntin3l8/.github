name: Hermes PR Review (reusable)

# Reusable workflow: any repo with a self-hosted runner can call this to get an AI
# review / triage posted back to a PR or issue by the <slug>[bot] GitHub App.
#
# ARCHITECTURE (remote execution model):
#   The runner container does NOT run Hermes. Instead it forwards the request to the
#   Hermes API server running on a separate host (hermes-01) over the LAN. The agent
#   executes THERE — full tools, memory, skills, github-code-review skill — and posts
#   the review back to GitHub itself using a GitHub App token it mints via app-token.sh.
#   This keeps the runner containers lightweight (no hermes venv) while preserving 100%
#   of the agent behaviour. See s3ntin3l8/.github#18.
#
#   - Runner side: mints a GitHub App token (only to resolve the PR/issue via `gh` for
#     trigger routing), checks the "@<slug>" mention, and relays the prompt to hermes-01.
#   - hermes-01 side (review-bot profile API server): runs the agent. The agent re-mints
#     its own App token from review-bot/.env and POSTs the review/comment.
#
# Triggers (define in the CALLING repo's workflow, not here — this is `workflow_call`).
# This workflow is ON-DEMAND ONLY: it runs when someone comments "@<slug>" (your App
# slug, e.g. "@s3ntin3l8-hermes") on a PR or issue. Automatic/bulk reviews are handled
# separately by a Hermes cronjob, per design. The mention substring is the `mention-trigger`
# input (the reusable job's "Check mention" step enforces it; default "hermes").
#   - issue_comment:             created, body contains "@<slug>"   (on-demand mode)
#       * on a PR  -> diff review (uses hermes-review-prompt.md)
#       * on an issue -> triage   (uses hermes-triage-prompt.md)
#   - pull_request:              [opened] (or opened,synchronize)    (auto mode, mode: auto)
#       * always reviews the PR (no mention needed); caller's `on:` is the gate.
# The target (PR vs issue) is resolved at run time, so the same job serves both.
#
# IMPORTANT: do NOT subscribe to `pull_request_review_comment` (or `pull_request_review`).
# A submitted review fires those events, and the review body routinely contains the
# "@<slug>" string (e.g. when another bot like Claude reviews, or the bot itself
# echoes context). That re-triggers this workflow with NO human summon -> an unwanted
# cascade. On-demand @mention works through issue_comment alone (PR-conversation
# comments and issue comments BOTH arrive as issue_comment). See s3ntin3l8/.github#527.
#
# SECURITY (fork guard, automatic): for a `pull_request` event, GitHub runs the workflow
# file from the PR's own head ref — i.e. a fork's copy of this file — on the runner the
# job-level `if:` lets it reach. The job-level guard below skips the run when the head
# repo is a fork (full_name != this repo), so a stranger opening a fork PR cannot rewrite
# the job's `run:` steps to execute attacker code on the self-hosted runner host. Fork
# PRs get no secrets and a read-only token, but the runner itself (filesystem + LAN
# access to hermes-01) is the trust boundary, not the token. This guard is automatic in
# the reusable so callers cannot forget it; callers don't need to add their own copy.
# Found by s3ntin3l8-hermes[bot]'s review of s3ntin3l8/pocket-portfolio-tracker#720,
# which introduced an auto-review job that lacked the guard.
#
# SECURITY (trusted-commenter gate, automatic): the job-level `if:` below also enforces
# an author_association allow-list (MEMBER/OWNER/COLLABORATOR) on every on-demand event
# path, same as the fork guard's reasoning — automatic in the reusable so callers cannot
# forget it. Before this, the gate only existed where a caller remembered to copy it into
# its own `if:`, which left s3ntin3l8/mullion-helper and s3ntin3l8/tauri-app-template with
# NO gate at all: any public commenter on those (public) repos could trigger a run that
# inherits HERMES_* secrets on the self-hosted, LAN-reachable runner. See
# s3ntin3l8/mullion-helper#14. A caller MAY still keep its own copy of this check as
# defense-in-depth (as the fork guard already is in several callers) — it's redundant,
# not required.
#
# Required caller setup (once per calling repo):
#   1. Register a GitHub App with permissions Contents:Write (open PRs), Pull requests:
#      Read&write, Checks:Read&write, Issues:Write (triage); subscribe to Issue comment
#      + Pull request review comment events; install on the repo.
#   2. Repo secrets: HERMES_APP_ID, HERMES_APP_PRIVATE_KEY (used to resolve the PR/issue
#      on the runner), HERMES_API_KEY (bearer key for the hermes-01 API server).
#   3. Repo variable (optional): HERMES_MODEL (model override for the agent).
#   4. A self-hosted runner labelled `self-hosted` with `gh` + `curl`/`python3` on PATH.
#   5. A reachable Hermes API server on hermes-01 (review-bot profile) — started with
#      `hermes -p review-bot gateway`, API_SERVER_HOST bound to the LAN interface
#      (not 127.0.0.1), API_SERVER_PORT set, API_SERVER_KEY configured.
#
# Minimal caller example (in the *calling* repo's .github/workflows/hermes.yml):
#   name: Hermes (on-demand, @<slug>)
#   on:
#     issue_comment:
#       types: [created]
#   (do NOT add pull_request_review_comment — a submitted review fires that
#    event, and review bodies routinely contain "@<slug>", so it re-triggers
#    this workflow with NO human summon. issue_comment alone covers both
#    PR-conversation mentions and issue mentions.)
#   jobs:
#     hermes:
#       if: github.actor != 's3ntin3l8-hermes[bot]'
#       # NOTE: the fork guard AND the trusted-commenter (author_association) gate
#       # are both automatic in the reusable — no caller-side copy of either is
#       # required for this on-demand path or for an auto-review `pull_request` path;
#       # callers don't need to duplicate them.
#       permissions:
#         contents: read
#         pull-requests: write
#         issues: write
#         checks: write
#       uses: s3ntin3l8/.github/.github/workflows/hermes-review.yml@main
#       with:
#         mention-trigger: s3ntin3l8-hermes
#       secrets: inherit

on:
  workflow_call:
    # NOT `required: true`, deliberately. A dependabot-authored `pull_request` run is
    # handed only Dependabot secrets, so with `secrets: inherit` these arrive unset, and
    # GitHub rejects a call that omits a required secret before ANY step runs
    # ("Secret HERMES_APP_ID is required, but not provided while calling" -- a red check
    # on every dependency PR, which is why dependabot was excluded; seen in
    # runway-ai-usage-tracker runs before its #250). Optional here, enforced by the
    # "Preflight" step instead, which can tell a dependabot run (skip with a notice)
    # from a misconfigured caller (fail with a clear error).
    secrets:
      HERMES_APP_ID:
        required: false
        description: GitHub App numeric ID (from the App's settings page).
      HERMES_APP_PRIVATE_KEY:
        required: false
        description: GitHub App PEM private key.
      HERMES_API_KEY:
        required: false
        description: >-
          Bearer key for the hermes-01 API server (API_SERVER_KEY). Distinct from the
          App PEM. The agent uses this to authenticate the run; it mints the GitHub
          token itself for posting.
    inputs:
      hermes-api-url:
        required: false
        type: string
        default: http://192.168.2.6:8642/p/review-bot
        description: >-
          Base URL of the Hermes API server (review-bot profile) on hermes-01. Must be
          reachable from the runner over the LAN; points to the review-bot profile prefix
          on the multiplexed gateway (port 8642). Port 8643 is kept as a compatibility
          proxy on hermes-01.
      mention-match:
        required: false
        type: string
        default: line-start
        description: >-
          How the "@<mention-trigger>" must appear in an on-demand comment. "line-start"
          (default) requires a line that STARTS with it, so a status report that merely
          mentions the bot ("Addressed the review from @<slug> in abc123") does not start a
          run; quoted lines and code blocks are ignored. "anywhere" restores the old
          substring match.
      hermes-api-model:
        required: false
        type: string
        default: hermes-agent
        description: Model name the API server advertises (API_SERVER_MODEL_NAME).
      mention-trigger:
        required: false
        type: string
        default: hermes
        description: >-
          Mention substring that triggers the bot (without the leading @). Defaults to
          "hermes". Set this to your GitHub App slug so comments like "@<slug>" fire the
          workflow — e.g. "s3ntin3l8-hermes". The reusable job's "Check mention" step
          enforces it, so the slug lives in exactly one place (the caller's with:). Also
          used to scope the re-trigger guard to this workflow's own bot login
          (`<mention-trigger>[bot]`), so other bots (e.g. CodeQL) reviewing the same
          target don't falsely count as "already acted".
      mode:
        required: false
        type: string
        default: on-demand
        description: >-
          Trigger mode. "on-demand" (default) requires an "@<mention-trigger>" mention
          on a PR/issue comment before reviewing. "auto" reviews every PR that triggers
          the workflow (e.g. a caller using `pull_request: [opened]`) with no mention
          needed — the caller's `on:` decides when to run. Both modes share the same
          relay + prompt; auto mode skips the mention check and resolves the PR number
          from github.event.pull_request. The re-trigger guard (anti-push-spam) only
          applies in auto mode — an on-demand "@mention" is itself the human's explicit
          request for a fresh review and is never skipped just because something already
          reviewed the target before.
      hermes-model:
        required: false
        type: string
        default: ''
        description: >-
          Model override passed to the agent (e.g. anthropic/claude-sonnet-4). Empty =>
          falls back to the repo variable HERMES_MODEL, then the agent's profile default.
      max-turns:
        required: false
        type: number
        default: 30
        description: Max agent turns for the run (guards against runaway runs).
      prompt-path:
        required: false
        type: string
        default: hermes-review-prompt.md
        description: Path (relative to the shared/workflow repo root) of the PR review recipe.
      issue-prompt-path:
        required: false
        type: string
        default: hermes-triage-prompt.md
        description: Path (relative to the shared/workflow repo root) of the issue triage recipe.
      hermes-react:
        required: false
        type: boolean
        default: true
        description: >-
          React with 👀 to the comment that asked for the review (or to the PR body, for the
          auto-review on open), once a review has
          actually been dispatched (a NEW Hermes run was accepted: not a skip, not a replay of
          an existing run, not a refusal or a failure). Needs `hermes-use-runs: true`, the only
          path that can tell a dispatch from a silent no-op, and an App with Issues and Pull
          requests write. Best-effort: a failure to react never fails the review. Set false to
          turn it off.
      hermes-use-runs:
        required: false
        type: boolean
        default: false
        description: >-
          Dispatch through Hermes' Runs API (POST /v1/runs) and poll the run to completion,
          failing the check if it ends failed/interrupted and writing the bot's reply to the
          job summary. Default false keeps the legacy fire-and-forget POST to
          /v1/chat/completions, which cannot tell a long healthy run from a silent failure.
          The polling job holds its runner for the length of the review, so give the repo a
          second self-hosted runner before opting in. The poll window is 45 minutes; a run
          still going after it leaves the job green with a warning (it is not a verdict on
          the review) and the "Hermes review" marker check pending until a later round sees
          the run finished.
      hermes-review-scope:
        required: false
        type: string
        default: delta
        description: >-
          What a follow-up review round covers. "delta" (default) reviews only the commits
          since the bot's last landed review, so a round is small, fast and focused on what
          actually changed; "full" re-reviews the whole pull request every time.
      hermes-review-ledger:
        required: false
        type: string
        default: check-run
        description: >-
          Where the "a review is already in flight for this PR" marker lives. "check-run"
          (default) writes a check run on the reviewed head whose external_id is the Hermes
          run id, so a later request can find the live run, wait for it, or stop it when the
          head moved on. "off" disables the marker (every request dispatches).
      hermes-review-ledger-name:
        required: false
        type: string
        default: Hermes review
        description: >-
          The check-run name the in-flight marker uses. Renaming it orphans existing
          markers: a request would no longer see a review that started under the old name.

jobs:
  hermes-review:
    # FAIL-CLOSED ALLOW-LIST, mirroring claude-code.yml's shape: one arm per event
    # type, each carrying its own trust check, ORed together. Any event type nobody
    # anticipated (e.g. a caller mistakenly subscribing to something new) evaluates
    # to none-of-the-arms-match -> false -> skipped, instead of running unchecked.
    # The "@<mention-trigger>" substring itself is still checked separately in the
    # "Check mention" step below (using the mention-trigger input) — this `if:` only
    # gates WHO is allowed to trigger a run, not WHAT they said.
    #
    # issue_comment / pull_request_review_comment / pull_request_review / issues:
    # on-demand mode, gated by author_association (MEMBER/OWNER/COLLABORATOR) on
    # that event's own payload path. Centralized here instead of copy-pasted into
    # every caller — previously this gate only existed where a caller remembered to
    # add its own copy, which left mullion-helper and tauri-app-template with NO
    # gate at all (any public commenter could trigger a secret-inheriting run on a
    # self-hosted runner). See s3ntin3l8/mullion-helper#14.
    #
    # pull_request: auto mode (mode: auto). Composite condition, not
    # author_association (there's no comment to check authorship of):
    #   - fork guard (unchanged from before): skips when the head repo isn't this
    #     repo, so a fork PR can't rewrite this file to run attacker steps on the
    #     self-hosted runner. Automatic here so callers cannot forget it.
    #   - PR-author bot exclusion via github.event.pull_request.user.login, NOT
    #     github.actor: on `ready_for_review`, github.actor is whoever clicked
    #     "Ready for review" (not necessarily who opened the PR), so an
    #     actor-based check silently stops excluding bot-authored PRs on that
    #     trigger. Author-based exclusion holds on both `opened` and
    #     `ready_for_review`.
    #   - bot-author exclusion keeps only the Hermes bot itself (self-review) and
    #     github-actions[bot] (release-please: a changelog PR has nothing for a code
    #     review to say). dependabot[bot] is deliberately NOT excluded: a bump can
    #     change a runtime tool version without saying so (runway-ai-usage-tracker#627
    #     moved sigstore/cosign-installer v3 -> v4, silently taking the installed
    #     cosign from v2.2.4 to a v3.0.6 with a high-severity advisory), and a
    #     reviewer is exactly what catches that. See s3ntin3l8/.github#85. Dependabot
    #     runs only see Dependabot secrets, so the "Preflight" step below skips
    #     (green, with a notice) when they are not mirrored instead of failing.
    #   - mullion/task-* branch exclusion: Task Master's own reviewer bot already
    #     reviews its own task PRs (any Mullion-managed repo, not just
    #     mullion-session-manager's own codebase — Task Master operates across
    #     repos), so an auto-review here only races the task's approve/merge.
    #     Deliberately scoped to this arm only: on-demand (@mention) stays
    #     ungated, so a human can still explicitly ask for a second opinion on a
    #     Task Master PR. mullion-session-manager#998; the namespace's stability
    #     is a documented design invariant (see docs/superpowers/specs/
    #     2026-09-03-task-master-descriptive-branches-design.md in that repo).
    if: |
      github.actor != 's3ntin3l8-hermes[bot]' &&
      (
        (github.event_name == 'issue_comment' && contains(fromJSON('["MEMBER", "OWNER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(fromJSON('["MEMBER", "OWNER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' && contains(fromJSON('["MEMBER", "OWNER", "COLLABORATOR"]'), github.event.review.author_association)) ||
        (github.event_name == 'issues' && contains(fromJSON('["MEMBER", "OWNER", "COLLABORATOR"]'), github.event.issue.author_association)) ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 's3ntin3l8-hermes[bot]' &&
          github.event.pull_request.user.login != 'github-actions[bot]' &&
          !startsWith(github.event.pull_request.head.ref, 'mullion/task-')
        )
      )
    runs-on: self-hosted
    # The job timeout is the BACKSTOP, not the normal exit: the Runs-API poll window
    # (HERMES_POLL_SECONDS, default 2700 = 45 min, capped at 3000) must end well before
    # it, or a still-running review is cut off mid-poll with its marker left open and no
    # summary. Move the two together. Measured review jobs run 2-38 minutes.
    timeout-minutes: 60
    steps:
      # A `pull_request` run authored by dependabot[bot] gets Dependabot secrets, NOT
      # Actions secrets. A repo that has not mirrored HERMES_* into Settings -> Secrets
      # -> Dependabot would otherwise fail the App-token step and put a red check on
      # every dependency PR. Skip quietly instead; the notice says how to enable it.
      - name: Preflight (secrets visible to this run?)
        id: preflight
        env:
          HAS_APP_ID: ${{ secrets.HERMES_APP_ID != '' }}
          HAS_APP_KEY: ${{ secrets.HERMES_APP_PRIVATE_KEY != '' }}
          HAS_API_KEY: ${{ secrets.HERMES_API_KEY != '' }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          if [[ "$HAS_APP_ID" == "true" && "$HAS_APP_KEY" == "true" && "$HAS_API_KEY" == "true" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [[ "$PR_AUTHOR" == "dependabot[bot]" ]]; then
            echo "::notice::HERMES_APP_ID / HERMES_APP_PRIVATE_KEY / HERMES_API_KEY are not visible to this dependabot-authored run - skipping the review. Add them under Settings -> Secrets and variables -> Dependabot to enable auto-review of dependency PRs."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            # Anyone else with missing secrets is a real misconfiguration (they used to
            # be `required: true`, which failed the call): fail loudly, naming them.
            echo "::error::HERMES_APP_ID / HERMES_APP_PRIVATE_KEY / HERMES_API_KEY must all be set (present: app-id=$HAS_APP_ID, private-key=$HAS_APP_KEY, api-key=$HAS_API_KEY). Pass them with 'secrets: inherit'."
            exit 1
          fi

      # Early exit unless the comment actually contains the configured mention.
      # ONLY enforced in on-demand mode. In auto mode the caller's `on:` decides when
      # to run (e.g. pull_request opened), so we never skip on mention — but we still
      # skip if there is genuinely no body (defensive). The `mode` input drives this.
      # IMPORTANT: this step sets a `skip` output; every downstream step is gated on it
      # (see the `if: steps.check-mention.outputs.skip != 'true'` on each). A bare
      # `exit 0` here does NOT stop later steps — without the gate the relay would fire
      # on EVERY comment regardless of mention (this was the bug that made the bot
      # review on non-summoning comments, e.g. s3ntin3l8/.github#527 follow-up).
      - name: Check mention
        id: check-mention
        env:
          MENTION: ${{ inputs.mention-trigger }}
          MENTION_MATCH: ${{ inputs.mention-match }}
          MODE: ${{ inputs.mode }}
          BODY: ${{ github.event.comment.body || github.event.review.body || github.event.issue.body }}
          PREFLIGHT_SKIP: ${{ steps.preflight.outputs.skip }}
        run: |
          set -euo pipefail
          # Preflight found no usable secrets (dependabot run): gate every later step.
          if [[ "$PREFLIGHT_SKIP" == "true" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Auto mode: never skip on mention — the caller's trigger is the gate.
          if [[ "${MODE:-on-demand}" != "on-demand" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --- addressed(): keep byte-identical in hermes-review.yml and claude-code.yml
          # (scripts/test-mention-match.sh fails if they drift) ---
          # True when some line of the text STARTS with the handle (after whitespace), i.e. the
          # comment addresses the bot. A mention in the middle of a sentence ("Addressed the
          # review from @claude in abc123") only describes something to a human reader and must
          # not start a run. Quoted lines (> ...) and fenced code blocks are ignored, the match is
          # case-insensitive (GitHub handles are), a leading list marker or **bold** is allowed
          # ("- @claude review", "**@claude** review"), and the handle must end at a word boundary so
          # "@claudeX" and "@claude-foo" do not count. s3ntin3l8/.github#41, #42.
          addressed() { # $1 = text, $2 = handle without the leading @
            printf '%s\n' "$1" | tr -d '\r' | awk -v h="@$(printf '%s' "$2" | tr '[:upper:]' '[:lower:]')" '
              /^[ \t]*(```|~~~)/ { fence = !fence; next }
              fence || /^[ \t]*>/ { next }
              { line = tolower($0); sub(/^[ \t]+/, "", line)
                sub(/^([-*+]|[0-9]+[.)])[ \t]+/, "", line); sub(/^[*_]+/, "", line)
                if (index(line, h) == 1) {
                  nxt = substr(line, length(h) + 1, 1)
                  if (nxt !~ /^[A-Za-z0-9_-]$/) found = 1
                } }
              END { exit !found }'
          }
          # --- end addressed() ---
          if [[ "${MENTION_MATCH:-line-start}" == "anywhere" ]]; then
            matched() { grep -qiF "@$MENTION" <<< "$1"; }
          else
            matched() { addressed "$1" "$MENTION"; }
          fi
          if [[ -z "${BODY:-}" ]] || ! matched "$BODY"; then
            echo "::notice::No '@$MENTION' addressed to the bot (a line starting with it) — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0   # not a failure: leave the run green
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token (runner-side, for trigger resolution)
        id: app-token
        # After `Check mention` on purpose: a comment that does not address the bot (or a
        # dependabot run without secrets) skips here, before any secret is used or a token
        # is minted on the self-hosted runner. `Check mention` already folds the
        # preflight result into its `skip` output.
        if: steps.check-mention.outputs.skip != 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.HERMES_APP_ID }}
          private-key: ${{ secrets.HERMES_APP_PRIVATE_KEY }}
          # Least privilege: this token is only used by the re-trigger guard, which
          # reads reviews (pulls/N/reviews) and comments (issues/N/comments), and by
          # the review-scope/in-flight steps, which read the PR head and the bot's
          # last review and write the "review in flight" check run. The agent mints
          # its own full token via scripts/app-token.sh.
          permission-pull-requests: read
          permission-issues: read
          permission-checks: write
          # The in-flight query reads `pullRequest.commits`; on a PRIVATE repo GraphQL
          # rejects that ("Resource not accessible by integration") without contents:read.
          permission-contents: read

      # Resolve WHAT was mentioned, so we can route to the right prompt and tell the
      # agent which PR/issue to act on. Uses the runner-side App token (read-only view).
      - name: Resolve target (PR diff vs issue triage)
        id: target
        if: steps.check-mention.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          IS_PR_COMMENT: ${{ github.event.issue.pull_request != null && github.event_name == 'issue_comment' }}
          IS_PR_REVIEW: ${{ github.event_name == 'pull_request_review_comment' }}
          IS_PR_EVENT: ${{ github.event_name == 'pull_request' }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_REVIEW_COMMENT_PR_NUMBER: ${{ github.event.pull_request_review_comment.pull_request_number }}
        run: |
          set -euo pipefail
          # Resolve the PR number EXPLICITLY per event type. Do NOT use a cross-event
          # `||` chain like `github.event.issue.number || github.event.pull_request.number`:
          # for a `pull_request` event github.event.issue is undefined, and that chain
          # evaluates to EMPTY, so PR_NUM comes back blank and the agent falls back to
          # "most recent PR" — which can land on the WRONG repo (s3ntin3l8/.github#28
          # follow-up: auto-review on claude-remote-session reviewed pocket-portfolio-tracker#543).
          if [[ "$IS_PR_EVENT" == "true" ]]; then
            PR_NUM="$EVENT_PR_NUMBER"
          elif [[ "$IS_PR_COMMENT" == "true" ]]; then
            # PR-conversation comment: the PR number is the issue number itself.
            PR_NUM="$EVENT_ISSUE_NUMBER"
          elif [[ "$IS_PR_REVIEW" == "true" ]]; then
            PR_NUM="$EVENT_REVIEW_COMMENT_PR_NUMBER"
          fi
          if [[ -n "${PR_NUM:-}" ]]; then
            echo "kind=pr"         >> "$GITHUB_OUTPUT"
            echo "number=$PR_NUM" >> "$GITHUB_OUTPUT"
          else
            # Plain issue comment (no PR linked).
            ISSUE_NUM="$EVENT_ISSUE_NUMBER"
            echo "kind=issue"        >> "$GITHUB_OUTPUT"
            echo "number=$ISSUE_NUM" >> "$GITHUB_OUTPUT"
          fi

      # Guard against the bot re-triggering itself via a spammy sequence of pushes in
      # AUTO MODE ONLY (mode: auto — e.g. successive `synchronize` events on a PR the
      # bot already auto-reviewed). This intentionally does NOT apply in on-demand
      # mode: an explicit "@<mention-trigger>" comment is the human's deliberate,
      # in-the-moment request for a fresh review, and must never be silently
      # no-op'd just because *something* already reviewed the target before — that
      # defeats the entire on-demand feature (confirmed dead-on-arrival behavior on
      # claude-remote-session#13: a fresh mention would run "Check mention", pass,
      # then silently skip here, looking successful while posting nothing).
      #
      # Scoped to THIS workflow's own bot login (`<mention-trigger>[bot]`), not any
      # bot — matching ANY "[bot]"-suffixed login previously let unrelated reviews
      # (e.g. github-advanced-security[bot]/CodeQL) count as "already acted",
      # permanently disabling this guard's target bot on any repo with CodeQL enabled.
      #
      # IMPORTANT: this step sets a `skip` output, exactly like `check-mention` above.
      # Both downstream steps ("Checkout shared repo", "Run Hermes") gate on
      # `steps.guard.outputs.skip != 'true'` IN ADDITION TO check-mention's skip. When
      # this step doesn't run at all (on-demand mode, `if:` false), its output is
      # empty, and empty != 'true' is true, so downstream steps proceed normally.
      - name: Guard against re-trigger (auto mode only)
        id: guard
        if: steps.check-mention.outputs.skip != 'true' && inputs.mode == 'auto'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          KIND: ${{ steps.target.outputs.kind }}
          NUMBER: ${{ steps.target.outputs.number }}
          BOT_LOGIN: ${{ inputs.mention-trigger }}[bot]
        run: |
          set -euo pipefail
          # NOTE: `gh api --jq` takes exactly one argument (the filter) -- it does not
          # accept jq's own `--arg name value` flag the way a bare `jq` invocation
          # would (confirmed: `gh api ... --jq --arg bot "$BOT_LOGIN" '...'` errors
          # "accepts 1 arg(s), received 4"). That bug shipped silently for a while:
          # the failure was swallowed by `2>/dev/null || echo 0`, so this guard always
          # reported "no prior review found" and never actually skipped a re-trigger
          # (confirmed live on mullion-session-manager#16: a third bot review was
          # dispatched despite two non-dismissed reviews already posted). Use jq's
          # built-in `env` object instead -- it reads BOT_LOGIN from this step's own
          # `env:` block directly, with no `--arg`/quoting/injection concerns.
          if [[ "$KIND" == "pr" ]]; then
            # Already posted a (non-dismissed) review on this PR by THIS bot? -> skip.
            COUNT=$(gh api "repos/$REPO/pulls/$NUMBER/reviews" \
              --jq '[.[] | select(.user.login == env.BOT_LOGIN and .state != "DISMISSED")] | length' 2>/dev/null || echo 0)
          else
            # Already commented on this issue by THIS bot? -> skip.
            COUNT=$(gh api "repos/$REPO/issues/$NUMBER/comments" \
              --jq '[.[] | select(.user.login == env.BOT_LOGIN)] | length' 2>/dev/null || echo 0)
          fi
          if [[ "${COUNT:-0}" != "0" ]]; then
            echo "::notice::$BOT_LOGIN already acted on $KIND #$NUMBER ($COUNT prior) — skipping re-trigger."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Resolve WHAT a review round should cover, and whether the head has already
      # been reviewed.
      #
      # The commit the last round covered ("R") is the base of the next round's delta.
      # Two things fall out of that:
      #
      #   * If the PR's content at the current head is the content R had, nothing changed
      #     since it was reviewed, so there is nothing to do -> skip. This is what stops a
      #     storm of "@s3ntin3l8-hermes Review" comments on an unchanged PR from
      #     dispatching a review each time (observed live: 11 mentions on one PR, 21
      #     queued review turns in one Hermes session). "Same content" is the tree, not
      #     the SHA: a rebase or a recreated branch that changes nothing still skips, and
      #     an "Update branch" merge commit, which brings in code nobody reviewed, does not.
      #   * Otherwise the delta is R..(current head), so a follow-up round reads only what
      #     changed instead of the whole diff again.
      #
      # R is NOT read from `pulls/{n}/reviews[].commit_id` (s3ntin3l8/.github#129):
      # GitHub re-points an approval's `commit_id` at the PR's CURRENT head when the branch
      # tip is rewritten (a force-push, "Update branch"), so it is not a record of what
      # was reviewed. The record that stays put is the ledger: the "Hermes review" check
      # run sits on the commit it reviewed and does not follow the head. So R is the commit
      # of the newest ledger marker that
      #   * ended in SUCCESS (a stopped or failed run reviewed nothing), and
      #   * is PAIRED with a landed Hermes review submitted at or after the marker started
      #     (a run can complete without posting a review; dismissing the review retracts
      #     the pairing, which is the escape hatch for forcing another round).
      # Without a ledger (the legacy path, `hermes-review-ledger: off`, or no paired
      # marker) it falls back to the last landed review's `commit_id` -- but only while
      # that commit is not newer than the review itself; a newer one was re-pointed, so
      # nothing is known about what was covered and the whole diff is reviewed.
      # Mullion's relay applies the same rule: both feed the same range into the
      # idempotency key, so they have to agree or the two entry points stop
      # deduplicating against each other.
      #
      # Only a PR has a commit to pin; an issue triage (and a caller that asked for
      # "full" scope) has no head, no delta and no "already reviewed" skip.
      #
      # IMPORTANT: this step sets a `skip` output, like `check-mention` and `guard`
      # above; the downstream steps gate on it.
      - name: Resolve review scope (head, delta base, already reviewed?)
        id: scope
        if: steps.check-mention.outputs.skip != 'true' && steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          KIND: ${{ steps.target.outputs.kind }}
          NUMBER: ${{ steps.target.outputs.number }}
          OWNER: ${{ github.repository_owner }}
          SCOPE_MODE: ${{ inputs.hermes-review-scope }}
          BOT_LOGIN: ${{ inputs.mention-trigger }}[bot]
          LEDGER: ${{ inputs.hermes-review-ledger }}
          LEDGER_NAME: ${{ inputs.hermes-review-ledger-name }}
        run: |
          set -euo pipefail
          {
            echo "skip=false"
            echo "head="
            echo "base="
          } >> "$GITHUB_OUTPUT"
          if [[ "$KIND" != "pr" || "$SCOPE_MODE" != "delta" ]]; then
            exit 0
          fi
          HEAD_SHA=$(gh api "repos/$REPO/pulls/$NUMBER" --jq '.head.sha')
          if [[ -z "$HEAD_SHA" ]]; then
            echo "::error::Could not read the head commit of $REPO#$NUMBER — review NOT dispatched."
            exit 1
          fi
          # Hermes' landed reviews: APPROVED / CHANGES_REQUESTED / COMMENTED by THIS bot
          # (BOT_LOGIN, the same identity the re-trigger guard above uses). A PENDING
          # (draft) review never landed and a DISMISSED one was retracted.
          #
          # Only Hermes' own reviews count. A review by another bot (claude[bot], Copilot,
          # a Task Master reviewer) landing on the head must neither make an explicit
          # request a no-op nor become the base of Hermes' next delta -- that round would
          # then skip everything Hermes itself has not yet looked at. (This used to match
          # any bot, to agree with Mullion's relay, which feeds the same range into the
          # idempotency key; s3ntin3l8/.github#99 narrowed it, and the relay must follow
          # or the two entry points stop deduplicating against each other.)
          # `env.BOT_LOGIN` rather than `--arg`: `gh api --jq` takes exactly one argument.
          # Every page: reviews come back oldest first, so a PR with more than one page of
          # them would otherwise lose the NEWEST ones -- the newest marker would never pair
          # and the base would fall back to an ancient commit. `--paginate` applies the
          # filter per page, so the per-page arrays are joined afterwards.
          REVIEWS=$(gh api --paginate "repos/$REPO/pulls/$NUMBER/reviews?per_page=100" \
            --jq '[.[] | select(.user.login == env.BOT_LOGIN and (.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "COMMENTED")) | {commit_id, submitted_at}]' 2>/dev/null | jq -s 'add // []' 2>/dev/null || echo "")
          [[ -n "$REVIEWS" ]] || REVIEWS='[]'
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          LAST_REVIEWED=""
          # 1. The ledger: the newest SUCCESS marker paired with a landed review. The
          # PR's last commits, not just the head -- the marker sits on the commit that was
          # reviewed, which is an older one once the head has moved. A read that fails
          # (no `checks: read`, no ledger) is the same as no marker.
          if [[ "$LEDGER" == "check-run" ]]; then
            QUERY=$(cat <<'GQL'
          query($owner:String!,$repo:String!,$number:Int!,$name:String!){repository(owner:$owner,name:$repo){pullRequest(number:$number){commits(last:50){nodes{commit{oid checkSuites(first:100){nodes{checkRuns(first:20,filterBy:{checkName:$name}){nodes{databaseId name externalId status conclusion startedAt}}}}}}}}}}
          GQL
            )
            # shellcheck disable=SC2016  # $oid is a jq variable, not a shell one
            MARKERS=$(gh api graphql \
              -f query="$QUERY" \
              -F owner="$OWNER" -F repo="${REPO#*/}" -F number="$NUMBER" -f name="$LEDGER_NAME" \
              --jq '[.data.repository.pullRequest.commits.nodes[] | .commit.oid as $oid | .commit.checkSuites.nodes[].checkRuns.nodes[] | select(.name == env.LEDGER_NAME and .conclusion == "SUCCESS" and .startedAt != null) | {oid: $oid, id: .databaseId, started: .startedAt}]' 2>/dev/null || echo "")
            [[ -n "$MARKERS" ]] || MARKERS='[]'
            # Paired: a landed review was submitted at or after the marker started. The
            # timestamps are all ISO-8601 UTC, so they compare as strings.
            LAST_REVIEWED=$(jq -r --argjson reviews "$REVIEWS" \
              '[.[] | select(.started as $s | any($reviews[]; .submitted_at >= $s))] | sort_by(.id) | last | .oid // empty' <<< "$MARKERS")
          fi
          # 2. No ledger answer: the last landed review's commit_id -- trusted only while
          # that commit is not newer than the review. GitHub re-points an approval's
          # commit_id at the current head when the branch is rewritten (#129), and that
          # re-pointed commit was committed after the review was submitted.
          if [[ -z "$LAST_REVIEWED" ]]; then
            CANDIDATE=$(jq -r 'last | .commit_id // empty' <<< "$REVIEWS")
            if [[ -n "$CANDIDATE" ]]; then
              REVIEWED_AT=$(jq -r 'last | .submitted_at // empty' <<< "$REVIEWS")
              COMMITTED_AT=$(gh api "repos/$REPO/commits/$CANDIDATE" --jq '.commit.committer.date' 2>/dev/null || echo "")
              if [[ -n "$COMMITTED_AT" && -n "$REVIEWED_AT" && ! "$COMMITTED_AT" > "$REVIEWED_AT" ]]; then
                LAST_REVIEWED="$CANDIDATE"
              else
                echo "::notice::the last review's commit_id ($CANDIDATE) is not a reliable record of what it covered (GitHub re-points it when the branch is rewritten) and no ledger marker names the reviewed commit; the whole diff will be reviewed."
              fi
            fi
          fi
          if [[ -n "$LAST_REVIEWED" ]]; then
            if [[ "$LAST_REVIEWED" == "$HEAD_SHA" ]]; then
              SAME=yes
            else
              # Same content = same tree. A tree that cannot be read is not "the same".
              TREE_REVIEWED=$(gh api "repos/$REPO/commits/$LAST_REVIEWED" --jq '.commit.tree.sha' 2>/dev/null || echo "")
              TREE_HEAD=$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq '.commit.tree.sha' 2>/dev/null || echo "")
              SAME=no
              if [[ -n "$TREE_REVIEWED" && "$TREE_REVIEWED" == "$TREE_HEAD" ]]; then SAME=yes; fi
            fi
            if [[ "$SAME" == "yes" ]]; then
              echo "::notice::a review of $REPO#$NUMBER already covers this content (reviewed commit $LAST_REVIEWED, head $HEAD_SHA) — nothing new to review; skipping. Push a change to ask for another round, or dismiss that review first: gh api -X PUT repos/$REPO/pulls/$NUMBER/reviews/<review id>/dismissals -f message='re-review'."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "base=$LAST_REVIEWED" >> "$GITHUB_OUTPUT"
          if [[ -n "$LAST_REVIEWED" ]]; then
            echo "::notice::follow-up round: reviewing only $LAST_REVIEWED..$HEAD_SHA (the last landed review covered $LAST_REVIEWED)."
          else
            echo "::notice::first round for this PR: reviewing the whole diff at $HEAD_SHA."
          fi

      # Is a review of this PR already in flight?
      #
      # The ledger is a check run on the reviewed head whose external_id is the Hermes
      # run id, so the live run can be found, asked for its status, and stopped. Without
      # it, every request while a review is running queues ANOTHER review behind it in
      # the PR's Hermes session: the reviewer then works through a backlog of rounds,
      # each one slower than the last (every round inherits the previous rounds'
      # transcript), and the queue is what eventually trips Hermes' concurrent-run cap
      # (HTTP 429) — which used to be reported as a successful relay.
      #
      # Two outcomes, both of which avoid the queue:
      #   * the marker is on the CURRENT head -> a review of this exact head is already
      #     running -> skip and let it finish;
      #   * the marker is on an OLDER head -> the head moved while that review was
      #     running, so that review is about to be stale -> stop it and review the new
      #     head instead of queueing behind it.
      #
      # Only a PR has a head to hang the marker on, and the marker needs a run id, so
      # this runs on the Runs API path only.
      - name: Check for an in-flight review (ledger)
        id: inflight
        if: steps.check-mention.outputs.skip != 'true' && steps.guard.outputs.skip != 'true' && steps.scope.outputs.skip != 'true'
        env:
          API_URL: ${{ inputs.hermes-api-url }}
          API_KEY: ${{ secrets.HERMES_API_KEY }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          NUMBER: ${{ steps.target.outputs.number }}
          KIND: ${{ steps.target.outputs.kind }}
          HEAD_SHA: ${{ steps.scope.outputs.head }}
          USE_RUNS: ${{ inputs.hermes-use-runs }}
          LEDGER: ${{ inputs.hermes-review-ledger }}
          LEDGER_NAME: ${{ inputs.hermes-review-ledger-name }}
        run: |
          set -euo pipefail
          {
            echo "skip=false"
            echo "action=dispatch"
            echo "stale_run="
          } >> "$GITHUB_OUTPUT"
          if [[ "$USE_RUNS" != "true" || "$KIND" != "pr" || "$LEDGER" != "check-run" || -z "$HEAD_SHA" ]]; then
            exit 0
          fi
          # The newest "Hermes review" marker across the PR's recent commits. The PR's
          # last commits, not just the head: a marker left on an older head IS the
          # "the head moved while a review was running" signal. `commits(last:5)` answers
          # OLDEST first and a commit can carry several markers, so neither the commit nor
          # the marker is taken by position: every marker is flattened and the highest
          # check-run id (the latest dispatch) wins. The name is filtered server-side and
          # the suite window is wide, so a busy commit cannot push the marker out of view.
          QUERY=$(cat <<'GQL'
          query($owner:String!,$repo:String!,$number:Int!,$name:String!){repository(owner:$owner,name:$repo){pullRequest(number:$number){commits(last:5){nodes{commit{oid checkSuites(first:100){nodes{checkRuns(first:20,filterBy:{checkName:$name}){nodes{databaseId name externalId status}}}}}}}}}}
          GQL
          )
          # `gh api graphql` takes the repository's NAME, not "owner/repo" (the
          # REST paths take the full "owner/repo" as two segments) — passing
          # $REPO here made gh look for "owner/owner/repo".
          REPO_NAME="${REPO#*/}"
          # shellcheck disable=SC2016  # $oid is a jq variable, not a shell one
          MARKER=$(gh api graphql \
            -f query="$QUERY" \
            -F owner="$OWNER" -F repo="$REPO_NAME" -F number="$NUMBER" -f name="$LEDGER_NAME" \
            --jq '[.data.repository.pullRequest.commits.nodes[] | .commit.oid as $oid | .commit.checkSuites.nodes[].checkRuns.nodes[] | select(.name == env.LEDGER_NAME and .externalId != null and .externalId != "") | {oid: $oid, id: .databaseId, run: .externalId, open: (.status != "COMPLETED")}] | sort_by(.id) | last // empty')
          if [[ -z "$MARKER" ]]; then
            exit 0
          fi
          MARKER_SHA=$(jq -r '.oid // empty' <<< "$MARKER")
          MARKER_RUN=$(jq -r '.run // empty' <<< "$MARKER")
          echo "::notice::found an in-flight marker on ${MARKER_SHA:-an older head} (Hermes run $MARKER_RUN)."
          # Ask Hermes whether that run is still alive. A run that is gone (expired,
          # or its window elapsed) is not in flight.
          set +e
          STATUS=$(curl -sS -m 10 "$API_URL/v1/runs/$MARKER_RUN" \
            -H "Authorization: Bearer $API_KEY" | jq -r '.status // empty')
          set -e
          case "$STATUS" in
            queued|running|stopping|pending|started|waiting_for_approval)
              # Still live: the marker points at a run that is still working.
              if [[ "$MARKER_SHA" == "$HEAD_SHA" ]]; then
                echo "::notice::a review of $REPO#$NUMBER at $HEAD_SHA is already running (Hermes run $MARKER_RUN) — not queueing another one."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::notice::the head moved while run $MARKER_RUN was reviewing ${MARKER_SHA:-an older head} — stopping it instead of queueing behind it."
              set +e
              curl -sS -m 15 -X POST "$API_URL/v1/runs/$MARKER_RUN/stop" \
                -H "Authorization: Bearer $API_KEY" -o /dev/null
              # The stopped run's marker is never selected again (the next dispatch writes a
              # higher id), so close it now instead of leaving it pending forever.
              MARKER_ID=$(jq -r '.id // empty' <<< "$MARKER")
              if [[ -n "$MARKER_ID" ]]; then
                gh api --method PATCH "repos/$REPO/check-runs/$MARKER_ID" \
                  -f status=completed -f conclusion=cancelled \
                  -f completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)" > /dev/null 2>&1 \
                  && echo "::notice::closed the stopped run's marker (cancelled)."
              fi
              set -e
              echo "stale_run=$MARKER_RUN" >> "$GITHUB_OUTPUT"
              ;;
            *)
              # Terminal (completed/failed/cancelled/interrupted), a status this
              # workflow does not know, or an empty answer (Hermes does not know the
              # run any more): the marker is stale, so a fresh round is dispatched. A
              # marker the poll window left open (the review outlived it) whose run is
              # now KNOWN to be over is closed here with the run's real outcome; an
              # unknown or empty status is not proof of an outcome, so it stays open. An
              # unreadable answer is treated as stale rather than in flight — blocking
              # on it would silently drop reviews, and the idempotency key still keeps
              # a repeat request from queuing a second run of the same range.
              MARKER_ID=$(jq -r '.id // empty' <<< "$MARKER")
              MARKER_OPEN=$(jq -r '.open // false' <<< "$MARKER")
              if [[ "$MARKER_OPEN" == "true" && -n "$MARKER_ID" ]]; then
                STALE_CONCLUSION=""
                case "$STATUS" in
                  completed) STALE_CONCLUSION=success ;;
                  failed|cancelled|interrupted) STALE_CONCLUSION=failure ;;
                esac
                if [[ -n "$STALE_CONCLUSION" ]]; then
                  set +e
                  gh api --method PATCH "repos/$REPO/check-runs/$MARKER_ID" \
                    -f status=completed -f conclusion="$STALE_CONCLUSION" \
                    -f completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)" > /dev/null 2>&1 \
                    && echo "::notice::closed the left-open marker for run $MARKER_RUN ($STATUS -> $STALE_CONCLUSION)."
                  set -e
                fi
              fi
              ;;
          esac

      # Checkout THIS shared repo to fetch the prompt(s) (read-only, no token needed).
      # NOTE: sparse-checkout defaults to cone mode, which only accepts DIRECTORY
      # patterns — bare filenames like "hermes-review-prompt.md" are rejected
      # ("not a directory"). Disable cone mode so file paths work.
      - name: Checkout shared repo (prompt source)
        if: steps.check-mention.outputs.skip != 'true' && steps.guard.outputs.skip != 'true' && steps.scope.outputs.skip != 'true' && steps.inflight.outputs.skip != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: s3ntin3l8/.github
          ref: main
          path: .hermes-shared
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ${{ inputs.prompt-path }}
            ${{ inputs.issue-prompt-path }}
          persist-credentials: false

      # Fail fast if the Hermes API server itself is unreachable, BEFORE attempting the
      # relay below. /health requires no auth and responds in milliseconds when the
      # server process is up — so a failure here means the server is actually down
      # (wrong port, crashed service, host unreachable), not just a long-running review.
      # This is what makes the relay step's "000 = normal" assumption below safe: by the
      # time we reach it, we already know the server was reachable moments earlier.
      - name: Check Hermes API reachability
        if: steps.check-mention.outputs.skip != 'true' && steps.guard.outputs.skip != 'true' && steps.scope.outputs.skip != 'true' && steps.inflight.outputs.skip != 'true'
        env:
          API_URL: ${{ inputs.hermes-api-url }}
        run: |
          set -euo pipefail
          if ! curl -fsS -m 5 "$API_URL/health" > /dev/null; then
            echo "::error::Hermes API unreachable at $API_URL/health — review NOT dispatched. Check the review-bot gateway on hermes-01 (systemctl status hermes-review-bot)."
            exit 1
          fi

      # The 👀 reaction (see `hermes-react`). Its own short-lived token, minted only for this
      # purpose: the runner-side token above stays read-mostly, and an App that lacks Issues
      # write cannot break a review (continue-on-error: no token, no reaction).
      - name: Create reaction token (best-effort)
        id: react-token
        if: >-
          steps.check-mention.outputs.skip != 'true' && steps.guard.outputs.skip != 'true' &&
          steps.scope.outputs.skip != 'true' && steps.inflight.outputs.skip != 'true' &&
          inputs.hermes-react && inputs.hermes-use-runs &&
          contains(fromJSON('["issue_comment", "pull_request_review_comment", "issues", "pull_request"]'), github.event_name)
        continue-on-error: true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.HERMES_APP_ID }}
          private-key: ${{ secrets.HERMES_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write

      # Relay the request to the Hermes API server on hermes-01. The agent runs there
      # with full tools/memory/skills, re-mints its own GitHub App token, and posts the
      # review/comment BACK TO GITHUB ITSELF. We only forward: which target, the prompt,
      # and the model override. We do NOT wait for the agent to finish — it returns
      # its result by posting to GitHub, not by replying to this HTTP call. So this
      # step FIRES-AND-FORGETS: it sends the prompt and exits 0 regardless of how
      # long the agent runs (or whether the connection is later closed by the server).
      #
      # Distinguishing a real failure from a healthy long run: the API holds this
      # connection open until the agent finishes (minutes), so our local -m 20 cap
      # trips on EVERY non-trivial review — curl exit 28 (timeout-after-connect) and
      # HTTP code 000 are the NORMAL, expected outcome here, not an error (confirmed:
      # both successful and silently-failed runs produced curl exit 28 / HTTP 000 —
      # the "Check Hermes API reachability" step above is what actually catches a down
      # server, at connect time, before the long-running POST even starts). What we DO
      # treat as a real failure from this step: curl exit 6/7 (DNS failure / connection
      # refused — the server died in the few seconds since the health check above) and
      # HTTP 401/403 (bad auth/key). Anything else (2xx, other 4xx, exit 28) is
      # accepted-and-running.
      - name: Run Hermes (remote agent on hermes-01)
        id: run
        if: steps.check-mention.outputs.skip != 'true' && steps.guard.outputs.skip != 'true' && steps.scope.outputs.skip != 'true' && steps.inflight.outputs.skip != 'true'
        env:
          API_URL: ${{ inputs.hermes-api-url }}
          API_KEY: ${{ secrets.HERMES_API_KEY }}
          API_MODEL: ${{ inputs.hermes-api-model }}
          TARGET_KIND: ${{ steps.target.outputs.kind }}
          TARGET_NUMBER: ${{ steps.target.outputs.number }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          MODEL: ${{ inputs.hermes-model || vars.HERMES_MODEL || '' }}
          PROMPT_FILE: .hermes-shared/${{ steps.target.outputs.kind == 'pr' && inputs.prompt-path || inputs.issue-prompt-path }}
          MAX_TURNS: ${{ inputs.max-turns }}
          USE_RUNS: ${{ inputs.hermes-use-runs }}
          HEAD_SHA: ${{ steps.scope.outputs.head }}
          BASE_SHA: ${{ steps.scope.outputs.base }}
          LEDGER: ${{ inputs.hermes-review-ledger }}
          LEDGER_NAME: ${{ inputs.hermes-review-ledger-name }}
          BOT_LOGIN: ${{ inputs.mention-trigger }}[bot]
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REACTION_TOKEN: ${{ steps.react-token.outputs.token }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_ID: ${{ github.event.comment.id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [ -f "$PROMPT_FILE" ] || { echo "::error::prompt not found: $PROMPT_FILE"; exit 1; }
          # Response files live in the per-job temp dir (a self-hosted runner can host two
          # jobs) and are removed when the step ends, however it ends.
          trap 'rm -f "${RESP:-}" "${LEGACY_RESP:-}"' EXIT

          # Assemble the user message from exported env vars. We do NOT rely on a
          # shell-local MSG var — it would not be exported to a child process.
          # Use printf to build the header with real newlines (YAML-safe).
          # One session per pull request, so every round of the same PR continues the
          # same conversation (the reviewer remembers what it said last round) while
          # DIFFERENT PRs stay independent and can be reviewed in parallel. The id is
          # derived from the repo, not from the request text, because the text-derived
          # one made every @mention of a PR land in the same session — which is what
          # queued a backlog of review rounds behind each other.
          SESSION_ID=""
          if [[ "$TARGET_KIND" == "pr" ]]; then
            # A session id becomes a file name on Hermes' side, so fold the owner and
            # repo to characters that are safe there ([A-Za-z0-9_-]); a "/" or a ".."
            # in it would be rejected as an unsafe session id.
            #
            # This must stay identical to Mullion's own relay (reviewSessionId in
            # s3ntin3l8/mullion-session-manager's src/services/hermes-review.ts), or
            # a review asked for through `mullion review` and one asked for with an
            # @mention would land in two different sessions and could both run.
            # The REPOSITORY'S NAME, not "owner/repo" — Mullion's relay builds
            # this id from the owner and the name separately, and "owner/repo"
            # here would put the owner in it twice.
            REPO_NAME="${REPO#*/}"
            OWNER_SLUG=$(printf '%s' "$OWNER" | tr -c 'A-Za-z0-9_-' '-')
            REPO_SLUG=$(printf '%s' "$REPO_NAME" | tr -c 'A-Za-z0-9_-' '-')
            # Lower-cased: GitHub's owner and repository names are case-insensitive,
            # so a remote spelled "Listenarr" and one spelled "listenarr" are the
            # same pull request — and the relay lower-cases too, so the two
            # entry points would otherwise disagree on the session id and the
            # idempotency key (two sessions, two dispatches, no shared history).
            OWNER_SLUG=$(printf '%s' "$OWNER_SLUG" | tr '[:upper:]' '[:lower:]')
            REPO_SLUG=$(printf '%s' "$REPO_SLUG" | tr '[:upper:]' '[:lower:]')
            SESSION_ID="hermes-review-${OWNER_SLUG}-${REPO_SLUG}-$TARGET_NUMBER"
          fi
          # The message is built by a function because a retry in a FRESH session (see the
          # admission_conflict arm below) must not claim that earlier rounds are in the
          # session's history: they are not, and the reviewer has to read them off the PR.
          build_msg() { # FRESH_SESSION=1: the session has no memory of earlier rounds
            HEADER=$(printf 'Target: %s #%s in repo %s\nUse the github-code-review skill (for a PR) or your triage procedure (for an issue) to act on it. The GitHub App token is available to you via scripts/app-token.sh in the review-bot profile; mint it before calling gh. Do NOT ask the human for secrets.\n' "$TARGET_KIND" "$TARGET_NUMBER" "$REPO")
            if [[ -n "$HEAD_SHA" ]]; then
              HEADER+=$(printf '\nReview the pull request at commit %s — that exact commit. If the PR head has moved since this request, say so in the review instead of reviewing a newer head.\n' "$HEAD_SHA")
            fi
            if [[ -n "$BASE_SHA" ]]; then
              if [[ -n "${FRESH_SESSION:-}" ]]; then
                HISTORY_NOTE='This is a NEW session: earlier rounds are NOT in your history. Read the pull request'"'"'s existing reviews and comments (gh) for what was found before. Do not re-review them, but DO flag anything in the new range that interacts with those findings, and state whether they are addressed.'
              else
                HISTORY_NOTE='Earlier rounds are in the history of this session: do not re-review them, but DO flag anything in the new range that interacts with what was found before, and state whether the previous round findings are addressed.'
              fi
              HEADER+=$(printf '\nThis is a FOLLOW-UP round. The previous round reviewed up to %s. Review ONLY what the PR itself changed since then: the range %s..%s, EXCLUDING the commits already on the base branch (an "Update branch" merge brings those into the range; they are not part of this PR). The review procedure gives the exact git command. %s If %s is not an ancestor of %s (the PR was rebased), review the whole PR instead.\n' "$BASE_SHA" "$BASE_SHA" "$HEAD_SHA" "$HISTORY_NOTE" "$BASE_SHA" "$HEAD_SHA")
            fi
            if [[ -n "$MODEL" ]]; then
              HEADER+=$(printf '\nPrefer model: %s\n' "$MODEL")
            fi
            HEADER+=$(printf '\nHonor a maximum of %s agent turns.\n\n' "$MAX_TURNS")
            MSG="$HEADER$(cat "$PROMPT_FILE")"
          }

          # ── Session memory ───────────────────────────────────────────────────────────
          # A round that had to move to a fresh session (below) leaves that session id in
          # its in-flight marker; the next round starts from it instead of from the stuck
          # base id, so a PR keeps one live session instead of paying a refused POST every
          # round and losing the history again. The marker is read off the PREVIOUS round's
          # commit. Only an id of the exact shape we generate is accepted.
          BASE_SESSION_ID="$SESSION_ID"
          SESSION_ATTEMPT=1
          if [[ "$TARGET_KIND" == "pr" && -n "$BASE_SHA" && "$LEDGER" == "check-run" ]]; then
            set +e
            # The NEWEST marker on that commit: the endpoint answers newest
            # first (ids strictly descending), so `last` picked the OLDEST one
            # -- the stuck base session, which is exactly the id this feature
            # exists to get away from. Sorted by id instead, so the answer does
            # not depend on the endpoint's order.
            REMEMBERED=$(gh api "repos/$REPO/commits/$BASE_SHA/check-runs?check_name=$(jq -rn --arg n "$LEDGER_NAME" '$n|@uri')&filter=all&per_page=100" \
              --jq '[.check_runs[] | select(.name == env.LEDGER_NAME) | {id: .id, summary: (.output.summary // "")}] | sort_by(.id) | last | .summary // empty' 2>/dev/null \
              | sed -n 's/^session: //p' | head -1)
            set -e
            if [[ -n "$REMEMBERED" && "$REMEMBERED" =~ ^${BASE_SESSION_ID}(-[0-9]+)?$ ]]; then
              SESSION_ID="$REMEMBERED"
              if [[ -n "${BASH_REMATCH[1]}" ]]; then SESSION_ATTEMPT="${BASH_REMATCH[1]#-}"; fi
              echo "::notice::continuing in session $SESSION_ID (remembered from the previous round)."
            fi
          fi
          FRESH_SESSION=""
          build_msg

          # ── Runs API path (opt-in via hermes-use-runs) ───────────────────────────────
          # POST /v1/runs answers 202 + run_id as soon as the run is admitted, so unlike the
          # legacy call below a connection failure or non-202 here is a real failure, and
          # the run can be polled to a terminal status.
          #
          # The Idempotency-Key is the REVIEW RANGE, not this workflow run: a key per
          # (PR, base..head) means a second @mention on the same head replays the run that
          # is already there instead of queueing a second review of the same diff. (The
          # key used to carry the workflow run id + attempt, so every mention dispatched
          # a fresh review — the queueing this protocol exists to prevent.) The body is a
          # pure function of the key, because Hermes fingerprints the request body: a
          # different body under the same key is a 409 conflict, not a replay.
          if [[ "$USE_RUNS" == "true" ]]; then
            RESP=$(mktemp "${RUNNER_TEMP:-/tmp}/hermes-resp.XXXXXX")
            if [[ "$TARGET_KIND" == "pr" && -n "$HEAD_SHA" ]]; then
              # Lower-cased for the same reason as the session id: the relay
              # lower-cases, and a key that depends on the case of the remote
              # would let the two entry points dispatch the same range twice.
              KEY_REPO=$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')
              IDEMPOTENCY_KEY="hermes-review:$KEY_REPO#$TARGET_NUMBER@$BASE_SHA..$HEAD_SHA"
            else
              # An issue triage has no commit to pin; keep the per-run key so a triage
              # request is never replayed into a stale one.
              IDEMPOTENCY_KEY="gha:$REPO#$TARGET_NUMBER:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
            fi
            RUN_BODY=$(jq -nc --arg model "$API_MODEL" --arg input "$MSG" --arg session "$SESSION_ID" \
              '{model:$model,input:$input} + (if $session == "" then {} else {session_id:$session} end)')
            # The dispatch is a loop: a 409 whose run has died is retried
            # under a deeper key (see the 409 arm below), and a fresh attempt
            # is a fresh key — never the same one twice.
            for ATTEMPT in 1 2 3; do
            set +e
            HTTP_CODE=$(curl -sS -m 30 -o "$RESP" -w '%{http_code}' \
              -X POST "$API_URL/v1/runs" \
              -H "Authorization: Bearer $API_KEY" \
              -H "Content-Type: application/json" \
              -H "Idempotency-Key: $IDEMPOTENCY_KEY" \
              --data "$RUN_BODY")
            CURL_EXIT=$?
            set -e
            if [[ "$CURL_EXIT" != "0" ]]; then
              echo "::error::Could not reach the Hermes API to dispatch the run (curl exit $CURL_EXIT) — review NOT dispatched."
              exit 1
            fi
            if [[ "$HTTP_CODE" == "401" || "$HTTP_CODE" == "403" ]]; then
              echo "::error::Hermes API rejected the key (HTTP $HTTP_CODE) — check HERMES_API_KEY secret."
              exit 1
            fi
            if [[ "$HTTP_CODE" == "429" ]]; then
              # Hermes' own concurrent-run cap. The request was NOT admitted, so say so
              # loudly: a green run here would read as "relayed" and invite another
              # request, which is how the queue used to grow.
              echo "::error::Hermes is at its concurrent-run cap (HTTP 429) — review NOT dispatched. Wait for a running review to finish and try again."
              exit 1
            fi
            if [[ "$HTTP_CODE" == "409" ]]; then
              # Two different refusals arrive as 409, and they need different answers:
              #   * idempotency_key_conflict: the key holds a run for a DIFFERENT body.
              #     The attempt behind it is over, so a retry has to go under a deeper
              #     key — the same key would replay the dead run and nothing would happen.
              #   * admission_conflict: Hermes' session authority refused the TURN. The
              #     session this PR's reviews run in is stuck: it was paused on an
              #     earlier conflict and never recovers (NousResearch/hermes-agent#142731),
              #     so every later round for that PR is refused at the door. A fresh
              #     session id gets the PR moving again.
              # In neither case does the 409 mean "a review is running" — that is what
              # the in-flight ledger is for, and it has already run: it skips when a
              # review of this head is live and stops one that went stale.
              CONFLICT_CODE=$(jq -r '.error.code // "idempotency_key_conflict"' "$RESP" 2>/dev/null || echo idempotency_key_conflict)
              MARKER_RUN=""
              EXISTING_STATUS=""
              # The marker for this range is on this head, so the head's own
              # check runs are where it is. The NEWEST marker on this head, by
              # id -- the endpoint's own order is not the contract.
              find_marker_run() {
                gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?check_name=$(jq -rn --arg n "$LEDGER_NAME" '$n|@uri')&filter=all&per_page=100" \
                  --jq '[.check_runs[] | select(.name == env.LEDGER_NAME and .external_id != null and .external_id != "") | {id: .id, run: .external_id}] | sort_by(.id) | last | .run // empty' 2>/dev/null || echo ""
              }
              if [[ "$LEDGER" == "check-run" && -n "$HEAD_SHA" ]]; then
                MARKER_RUN=$(find_marker_run)
                # A key conflict with no marker yet usually means the OTHER entry
                # point (Mullion's relay, or this workflow on another trigger)
                # dispatched this range a moment ago and has not written its
                # marker: the marker is written AFTER the dispatch, so the two
                # can race within the same second (seen live on
                # mullion-session-manager#1789). Give it a short window before
                # reporting a failure. An admission_conflict needs no marker, so
                # it does not wait.
                if [[ -z "$MARKER_RUN" && "$CONFLICT_CODE" != "admission_conflict" ]]; then
                  for (( WAIT = 1; WAIT <= ${HERMES_MARKER_WAIT_TRIES:-6}; WAIT++ )); do
                    sleep "${HERMES_MARKER_WAIT_INTERVAL:-5}"
                    MARKER_RUN=$(find_marker_run)
                    [[ -n "$MARKER_RUN" ]] && break
                  done
                  if [[ -n "$MARKER_RUN" ]]; then
                    echo "::notice::Hermes already held a run for this range (HTTP 409: $CONFLICT_CODE); its marker appeared after $WAIT check(s) (Hermes run $MARKER_RUN)."
                  fi
                fi
                if [[ -n "$MARKER_RUN" ]]; then
                  set +e
                  EXISTING_STATUS=$(curl -sS -m 10 "$API_URL/v1/runs/$MARKER_RUN" \
                    -H "Authorization: Bearer $API_KEY" | jq -r '.status // empty')
                  set -e
                fi
              fi
              if [[ "$CONFLICT_CODE" == "admission_conflict" ]]; then
                # The SESSION refused the turn. The key was never the issue: the
                # session this PR's reviews run in is stuck (it was paused on an
                # earlier conflict and never recovers), so every later round for
                # this PR is refused at the door. A fresh session id gets the PR
                # moving again.
                #
                # The suffix is a number, so the id keeps the shape
                # `hermes-review-<owner>-<repo>-<pr>[-<n>]` that Hermes is asked
                # to recognise (NousResearch/hermes-agent#142647) — a session id
                # it cannot classify is dropped by the salvage path.
                #
                # The body carries the session id, so the idempotency key moves
                # with it: a key that stayed would conflict with the body it holds.
                if [[ -n "$MARKER_RUN" && -n "$EXISTING_STATUS" ]]; then
                  case "$EXISTING_STATUS" in
                    queued|running|stopping|pending|started|waiting_for_approval)
                      # A review of this PR is live: the session is busy, not stuck.
                      echo "::notice::a review of this pull request is already running (Hermes run $MARKER_RUN, $EXISTING_STATUS) — it will post to the PR itself."
                      exit 0
                      ;;
                  esac
                fi
                SESSION_ATTEMPT=$(( SESSION_ATTEMPT + 1 ))
                echo "::notice::Hermes' session authority refused the turn for session '$SESSION_ID' (HTTP 409: admission_conflict) — that session is stuck and refuses every later round of this pull request; retrying in a fresh one."
                SESSION_ID="${BASE_SESSION_ID}-${SESSION_ATTEMPT}"
                IDEMPOTENCY_KEY="${IDEMPOTENCY_KEY}#session-${SESSION_ATTEMPT}"
                FRESH_SESSION=1
                build_msg
                RUN_BODY=$(jq -nc --arg model "$API_MODEL" --arg input "$MSG" --arg session "$SESSION_ID" \
                  '{model:$model,input:$input} + (if $session == "" then {} else {session_id:$session} end)')
                continue
              fi
              if [[ -z "$MARKER_RUN" ]]; then
                # No marker names the run the key holds, so we cannot say whether
                # it is still working — and it is the KEY that conflicts here, so
                # there is nothing else to try.
                echo "::error::Hermes holds a run for this range (HTTP 409: $CONFLICT_CODE) but no ledger marker named it within the wait window, so whether it is still running is unknown — review NOT dispatched. Check the run on hermes-01 before asking again."
                exit 1
              fi
              case "$EXISTING_STATUS" in
                queued|running|stopping|pending|started|waiting_for_approval)
                  # A review of this PR is live. Do not dispatch a second one.
                  echo "::notice::a review of this pull request is already running (Hermes run $MARKER_RUN, $EXISTING_STATUS) — it will post to the PR itself."
                  exit 0
                  ;;
                completed|failed|cancelled|interrupted)
                  if [[ "$EXISTING_STATUS" == "completed" && "$TARGET_KIND" == "pr" && -n "$HEAD_SHA" ]]; then
                    # It finished. If a Hermes review landed while that run was working,
                    # there is nothing to redo: a deeper key would dispatch a second review
                    # of the same commit (the same rule the scope step applies before
                    # dispatching). "Landed while it was working" is a review submitted at
                    # or after the marker started -- NOT a review whose commit_id is this
                    # head, which GitHub re-points when the branch is rewritten (#129).
                    MARKER_STARTED=$(MARKER_RUN="$MARKER_RUN" gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?check_name=$(jq -rn --arg n "$LEDGER_NAME" '$n|@uri')&filter=all&per_page=100" \
                      --jq '[.check_runs[] | select(.external_id == env.MARKER_RUN) | .started_at] | first // empty' 2>/dev/null || echo "")
                    LANDED=0
                    if [[ -n "$MARKER_STARTED" ]]; then
                      # One line per matching review, counted: the filter runs per page.
                      # A failed read is NOT "no review landed" and NOT "one landed": we do
                      # not know, so -- like the unreadable-status branch below -- dispatch
                      # nothing and say so (a `| wc -l || echo 0` here printed "0" twice on a
                      # failure, which the check below read as "a review landed", exit 0).
                      if ! LANDED_LINES=$(MARKER_STARTED="$MARKER_STARTED" gh api --paginate "repos/$REPO/pulls/$TARGET_NUMBER/reviews?per_page=100" \
                        --jq '.[] | select(.user.login == env.BOT_LOGIN and .submitted_at >= env.MARKER_STARTED and (.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "COMMENTED")) | "landed"' 2>/dev/null); then
                        echo "::error::Hermes' run for this range completed (run $MARKER_RUN), but the pull request's reviews could not be read, so whether its review landed is unknown — review NOT dispatched. Check the PR and ask again."
                        exit 1
                      fi
                      LANDED=$(printf '%s\n' "$LANDED_LINES" | grep -c landed || true)
                    fi
                    if [[ "${LANDED:-0}" != "0" ]]; then
                      echo "::notice::the run Hermes held for this range completed and its review already landed — not dispatching another."
                      exit 0
                    fi
                  fi
                  # The attempt is over. Retry under a deeper key, derived from the
                  # run that died — the key is a function of what failed, not of the
                  # clock, so a repeat of the retry replays it instead of dispatching
                  # again.
                  echo "::notice::the attempt Hermes held for this range ended ($EXISTING_STATUS, run $MARKER_RUN) — starting a fresh one under a deeper key."
                  IDEMPOTENCY_KEY="$IDEMPOTENCY_KEY#$MARKER_RUN"
                  continue
                  ;;
                *)
                  # The status lookup failed (API unreachable, run unknown, bad
                  # JSON): we do NOT know whether the run ended, so don't claim it
                  # and don't dispatch a second review of the same range.
                  echo "::error::Hermes holds run $MARKER_RUN for this range (HTTP 409: $CONFLICT_CODE), but its status could not be read (the lookup returned nothing) — review NOT dispatched. Check the run on hermes-01 before asking again."
                  exit 1
                  ;;
              esac
            fi
            if [[ "$HTTP_CODE" != "202" && "$HTTP_CODE" != "200" ]]; then
              echo "::error::Hermes API returned HTTP $HTTP_CODE — review NOT dispatched: $(head -c 300 "$RESP" | tr '\n' ' ')"
              exit 1
            fi
            RUN_ID=$(jq -r '.run_id // empty' "$RESP")
            if [[ -z "$RUN_ID" ]]; then
              echo "::error::Hermes accepted the request but returned no run_id — cannot track the review."
              exit 1
            fi
            break
            done
            if [[ -z "${RUN_ID:-}" ]]; then
              # Every attempt was refused (the loop ran out). Say so: falling
              # through here would print a "dispatched" notice for a run that
              # was never started.
              echo "::error::Every attempt to dispatch the review was refused (HTTP 409) — review NOT dispatched. Hermes holds a run for this range, or its session refused the turn; nothing was queued."
              exit 1
            fi
            echo "::notice::dispatched Hermes run $RUN_ID (attempt $ATTEMPT, idempotency key $IDEMPOTENCY_KEY); polling until it finishes."
            REPLAYED=$(jq -r '.replayed // false' "$RESP")
            if [[ "$REPLAYED" == "true" ]]; then
              echo "::notice::Hermes replayed the existing run $RUN_ID for this range (idempotency key $IDEMPOTENCY_KEY) — no second review was dispatched."
            elif [[ -n "${REACTION_TOKEN:-}" ]]; then
              # A NEW run was accepted: this is the moment the request is really being worked
              # on, so acknowledge the comment with 👀 now, not when the review ends. Only
              # here: never on a skip, a refusal, a failure or a replay (this comment started
              # nothing). Best-effort and non-fatal.
              case "$EVENT_NAME" in
                issue_comment) REACT_TO="repos/$REPO/issues/comments/$COMMENT_ID/reactions" ;;
                pull_request_review_comment) REACT_TO="repos/$REPO/pulls/comments/$COMMENT_ID/reactions" ;;
                issues) REACT_TO="repos/$REPO/issues/$ISSUE_NUMBER/reactions" ;;
                # The auto-review on PR open: there is no comment, so the PR body gets the 👀.
                pull_request) REACT_TO="repos/$REPO/issues/$PR_NUMBER/reactions" ;;
                *) REACT_TO="" ;;
              esac
              if [[ -n "$REACT_TO" ]]; then
                GH_TOKEN="$REACTION_TOKEN" gh api --method POST "$REACT_TO" -f content=eyes --silent \
                  && echo "::notice::reacted 👀 to the request." \
                  || echo "::warning::could not add the 👀 reaction (non-fatal) — the review itself was dispatched."
              fi
            fi

            # The in-flight marker: a check run on the reviewed head whose external_id
            # is the Hermes run id. A later request finds it, reads the run's status,
            # and either waits for it or stops it when the head has moved on — instead
            # of queueing another review behind it.
            CHECK_RUN_ID=""
            if [[ "$LEDGER" == "check-run" && "$TARGET_KIND" == "pr" && -n "$HEAD_SHA" ]]; then
              set +e
              CHECK_RUN_ID=$(gh api --method POST "repos/$REPO/check-runs" \
                -f name="$LEDGER_NAME" -f head_sha="$HEAD_SHA" -f external_id="$RUN_ID" \
                -f status=in_progress \
                -f "output[title]=$LEDGER_NAME" -f "output[summary]=session: $SESSION_ID" \
                -f details_url="https://github.com/$REPO/pull/$TARGET_NUMBER" \
                --jq '.id' 2>/dev/null)
              set -e
              if [[ -z "$CHECK_RUN_ID" ]]; then
                echo "::warning::could not write the in-flight marker for run $RUN_ID — a later request may queue another review behind this one."
              else
                echo "::notice::in-flight marker written (check run $CHECK_RUN_ID, external_id $RUN_ID)."
              fi
            fi

            POLL_INTERVAL="${HERMES_POLL_INTERVAL:-15}"
            # The window has to end before the job's own timeout-minutes (60) with room for
            # the steps that run before the poll, so an override above the cap is clamped
            # instead of letting the job timeout cut the poll off.
            POLL_SECONDS="${HERMES_POLL_SECONDS:-2700}"
            if [[ ! "$POLL_SECONDS" =~ ^[0-9]+$ ]]; then
              echo "::warning::HERMES_POLL_SECONDS='$POLL_SECONDS' is not a number of seconds - using 2700."
              POLL_SECONDS=2700
            fi
            if (( POLL_SECONDS > 3000 )); then
              echo "::warning::HERMES_POLL_SECONDS=$POLL_SECONDS exceeds the job timeout budget - clamped to 3000."
              POLL_SECONDS=3000
            fi
            POLL_DEADLINE=$(( SECONDS + POLL_SECONDS ))
            MISSES=0
            STATUS=""
            while (( SECONDS < POLL_DEADLINE )); do
              set +e
              CODE=$(curl -sS -m 10 -o "$RESP" -w '%{http_code}' \
                "$API_URL/v1/runs/$RUN_ID" -H "Authorization: Bearer $API_KEY")
              CURL_EXIT=$?
              set -e
              if [[ "$CURL_EXIT" != "0" || "$CODE" != "200" ]]; then
                if [[ "$CODE" == "404" ]]; then
                  echo "::error::Hermes no longer knows run $RUN_ID (expired or gateway state lost) — outcome unknown."
                  exit 1
                fi
                MISSES=$(( MISSES + 1 ))
                if (( MISSES >= 8 )); then
                  echo "::error::Lost contact with the Hermes API while polling run $RUN_ID (last HTTP $CODE, curl exit $CURL_EXIT)."
                  exit 1
                fi
                sleep "$POLL_INTERVAL"
                continue
              fi
              MISSES=0
              STATUS=$(jq -r '.status // "unknown"' "$RESP")
              case "$STATUS" in
                completed|failed|cancelled|interrupted) break ;;
              esac
              sleep "$POLL_INTERVAL"
            done

            {
              echo "### Hermes run \`$RUN_ID\`: ${STATUS:-unknown}"
              ERR=$(jq -r '.error // empty' "$RESP" 2>/dev/null | head -c 2000)
              OUT=$(jq -r '.output // empty' "$RESP" 2>/dev/null | head -c 4000)
              [[ -n "$ERR" ]] && printf '\n**Error:** %s\n' "$ERR"
              [[ -n "$OUT" ]] && printf '\n%s\n' "$OUT"
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

            # Close the in-flight marker so the next request does not mistake this
            # finished run for a live one. A run that is STILL going when the window ends
            # is not finished: its marker stays open (in_progress) so the PR does not read
            # "relayed and done" for a review that is still working. The next round's
            # in-flight step closes it once Hermes reports the run terminal. (The marker's
            # summary is left alone: the next round reads the session id off it, and the
            # reader requires exactly `session: <id>`.)
            if [[ -n "$CHECK_RUN_ID" ]]; then
              case "$STATUS" in
                completed) CONCLUSION=success ;;
                failed|cancelled|interrupted) CONCLUSION=failure ;;
                *) CONCLUSION="" ;;
              esac
              if [[ -n "$CONCLUSION" ]]; then
                set +e
                gh api --method PATCH "repos/$REPO/check-runs/$CHECK_RUN_ID" \
                  -f status=completed -f conclusion="$CONCLUSION" \
                  -f completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)" > /dev/null 2>&1
                set -e
              fi
            fi

            case "$STATUS" in
              completed)
                echo "::notice::Hermes run $RUN_ID completed."
                exit 0 ;;
              failed|cancelled|interrupted)
                echo "::error::Hermes run $RUN_ID ended $STATUS: $(jq -r '.error // "no error reported"' "$RESP" | head -n 1 | head -c 300)"
                exit 1 ;;
              *)
                echo "::warning::Hermes run $RUN_ID was still ${STATUS:-running} after the polling window; it continues on hermes-01 and posts to GitHub itself. This job's conclusion is NOT a verdict on the review: to gate on the review, gate on the '$LEDGER_NAME' check, which stays pending until the run is seen finished."
                exit 0 ;;
            esac
          fi

          # Fire-and-forget: send the prompt, ignore the (async) response body.
          # -m 20s cap: we only need the server to ACCEPT the request, not to finish.
          # Temporarily disable -e to capture curl's real exit code (not just a
          # collapsed "000" http_code) without aborting the script on a nonzero exit.
          #
          # The session id is the SAME one the Runs API path above uses, so a repo that
          # opts into `hermes-use-runs` later keeps the same review history. (Without
          # it, this endpoint derives the session id from a hash of the request text, so
          # every @mention of a PR landed in the same session and queued behind the
          # previous one.)
          SESSION_HEADER=()
          if [[ -n "$SESSION_ID" ]]; then
            SESSION_HEADER=(-H "X-Hermes-Session-Id: $SESSION_ID")
          fi
          set +e
          LEGACY_RESP=$(mktemp "${RUNNER_TEMP:-/tmp}/hermes-legacy.XXXXXX")
          HTTP_CODE=$(curl -sS -m 20 -o "$LEGACY_RESP" -w '%{http_code}' \
            -X POST "$API_URL/v1/chat/completions" \
            -H "Authorization: Bearer $API_KEY" \
            -H "Content-Type: application/json" \
            "${SESSION_HEADER[@]+"${SESSION_HEADER[@]}"}" \
            --data "$(jq -nc --arg model "$API_MODEL" --arg content "$MSG" \
              '{model:$model, messages:[{role:"user",content:$content}], stream:false}')" \
            2>/dev/null)
          CURL_EXIT=$?
          set -e
          # The outcome is NOT visible from here: the API holds the connection
          # open until the agent finishes (minutes), so the -m 20 cap always
          # trips and the runner sees 000/exit 28 whether the review started or
          # not. Say that, instead of claiming it was relayed. (The Runs API
          # path above is the one that can tell them apart: it has a run id to
          # poll.) The review, if it started, posts to the PR itself.
          echo "::notice::request sent to hermes-01 (HTTP $HTTP_CODE, curl exit $CURL_EXIT); the API holds the connection until the review finishes, so the outcome is not visible from here — the review, if it started, posts to the PR itself."
          if [[ "$HTTP_CODE" == "401" || "$HTTP_CODE" == "403" ]]; then
            echo "::error::Hermes API rejected the key (HTTP $HTTP_CODE) — check HERMES_API_KEY secret."
            exit 1
          fi
          if [[ "$HTTP_CODE" == "429" ]]; then
            # Hermes' own concurrent-run cap: the request was NOT admitted. Failing here
            # is the point — the old path reported this as a successful relay, so a
            # saturated gateway read as "relayed" and invited another request.
            echo "::error::Hermes is at its concurrent-run cap (HTTP 429) — review NOT dispatched. Wait for a running review to finish and try again."
            exit 1
          fi
          if [[ "$HTTP_CODE" == "409" ]]; then
            # Hermes REFUSED the turn: its session authority will not admit a turn
            # into a session that is busy, paused or stale (HTTP 409,
            # "admission_conflict"). Nothing was dispatched — no run was created and
            # nothing was queued. Say so loudly: this path used to fall through to
            # the "accepted and running" catch-all below, so the run went GREEN and
            # said "relayed" while nothing happened. A green run read as "asked",
            # which invited another request — that is how one PR collected nine
            # @mentions and no re-review.
            CONFLICT_CODE=$(jq -r '.error.code // "admission_conflict"' "$LEGACY_RESP" 2>/dev/null || echo admission_conflict)
            echo "::error::Hermes refused the request (HTTP 409: $CONFLICT_CODE) — review NOT dispatched. No run was created and nothing was queued: a review for this PR is already admitted, or its review session is stuck. Check for a running review before asking again."
            exit 1
          fi
          # curl exit 6 (DNS failure) / 7 (connection refused): the server was reachable
          # moments ago (the health check above passed) but died before accepting this
          # POST — a real failure, not a long-running review. Fail loud rather than
          # silently leaving the run green with nothing dispatched.
          if [[ "$CURL_EXIT" == "6" || "$CURL_EXIT" == "7" ]]; then
            echo "::error::Could not connect to Hermes API for the relay POST (curl exit $CURL_EXIT) — review NOT dispatched."
            exit 1
          fi
          # curl exit 28 (timeout after connect) / HTTP 000 / 2xx / other 4xx -> the
          # server accepted the request and is running the agent asynchronously. This
          # is the expected outcome for any non-trivial review (see comment above this
          # step) -> treat as accepted-and-running.

# With `hermes-use-runs: true` the "Run Hermes" step dispatches via POST /v1/runs and polls the
# run to a terminal status instead (see that input and the README); the agent still posts to
# GitHub itself either way.
# NOTE: No "post review" step here — the agent on hermes-01 performs the POST using its
# own App token, exactly as PR #18's original local design did. This preserves the
# centralized-prompt, trigger-agnostic, reusable behaviour without installing Hermes on
# the runner.
