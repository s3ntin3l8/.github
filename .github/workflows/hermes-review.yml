name: Hermes PR Review (reusable)

# Reusable workflow: any repo with a self-hosted runner can call this to get an AI
# review / triage posted back to a PR or issue by the <slug>[bot] GitHub App.
#
# ARCHITECTURE (remote execution model):
#   The runner container does NOT run Hermes. Instead it forwards the request to the
#   Hermes API server running on a separate host (hermes-01) over the LAN. The agent
#   executes THERE — full tools, memory, skills, github-code-review skill — and posts
#   the review back to GitHub itself using a GitHub App token it mints via app-token.sh.
#   This keeps the runner containers lightweight (no hermes venv) while preserving 100%
#   of the agent behaviour. See s3ntin3l8/.github#18.
#
#   - Runner side: mints a GitHub App token (only to resolve the PR/issue via `gh` for
#     trigger routing), checks the "@<slug>" mention, and relays the prompt to hermes-01.
#   - hermes-01 side (review-bot profile API server): runs the agent. The agent re-mints
#     its own App token from review-bot/.env and POSTs the review/comment.
#
# Triggers (define in the CALLING repo's workflow, not here — this is `workflow_call`).
# This workflow is ON-DEMAND ONLY: it runs when someone comments "@<slug>" (your App
# slug, e.g. "@s3ntin3l8-hermes") on a PR or issue. Automatic/bulk reviews are handled
# separately by a Hermes cronjob, per design. The mention substring is the `mention-trigger`
# input (the reusable job's "Check mention" step enforces it; default "hermes").
#   - issue_comment:             created, body contains "@<slug>"
#       * on a PR  -> diff review (uses hermes-review-prompt.md)
#       * on an issue -> triage   (uses hermes-triage-prompt.md)
#   - pull_request_review_comment: created, body contains "@<slug>" -> inline diff review
# The target (PR vs issue) is resolved at run time, so the same job serves both.
#
# Required caller setup (once per calling repo):
#   1. Register a GitHub App with permissions Contents:Write (open PRs), Pull requests:
#      Read&write, Checks:Read&write, Issues:Write (triage); subscribe to Issue comment
#      + Pull request review comment events; install on the repo.
#   2. Repo secrets: HERMES_APP_ID, HERMES_APP_PRIVATE_KEY (used to resolve the PR/issue
#      on the runner), HERMES_API_KEY (bearer key for the hermes-01 API server).
#   3. Repo variable (optional): HERMES_MODEL (model override for the agent).
#   4. A self-hosted runner labelled `self-hosted` with `gh` + `curl`/`python3` on PATH.
#   5. A reachable Hermes API server on hermes-01 (review-bot profile) — started with
#      `hermes -p review-bot gateway`, API_SERVER_HOST bound to the LAN interface
#      (not 127.0.0.1), API_SERVER_PORT set, API_SERVER_KEY configured.
#
# Minimal caller example (in the *calling* repo's .github/workflows/hermes.yml):
#   name: Hermes (on-demand, @<slug>)
#   on:
#     issue_comment:
#       types: [created]
#     pull_request_review_comment:
#       types: [created]
#   jobs:
#     hermes:
#       if: github.actor != 's3ntin3l8-hermes[bot]'
#       permissions:
#         contents: write
#         pull-requests: write
#         issues: write
#         checks: write
#       uses: s3ntin3l8/.github/.github/workflows/hermes-review.yml@main
#       with:
#         mention-trigger: s3ntin3l8-hermes
#       secrets: inherit

on:
  workflow_call:
    secrets:
      HERMES_APP_ID:
        required: true
        description: GitHub App numeric ID (from the App's settings page).
      HERMES_APP_PRIVATE_KEY:
        required: true
        description: GitHub App PEM private key.
      HERMES_API_KEY:
        required: true
        description: >-
          Bearer key for the hermes-01 API server (API_SERVER_KEY). Distinct from the
          App PEM. The agent uses this to authenticate the run; it mints the GitHub
          token itself for posting.
    inputs:
      hermes-api-url:
        required: false
        type: string
        default: http://192.168.2.6:8643
        description: >-
          Base URL of the Hermes API server (review-bot profile) on hermes-01. Must be
          reachable from the runner over the LAN; bind API_SERVER_HOST to the LAN iface
          (not 127.0.0.1). The review-bot server runs on its own port (8643) to avoid
          colliding with the default-profile gateway (8642).
      hermes-api-model:
        required: false
        type: string
        default: hermes-agent
        description: Model name the API server advertises (API_SERVER_MODEL_NAME).
      mention-trigger:
        required: false
        type: string
        default: hermes
        description: >-
          Mention substring that triggers the bot (without the leading @). Defaults to
          "hermes". Set this to your GitHub App slug so comments like "@<slug>" fire the
          workflow — e.g. "s3ntin3l8-hermes". The reusable job's "Check mention" step
          enforces it, so the slug lives in exactly one place (the caller's with:).
      hermes-model:
        required: false
        type: string
        default: ''
        description: >-
          Model override passed to the agent (e.g. anthropic/claude-sonnet-4). Empty =>
          falls back to the repo variable HERMES_MODEL, then the agent's profile default.
      max-turns:
        required: false
        type: number
        default: 30
        description: Max agent turns for the run (guards against runaway runs).
      prompt-path:
        required: false
        type: string
        default: hermes-review-prompt.md
        description: Path (relative to the shared/workflow repo root) of the PR review recipe.
      issue-prompt-path:
        required: false
        type: string
        default: hermes-triage-prompt.md
        description: Path (relative to the shared/workflow repo root) of the issue triage recipe.

jobs:
  hermes-review:
    # The caller gates the cheap event-type + self-trigger checks (see README). The
    # actual "@<mention-trigger>" substring check happens in the "Check mention" step
    # below, using the mention-trigger input, so the slug lives in exactly one place.
    if: github.actor != 's3ntin3l8-hermes[bot]'
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Create GitHub App token (runner-side, for trigger resolution)
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.HERMES_APP_ID }}
          private-key: ${{ secrets.HERMES_APP_PRIVATE_KEY }}

      # Early exit unless the comment actually contains the configured mention. This
      # keeps the slug in ONE place (the mention-trigger input). GitHub normalizes the
      # event payload's comment body field, so we probe both common shapes.
      - name: Check mention
        env:
          MENTION: ${{ inputs.mention-trigger }}
          BODY: ${{ github.event.comment.body || github.event.review.body || github.event.issue.body }}
        run: |
          set -euo pipefail
          if [[ -z "${BODY:-}" ]] || ! echo "$BODY" | grep -q "@$MENTION"; then
            echo "::notice::No '@$MENTION' mention found — skipping."
            exit 0   # not a failure: leave the run green
          fi

      # Resolve WHAT was mentioned, so we can route to the right prompt and tell the
      # agent which PR/issue to act on. Uses the runner-side App token (read-only view).
      - name: Resolve target (PR diff vs issue triage)
        id: target
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          IS_PR_COMMENT="${{ github.event.issue.pull_request != null && github.event_name == 'issue_comment' }}"
          IS_PR_REVIEW="${{ github.event_name == 'pull_request_review_comment' }}"
          if [[ "$IS_PR_COMMENT" == "true" || "$IS_PR_REVIEW" == "true" ]]; then
            PR_NUM="${{ github.event.pull_request.number || github.event.issue.number || github.event.pull_request_review_comment.pull_request_number }}"
            echo "kind=pr"        >> "$GITHUB_OUTPUT"
            echo "number=$PR_NUM" >> "$GITHUB_OUTPUT"
          else
            ISSUE_NUM="${{ github.event.issue.number }}"
            echo "kind=issue"        >> "$GITHUB_OUTPUT"
            echo "number=$ISSUE_NUM" >> "$GITHUB_OUTPUT"
          fi

      # Checkout THIS shared repo to fetch the prompt(s) (read-only, no token needed).
      - name: Checkout shared repo (prompt source)
        uses: actions/checkout@v4
        with:
          repository: s3ntin3l8/.github
          ref: main
          path: .hermes-shared
          sparse-checkout: |
            ${{ inputs.prompt-path }}
            ${{ inputs.issue-prompt-path }}

      # Relay the request to the Hermes API server on hermes-01. The agent runs there
      # with full tools/memory/skills, re-mints its own GitHub App token, and posts the
      # review/comment back to GitHub itself. We only forward: which target, the prompt,
      # and the model override. The final assistant text is echoed to the log for visibility.
      - name: Run Hermes (remote agent on hermes-01)
        id: run
        env:
          API_URL: ${{ inputs.hermes-api-url }}
          API_KEY: ${{ secrets.HERMES_API_KEY }}
          API_MODEL: ${{ inputs.hermes-api-model }}
          TARGET_KIND: ${{ steps.target.outputs.kind }}
          TARGET_NUMBER: ${{ steps.target.outputs.number }}
          REPO: ${{ github.repository }}
          MODEL: ${{ inputs.hermes-model || vars.HERMES_MODEL || '' }}
          PROMPT_FILE: .hermes-shared/${{ steps.target.outputs.kind == 'pr' && inputs.prompt-path || inputs.issue-prompt-path }}
          MAX_TURNS: ${{ inputs.max-turns }}
        run: |
          set -euo pipefail
          [ -f "$PROMPT_FILE" ] || { echo "::error::prompt not found: $PROMPT_FILE"; exit 1; }

          # Build the user message: hand the agent the target + repo explicitly, since
          # it has no access to the runner's event payload or injected env. It re-derives
          # the diff/issue via gh using its own App token.
          MSG=$(cat <<PYEOF
          Target: $TARGET_KIND #$TARGET_NUMBER in repo $REPO
          Use the github-code-review skill (for a PR) or your triage procedure (for an issue)
          to act on it. The GitHub App token is available to you via scripts/app-token.sh in
          the review-bot profile; mint it before calling gh. Do NOT ask the human for secrets.

          $(cat "$PROMPT_FILE")
          PYEOF
          )

          python3 - <<'PY'
          import os, sys, json, urllib.request

          url = os.environ["API_URL"].rstrip("/") + "/v1/chat/completions"
          key = os.environ["API_KEY"]
          model = os.environ.get("API_MODEL") or "hermes-agent"
          msg = os.environ["MSG"] if "MSG" in os.environ else sys.stdin.read()
          body = {
              "model": model,
              "messages": [{"role": "user", "content": msg}],
              "stream": False,
          }
          req = urllib.request.Request(
              url, data=json.dumps(body).encode(), method="POST",
              headers={"Authorization": f"Bearer {key}",
                        "Content-Type": "application/json"},
          )
          try:
              with urllib.request.urlopen(req, timeout=1200) as r:
                  data = json.load(r)
          except urllib.error.HTTPError as e:
              sys.stderr.write(f"::error::Hermes API error {e.code}: {e.read().decode()[:500]}\n")
              sys.exit(1)
          content = data["choices"][0]["message"]["content"]
          print("=== Hermes agent output ===")
          print(content[:8000])
          PY

# NOTE: No "post review" step here — the agent on hermes-01 performs the POST using its
# own App token, exactly as PR #18's original local design did. This preserves the
# centralized-prompt, trigger-agnostic, reusable behaviour without installing Hermes on
# the runner.
