name: Hermes PR Review (reusable)

# Reusable workflow: any repo with a self-hosted runner that has `hermes` on PATH
# can call this to get an AI code review posted back to the PR.
#
# The Hermes process runs LOCALLY on the caller's self-hosted runner — it calls the
# `hermes` binary already installed there (ideally the `review-bot` profile), sharing
# that profile's persistent memory + skills. NOTHING is exposed to the internet: the
# GitHub event reaches the runner over its existing outbound connection, and the runner
# calls Hermes on localhost. The only outbound API call is from `hermes` itself, using
# the GitHub App token minted below, to POST the review.
#
# Triggers (define in the CALLING repo's workflow, not here — this is `workflow_call`).
# This workflow is ON-DEMAND ONLY: it runs when someone comments "@hermes" on a PR or
# issue. Automatic/bulk reviews are handled separately by a Hermes cronjob, per design.
#   - issue_comment:             created, body contains "@hermes"
#       * on a PR  -> diff review (uses hermes-review-prompt.md)
#       * on an issue -> triage   (uses hermes-triage-prompt.md)
#   - pull_request_review_comment: created, body contains "@hermes" -> inline diff review
# The target (PR vs issue) is resolved at run time, so the same job serves both.
#
# Required caller setup (once per calling repo):
#   1. Register a GitHub App with permissions Contents:Write (open PRs), Pull requests:
#      Read&write, Checks:Read&write, Issues:Write (triage); subscribe to Issue comment
#      + Pull request review comment events; install on the repo.
#   2. Repo secrets: HERMES_APP_ID, HERMES_APP_PRIVATE_KEY.
#   3. Repo variable (optional): HERMES_MODEL (defaults to anthropic/claude-sonnet-4).
#   4. A self-hosted runner labelled `self-hosted` with `hermes` on PATH.
#   5. (Recommended) On the runner: `hermes profile create review-bot --clone`
#      and `hermes config set approvals.mode off` for that profile.
#
# Minimal caller example (in the *calling* repo's .github/workflows/hermes.yml):
#   name: Hermes (on-demand, @hermes)
#   on:
#     issue_comment:
#       types: [created]
#     pull_request_review_comment:
#       types: [created]
#   jobs:
#     hermes:
#       if: >-
#         github.actor != 'hermes-review[bot]' && (
#           (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@hermes')) ||
#           (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@hermes'))
#         )
#       permissions:
#         contents: write
#         pull-requests: write
#         issues: write
#         checks: write
#       uses: s3ntin3l8/.github/.github/workflows/hermes-review.yml@main
#       secrets: inherit

on:
  workflow_call:
    secrets:
      HERMES_APP_ID:
        required: true
        description: GitHub App numeric ID (from the App's settings page).
      HERMES_APP_PRIVATE_KEY:
        required: true
        description: GitHub App PEM private key.
    inputs:
      hermes-profile:
        required: false
        type: string
        default: review-bot
        description: Hermes profile to run the review under (must exist on the runner).
      hermes-binary:
        required: false
        type: string
        default: /home/bjoern/hermes-agent/venv/bin/hermes
        description: >-
          Absolute path to the `hermes` binary on the runner. Use an absolute path so
          a separate runner service account (which may not inherit your login PATH)
          cannot fail to find it. Override if your runner installs hermes elsewhere.
      hermes-model:
        required: false
        type: string
        default: ''
        description: >-
          Model override (e.g. anthropic/claude-sonnet-4). Empty => falls back to the
          repo variable HERMES_MODEL, then to the workflow default.
      max-turns:
        required: false
        type: number
        default: 30
        description: Max agent turns for the review (guards against runaway runs).
      prompt-path:
        required: false
        type: string
        default: hermes-review-prompt.md
        description: Path (relative to the shared/workflow repo root) of the PR review recipe.
      issue-prompt-path:
        required: false
        type: string
        default: hermes-triage-prompt.md
        description: Path (relative to the shared/workflow repo root) of the issue triage recipe.

jobs:
  hermes-review:
    # Trigger-agnostic guard: never let the bot re-trigger itself when it posts.
    if: github.actor != 'hermes-review[bot]'
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.HERMES_APP_ID }}
          private-key: ${{ secrets.HERMES_APP_PRIVATE_KEY }}

      # Resolve WHAT was mentioned. All triggers are gated by "@hermes", so this job
      # only runs on demand. We detect PR vs. issue to branch the behaviour:
      #   - PR (pull_request_review_comment, or issue_comment on a PR) -> diff review
      #   - Issue (issues, or issue_comment on an issue)              -> triage
      - name: Resolve target (PR diff vs issue triage)
        id: target
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          IS_PR_COMMENT="${{ github.event.issue.pull_request != null && github.event_name == 'issue_comment' }}"
          IS_PR_REVIEW="${{ github.event_name == 'pull_request_review_comment' }}"
          if [[ "$IS_PR_COMMENT" == "true" || "$IS_PR_REVIEW" == "true" ]]; then
            PR_NUM="${{ github.event.pull_request.number || github.event.issue.number || github.event.pull_request_review_comment.pull_request_number }}"
            echo "kind=pr"        >> "$GITHUB_OUTPUT"
            echo "number=$PR_NUM" >> "$GITHUB_OUTPUT"
            PR_JSON=$(gh api "repos/$REPO/pulls/$PR_NUM")
            echo "head=$(echo "$PR_JSON" | jq -r .head.sha)" >> "$GITHUB_OUTPUT"
            echo "base=$(echo "$PR_JSON" | jq -r .base.ref)"  >> "$GITHUB_OUTPUT"
          else
            # issue or issue_comment on an issue
            ISSUE_NUM="${{ github.event.issue.number }}"
            echo "kind=issue"         >> "$GITHUB_OUTPUT"
            echo "number=$ISSUE_NUM"  >> "$GITHUB_OUTPUT"
          fi

      # Checkout the CALLING repo (the PR lives here), so a PR review reads the diff.
      # Skipped for issues (nothing to diff).
      - name: Checkout PR head (caller repo)
        if: steps.target.outputs.kind == 'pr'
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ steps.target.outputs.head }}
          fetch-depth: 0

      # Checkout THIS shared repo to fetch the prompt(s) (read-only, no token needed).
      - name: Checkout shared repo (prompt source)
        uses: actions/checkout@v4
        with:
          repository: s3ntin3l8/.github
          ref: main
          path: .hermes-shared
          sparse-checkout: |
            ${{ inputs.prompt-path }}
            ${{ inputs.issue-prompt-path }}

      - name: Fetch base branch for diffing
        if: steps.target.outputs.kind == 'pr'
        run: git fetch origin ${{ steps.target.outputs.base }}

      - name: Verify hermes binary exists on this runner
        run: |
          HERMES_BIN="${{ inputs.hermes-binary }}"
          [ -x "$HERMES_BIN" ] || { echo "::error::hermes binary not executable at: $HERMES_BIN"; exit 1; }

      - name: Run Hermes (local instance, shared memory)
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_KIND: ${{ steps.target.outputs.kind }}
          ISSUE_OR_PR_NUMBER: ${{ steps.target.outputs.number }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ steps.target.outputs.base }}
          HEAD_SHA: ${{ steps.target.outputs.head }}
          MODEL: ${{ inputs.hermes-model || vars.HERMES_MODEL || 'anthropic/claude-sonnet-4' }}
          PROFILE: ${{ inputs.hermes-profile }}
          PROMPT_FILE: .hermes-shared/${{ steps.target.outputs.kind == 'pr' && inputs.prompt-path || inputs.issue-prompt-path }}
          MAX_TURNS: ${{ inputs.max-turns }}
          HERMES_BIN: ${{ inputs.hermes-binary }}
        run: |
          set -euo pipefail
          [ -f "$PROMPT_FILE" ] || { echo "::error::prompt not found: $PROMPT_FILE"; exit 1; }
          "$HERMES_BIN" -p "$PROFILE" -s github-code-review chat -Q --yolo \
            -m "$MODEL" --max-turns "$MAX_TURNS" \
            -t terminal,file,code_execution,memory \
            -q "$(cat "$PROMPT_FILE")"
