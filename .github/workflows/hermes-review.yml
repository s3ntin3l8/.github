name: Hermes PR Review (reusable)

# Reusable workflow: any repo with a self-hosted runner can call this to get an AI
# review / triage posted back to a PR or issue by the <slug>[bot] GitHub App.
#
# ARCHITECTURE (remote execution model):
#   The runner container does NOT run Hermes. Instead it forwards the request to the
#   Hermes API server running on a separate host (hermes-01) over the LAN. The agent
#   executes THERE — full tools, memory, skills, github-code-review skill — and posts
#   the review back to GitHub itself using a GitHub App token it mints via app-token.sh.
#   This keeps the runner containers lightweight (no hermes venv) while preserving 100%
#   of the agent behaviour. See s3ntin3l8/.github#18.
#
#   - Runner side: mints a GitHub App token (only to resolve the PR/issue via `gh` for
#     trigger routing), checks the "@<slug>" mention, and relays the prompt to hermes-01.
#   - hermes-01 side (review-bot profile API server): runs the agent. The agent re-mints
#     its own App token from review-bot/.env and POSTs the review/comment.
#
# Triggers (define in the CALLING repo's workflow, not here — this is `workflow_call`).
# This workflow is ON-DEMAND ONLY: it runs when someone comments "@<slug>" (your App
# slug, e.g. "@s3ntin3l8-hermes") on a PR or issue. Automatic/bulk reviews are handled
# separately by a Hermes cronjob, per design. The mention substring is the `mention-trigger`
# input (the reusable job's "Check mention" step enforces it; default "hermes").
#   - issue_comment:             created, body contains "@<slug>"   (on-demand mode)
#       * on a PR  -> diff review (uses hermes-review-prompt.md)
#       * on an issue -> triage   (uses hermes-triage-prompt.md)
#   - pull_request:              [opened] (or opened,synchronize)    (auto mode, mode: auto)
#       * always reviews the PR (no mention needed); caller's `on:` is the gate.
# The target (PR vs issue) is resolved at run time, so the same job serves both.
#
# IMPORTANT: do NOT subscribe to `pull_request_review_comment` (or `pull_request_review`).
# A submitted review fires those events, and the review body routinely contains the
# "@<slug>" string (e.g. when another bot like Claude reviews, or the bot itself
# echoes context). That re-triggers this workflow with NO human summon -> an unwanted
# cascade. On-demand @mention works through issue_comment alone (PR-conversation
# comments and issue comments BOTH arrive as issue_comment). See s3ntin3l8/.github#527.
#
# Required caller setup (once per calling repo):
#   1. Register a GitHub App with permissions Contents:Write (open PRs), Pull requests:
#      Read&write, Checks:Read&write, Issues:Write (triage); subscribe to Issue comment
#      + Pull request review comment events; install on the repo.
#   2. Repo secrets: HERMES_APP_ID, HERMES_APP_PRIVATE_KEY (used to resolve the PR/issue
#      on the runner), HERMES_API_KEY (bearer key for the hermes-01 API server).
#   3. Repo variable (optional): HERMES_MODEL (model override for the agent).
#   4. A self-hosted runner labelled `self-hosted` with `gh` + `curl`/`python3` on PATH.
#   5. A reachable Hermes API server on hermes-01 (review-bot profile) — started with
#      `hermes -p review-bot gateway`, API_SERVER_HOST bound to the LAN interface
#      (not 127.0.0.1), API_SERVER_PORT set, API_SERVER_KEY configured.
#
# Minimal caller example (in the *calling* repo's .github/workflows/hermes.yml):
#   name: Hermes (on-demand, @<slug>)
#   on:
#     issue_comment:
#       types: [created]
#   (do NOT add pull_request_review_comment — a submitted review fires that
#    event, and review bodies routinely contain "@<slug>", so it re-triggers
#    this workflow with NO human summon. issue_comment alone covers both
#    PR-conversation mentions and issue mentions.)
#   jobs:
#     hermes:
#       if: github.actor != 's3ntin3l8-hermes[bot]'
#       permissions:
#         contents: write
#         pull-requests: write
#         issues: write
#         checks: write
#       uses: s3ntin3l8/.github/.github/workflows/hermes-review.yml@main
#       with:
#         mention-trigger: s3ntin3l8-hermes
#       secrets: inherit

on:
  workflow_call:
    secrets:
      HERMES_APP_ID:
        required: true
        description: GitHub App numeric ID (from the App's settings page).
      HERMES_APP_PRIVATE_KEY:
        required: true
        description: GitHub App PEM private key.
      HERMES_API_KEY:
        required: true
        description: >-
          Bearer key for the hermes-01 API server (API_SERVER_KEY). Distinct from the
          App PEM. The agent uses this to authenticate the run; it mints the GitHub
          token itself for posting.
    inputs:
      hermes-api-url:
        required: false
        type: string
        default: http://192.168.2.6:8643
        description: >-
          Base URL of the Hermes API server (review-bot profile) on hermes-01. Must be
          reachable from the runner over the LAN; bind API_SERVER_HOST to the LAN iface
          (not 127.0.0.1). The review-bot server runs on its own port (8643) to avoid
          colliding with the default-profile gateway (8642).
      hermes-api-model:
        required: false
        type: string
        default: hermes-agent
        description: Model name the API server advertises (API_SERVER_MODEL_NAME).
      mention-trigger:
        required: false
        type: string
        default: hermes
        description: >-
          Mention substring that triggers the bot (without the leading @). Defaults to
          "hermes". Set this to your GitHub App slug so comments like "@<slug>" fire the
          workflow — e.g. "s3ntin3l8-hermes". The reusable job's "Check mention" step
          enforces it, so the slug lives in exactly one place (the caller's with:).
      mode:
        required: false
        type: string
        default: on-demand
        description: >-
          Trigger mode. "on-demand" (default) requires an "@<mention-trigger>" mention
          on a PR/issue comment before reviewing. "auto" reviews every PR that triggers
          the workflow (e.g. a caller using `pull_request: [opened]`) with no mention
          needed — the caller's `on:` decides when to run. Both modes share the same
          relay + prompt; auto mode skips the mention check and resolves the PR number
          from github.event.pull_request.
      hermes-model:
        required: false
        type: string
        default: ''
        description: >-
          Model override passed to the agent (e.g. anthropic/claude-sonnet-4). Empty =>
          falls back to the repo variable HERMES_MODEL, then the agent's profile default.
      max-turns:
        required: false
        type: number
        default: 30
        description: Max agent turns for the run (guards against runaway runs).
      prompt-path:
        required: false
        type: string
        default: hermes-review-prompt.md
        description: Path (relative to the shared/workflow repo root) of the PR review recipe.
      issue-prompt-path:
        required: false
        type: string
        default: hermes-triage-prompt.md
        description: Path (relative to the shared/workflow repo root) of the issue triage recipe.

jobs:
  hermes-review:
    # The caller gates the cheap event-type + self-trigger checks (see README). The
    # actual "@<mention-trigger>" substring check happens in the "Check mention" step
    # below, using the mention-trigger input, so the slug lives in exactly one place.
    if: github.actor != 's3ntin3l8-hermes[bot]'
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Create GitHub App token (runner-side, for trigger resolution)
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.HERMES_APP_ID }}
          private-key: ${{ secrets.HERMES_APP_PRIVATE_KEY }}

      # Early exit unless the comment actually contains the configured mention.
      # ONLY enforced in on-demand mode. In auto mode the caller's `on:` decides when
      # to run (e.g. pull_request opened), so we never skip on mention — but we still
      # skip if there is genuinely no body (defensive). The `mode` input drives this.
      # IMPORTANT: this step sets a `skip` output; every downstream step is gated on it
      # (see the `if: steps.check-mention.outputs.skip != 'true'` on each). A bare
      # `exit 0` here does NOT stop later steps — without the gate the relay would fire
      # on EVERY comment regardless of mention (this was the bug that made the bot
      # review on non-summoning comments, e.g. s3ntin3l8/.github#527 follow-up).
      - name: Check mention
        id: check-mention
        env:
          MENTION: ${{ inputs.mention-trigger }}
          MODE: ${{ inputs.mode }}
          BODY: ${{ github.event.comment.body || github.event.review.body || github.event.issue.body }}
        run: |
          set -euo pipefail
          # Auto mode: never skip on mention — the caller's trigger is the gate.
          if [[ "${MODE:-on-demand}" != "on-demand" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "${BODY:-}" ]] || ! echo "$BODY" | grep -q "@$MENTION"; then
            echo "::notice::No '@$MENTION' mention found — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0   # not a failure: leave the run green
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # Resolve WHAT was mentioned, so we can route to the right prompt and tell the
      # agent which PR/issue to act on. Uses the runner-side App token (read-only view).
      - name: Resolve target (PR diff vs issue triage)
        id: target
        if: steps.check-mention.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          IS_PR_COMMENT="${{ github.event.issue.pull_request != null && github.event_name == 'issue_comment' }}"
          IS_PR_REVIEW="${{ github.event_name == 'pull_request_review_comment' }}"
          IS_PR_EVENT="${{ github.event_name == 'pull_request' }}"
          if [[ "$IS_PR_COMMENT" == "true" || "$IS_PR_REVIEW" == "true" || "$IS_PR_EVENT" == "true" ]]; then
            # For a PR comment (issue_comment on a PR) the PR number is the issue
            # number itself: github.event.issue.number. NOTE: github.event.issue.
            # pull_request is an OBJECT (URLs only) with NO .number, so
            # github.event.issue.pull_request.number resolves EMPTY — do NOT use it
            # (that was the bug: PR_NUM came back blank and the agent fell back to
            # "most recent PR", s3ntin3l8/.github review from a second agent).
            # For pull_request_review_comment, the number lives on the review object.
            # For a pull_request event (auto mode), it is github.event.pull_request.number.
            PR_NUM="${{ github.event.issue.number || github.event.pull_request.number || github.event.pull_request_review_comment.pull_request_number }}"
            echo "kind=pr"         >> "$GITHUB_OUTPUT"
            echo "number=$PR_NUM" >> "$GITHUB_OUTPUT"
          else
            # Plain issue comment.
            ISSUE_NUM="${{ github.event.issue.number }}"
            echo "kind=issue"        >> "$GITHUB_OUTPUT"
            echo "number=$ISSUE_NUM" >> "$GITHUB_OUTPUT"
          fi

      # Guard against (a) the bot re-triggering on its own output and (b) a human
      # reply that merely @mentions the slug without intending a new run. If the bot
      # has ALREADY acted on this exact target, skip — do NOT run again.
      - name: Guard against re-trigger
        if: steps.check-mention.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          KIND: ${{ steps.target.outputs.kind }}
          NUMBER: ${{ steps.target.outputs.number }}
        run: |
          set -euo pipefail
          if [[ "$KIND" == "pr" ]]; then
            # Already posted a review on this PR by the bot? -> skip.
            COUNT=$(gh api "repos/$REPO/pulls/$NUMBER/reviews" \
              --jq '[.[] | select(.user.type == "Bot" or (.user.login | endswith("[bot]")))] | length' 2>/dev/null || echo 0)
          else
            # Already commented on this issue by the bot? -> skip.
            COUNT=$(gh api "repos/$REPO/issues/$NUMBER/comments" \
              --jq '[.[] | select(.user.type == "Bot" or (.user.login | endswith("[bot]")))] | length' 2>/dev/null || echo 0)
          fi
          if [[ "${COUNT:-0}" != "0" ]]; then
            echo "::notice::bot already acted on $KIND #$NUMBER ($COUNT prior) — skipping re-trigger."
            exit 0   # not a failure: leave the run green
          fi

      # Checkout THIS shared repo to fetch the prompt(s) (read-only, no token needed).
      # NOTE: sparse-checkout defaults to cone mode, which only accepts DIRECTORY
      # patterns — bare filenames like "hermes-review-prompt.md" are rejected
      # ("not a directory"). Disable cone mode so file paths work.
      - name: Checkout shared repo (prompt source)
        if: steps.check-mention.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: s3ntin3l8/.github
          ref: main
          path: .hermes-shared
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ${{ inputs.prompt-path }}
            ${{ inputs.issue-prompt-path }}

      # Relay the request to the Hermes API server on hermes-01. The agent runs there
      # with full tools/memory/skills, re-mints its own GitHub App token, and posts the
      # review/comment BACK TO GITHUB ITSELF. We only forward: which target, the prompt,
      # and the model override. We do NOT wait for the agent to finish — it returns
      # its result by posting to GitHub, not by replying to this HTTP call. So this
      # step FIRES-AND-FORGETS: it sends the prompt and exits 0 regardless of how
      # long the agent runs (or whether the connection is later closed by the server).
      # A 4xx (bad auth/key) is the only real failure we surface; anything else
      # (timeouts, RemoteDisconnected) is expected for a long async run and is ignored.
      - name: Run Hermes (remote agent on hermes-01)
        id: run
        if: steps.check-mention.outputs.skip != 'true'
        env:
          API_URL: ${{ inputs.hermes-api-url }}
          API_KEY: ${{ secrets.HERMES_API_KEY }}
          API_MODEL: ${{ inputs.hermes-api-model }}
          TARGET_KIND: ${{ steps.target.outputs.kind }}
          TARGET_NUMBER: ${{ steps.target.outputs.number }}
          REPO: ${{ github.repository }}
          MODEL: ${{ inputs.hermes-model || vars.HERMES_MODEL || '' }}
          PROMPT_FILE: .hermes-shared/${{ steps.target.outputs.kind == 'pr' && inputs.prompt-path || inputs.issue-prompt-path }}
          MAX_TURNS: ${{ inputs.max-turns }}
        run: |
          set -euo pipefail
          [ -f "$PROMPT_FILE" ] || { echo "::error::prompt not found: $PROMPT_FILE"; exit 1; }

          # Assemble the user message from exported env vars. We do NOT rely on a
          # shell-local MSG var — it would not be exported to a child process.
          # Use printf to build the header with real newlines (YAML-safe).
          HEADER=$(printf 'Target: %s #%s in repo %s\nUse the github-code-review skill (for a PR) or your triage procedure (for an issue) to act on it. The GitHub App token is available to you via scripts/app-token.sh in the review-bot profile; mint it before calling gh. Do NOT ask the human for secrets.\n' "$TARGET_KIND" "$TARGET_NUMBER" "$REPO")
          if [[ -n "$MODEL" ]]; then
            HEADER+=$(printf '\nPrefer model: %s\n' "$MODEL")
          fi
          HEADER+=$(printf '\nHonor a maximum of %s agent turns.\n\n' "$MAX_TURNS")

          MSG="$HEADER$(cat "$PROMPT_FILE")"

          # Fire-and-forget: send the prompt, ignore the (async) response body.
          # -m 20s cap: we only need the server to ACCEPT the request, not to finish.
          # Any 4xx is a real config error -> fail. Connection drops/timeouts on a
          # long run are normal (server keeps working, posts result to GitHub) -> ignore.
          HTTP_CODE=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' \
            -X POST "$API_URL/v1/chat/completions" \
            -H "Authorization: Bearer $API_KEY" \
            -H "Content-Type: application/json" \
            --data "$(jq -nc --arg model "$API_MODEL" --arg content "$MSG" \
              '{model:$model, messages:[{role:"user",content:$content}], stream:false}')" \
            2>/dev/null || echo "000")
          echo "::notice::relayed request to hermes-01 (HTTP $HTTP_CODE); agent runs async and posts results to GitHub itself."
          if [[ "$HTTP_CODE" == "401" || "$HTTP_CODE" == "403" ]]; then
            echo "::error::Hermes API rejected the key (HTTP $HTTP_CODE) — check HERMES_API_KEY secret."
            exit 1
          fi
          # 000 / timeout / 2xx / 4xx-other -> treat as accepted-and-running.

# NOTE: No "post review" step here — the agent on hermes-01 performs the POST using its
# own App token, exactly as PR #18's original local design did. This preserves the
# centralized-prompt, trigger-agnostic, reusable behaviour without installing Hermes on
# the runner.
