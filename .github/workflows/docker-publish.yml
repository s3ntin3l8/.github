name: Docker Publish

on:
  # Lets this shared workflow be exercised standalone (e.g. against a scratch
  # image-name) without a downstream caller — the multi-image merge-job plumbing
  # (per-image digest download/manifest-assembly) has no other way to be smoke-tested
  # before a caller's first real push.
  workflow_dispatch:
    inputs:
      image-name:
        required: true
        type: string
      dockerfile:
        required: false
        type: string
        default: 'Dockerfile'
      platforms:
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
      push-edge:
        required: false
        type: boolean
        default: false
      push-release:
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      push-edge:
        required: false
        type: boolean
        default: false
      push-release:
        required: false
        type: boolean
        default: false
      release-tag:
        required: false
        type: string
      platforms:
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
      # Path to the Dockerfile, relative to the repo root (the build `context` below is
      # hardcoded to `.`). Default is the repo-root `Dockerfile`. Set this when a repo
      # publishes more than one image from the same checkout — e.g. `Dockerfile` for the
      # API, `apps/web/Dockerfile` for the web frontend. Each distinct Dockerfile must be
      # a separate workflow_call invocation; build/matrix/cache scoping is namespaced per
      # `image-name`, so two parallel invocations in the same caller run do not collide.
      dockerfile:
        required: false
        type: string
        default: 'Dockerfile'
      # Multiline `key=value` pairs passed to `docker build --build-arg`. Secrets must
      # NOT be passed this way — build args land in image history/logs regardless of
      # GitHub secret masking. Use repo variables for publishable tokens that are
      # inlined into the client bundle by design (e.g. NEXT_PUBLIC_*). Empty by default.
      build-args:
        required: false
        type: string
        default: ''
    secrets:
      REGISTRY_USERNAME:
        required: false
      REGISTRY_TOKEN:
        required: false

env:
  REGISTRY: ghcr.io

# Build each architecture natively (no QEMU emulation) on its own runner, push each
# as a by-digest image, then assemble a multi-arch manifest list in a final merge job.
# This replaces the previous single-job buildx build, where the arm64 leg ran under
# QEMU emulation and dominated the wall-clock. Each platform from `platforms` is mapped
# to a native GitHub-hosted runner; the input surface is unchanged so callers need no edits.
jobs:
  # Turn the `platforms` CSV into a build matrix of {platform, runner}, mapping each
  # architecture to a native runner. Unknown platforms fall back to an amd64 runner
  # (with QEMU set up in the build job) so exotic targets still build, just slower.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      push: ${{ steps.flags.outputs.push }}
      # Sanitized image-name usable in job output names, buildx cache scopes, and
      # artifact names (none of which accept `/`). `s3ntin3l8/pocket-portfolio-tracker`
      # becomes `s3ntin3l8-pocket-portfolio-tracker`. Without this, two same-run
      # invocations (e.g. one for `-api`, one for `-web`) would share a cache scope
      # and step on each other's layers — see build/cache-from below.
      image-slug: ${{ steps.slug.outputs.slug }}
    steps:
      - name: Resolve push flag
        id: flags
        run: echo "push=${{ inputs.push-edge || inputs.push-release }}" >> "$GITHUB_OUTPUT"

      - name: Build platform -> runner matrix
        id: matrix
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          include='[]'
          IFS=',' read -ra parts <<< "$PLATFORMS"
          for p in "${parts[@]}"; do
            p="$(printf '%s' "$p" | xargs)"   # trim whitespace
            [ -z "$p" ] && continue
            case "$p" in
              linux/amd64) runner='ubuntu-24.04' ;;
              linux/arm64) runner='ubuntu-24.04-arm' ;;
              *)           runner='ubuntu-24.04' ;;   # fallback: emulate on amd64
            esac
            include=$(jq -c --arg p "$p" --arg r "$runner" '. += [{"platform":$p,"runner":$r}]' <<< "$include")
          done
          echo "platforms -> $include"
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"

      - name: Derive image slug
        id: slug
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
        run: echo "slug=$(printf '%s' "$IMAGE_NAME" | tr '/:' '-')" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Architecture slug
        id: arch
        run: echo "slug=$(printf '%s' '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release-tag || github.ref }}

      # Only needed for the fallback case (a non-amd64 platform pinned to an amd64 runner).
      # Native amd64/arm64 builds skip this entirely.
      - name: Set up QEMU
        if: ${{ matrix.runner == 'ubuntu-24.04' && matrix.platform != 'linux/amd64' }}
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # docker/login-action has no retry, and ghcr.io intermittently answers
      # `GET /v2/` with `denied: denied` under load -- observed 2026-08-18, where
      # the amd64 leg was denied while the arm64 leg of the same run, using the
      # same credentials, succeeded 0.6s later. A single denial skips the `merge`
      # job and silently leaves :edge stale, so retry with escalating backoff.
      - name: Log in to the Container registry
        if: ${{ needs.prepare.outputs.push == 'true' }}
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          REGISTRY_PASS: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          attempts=4
          for attempt in $(seq 1 "$attempts"); do
            if printf '%s' "$REGISTRY_PASS" \
               | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin; then
              exit 0
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              echo "::warning::${REGISTRY} login attempt ${attempt}/${attempts} failed; retrying in $((attempt * 10))s"
              sleep $((attempt * 10))
            fi
          done
          echo "::error::${REGISTRY} login failed after ${attempts} attempts"
          exit 1

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ inputs.image-name }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          build-args: ${{ inputs.build-args }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache scope is `image-slug` + `arch-slug`. The image-slug dimension only
          # matters when a caller invokes this workflow more than once in the same run
          # (one image per invocation); for the typical single-image call the prefix
          # is just a longer, equally-unique scope.
          cache-from: type=gha,scope=${{ needs.prepare.outputs.image-slug }}-${{ steps.arch.outputs.slug }}
          cache-to: type=gha,mode=max,scope=${{ needs.prepare.outputs.image-slug }}-${{ steps.arch.outputs.slug }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ inputs.image-name }},push-by-digest=true,name-canonical=true,push=${{ needs.prepare.outputs.push }}

      - name: Export digest
        if: ${{ needs.prepare.outputs.push == 'true' }}
        env:
          IMAGE_SLUG: ${{ needs.prepare.outputs.image-slug }}
        run: |
          # Per-image subdir so two same-run invocations (one per image) never share a
          # `/tmp/digests` flat namespace — see merge's `docker buildx imagetools create`
          # below, which globs every file in here and assumes they all belong to this
          # invocation's `image-name`.
          mkdir -p "/tmp/digests/${IMAGE_SLUG}"
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${IMAGE_SLUG}/${digest#sha256:}"

      - name: Upload digest
        if: ${{ needs.prepare.outputs.push == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          # Double-dash delimiter, not single: `image-slug` isn't guaranteed
          # collision-free under a single-dash join. A repo publishing both
          # `pocket-portfolio-tracker` and `pocket-portfolio-tracker-web` makes the
          # first slug a strict prefix of the second, so a `digests-<slug>-*` pattern
          # in the merge job below would match both invocations' artifacts. `--` can't
          # occur inside a slug (image-name has already had `/` and `:` replaced with
          # `-`), so it's a safe, unambiguous separator.
          name: digests-${{ needs.prepare.outputs.image-slug }}--${{ steps.arch.outputs.slug }}
          path: /tmp/digests/${{ needs.prepare.outputs.image-slug }}/*
          if-no-files-found: error
          retention-days: 1

  # Assemble the per-arch digests into a single multi-arch manifest list, tag it,
  # and sign it. Skipped entirely for non-publishing (build-only) invocations.
  merge:
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.push == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          # `download-artifact@v4` extracts each matched artifact into its own
          # subdirectory named after the artifact (e.g.
          # /tmp/digests/digests-<slug>--<arch>/<digest-file>) unless
          # `merge-multiple: true` is set — it does NOT reproduce the upload side's
          # `/tmp/digests/<image-slug>/` layout on its own. Pointing `path` at the
          # per-image dir and flattening with `merge-multiple` is what makes the
          # `working-directory` below (and its `*` glob) valid.
          path: /tmp/digests/${{ needs.prepare.outputs.image-slug }}
          # image-slug-scoped, `--`-delimited so this invocation only pulls the
          # digests it produced (see the matching comment on `Upload digest`).
          pattern: digests-${{ needs.prepare.outputs.image-slug }}--*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.5.0

      # See the build job's identically-named step for why this isn't
      # docker/login-action -- same rationale applies here.
      - name: Log in to the Container registry
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          REGISTRY_PASS: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          attempts=4
          for attempt in $(seq 1 "$attempts"); do
            if printf '%s' "$REGISTRY_PASS" \
               | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin; then
              exit 0
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              echo "::warning::${REGISTRY} login attempt ${attempt}/${attempts} failed; retrying in $((attempt * 10))s"
              sleep $((attempt * 10))
            fi
          done
          echo "::error::${REGISTRY} login failed after ${attempts} attempts"
          exit 1

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ inputs.image-name }}
          tags: |
            type=raw,value=edge,enable=${{ inputs.push-edge }}
            type=semver,pattern={{version}},value=${{ inputs.release-tag }},enable=${{ inputs.push-release }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.release-tag }},enable=${{ inputs.push-release }}
            type=raw,value=latest,enable=${{ inputs.push-release }}
            type=sha,enable=${{ !inputs.push-release }}

      - name: Create and push manifest list
        working-directory: /tmp/digests/${{ needs.prepare.outputs.image-slug }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ inputs.image-name }}@sha256:%s ' *)

      - name: Sign the published Docker image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          DIGEST=$(docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ inputs.image-name }}:${VERSION}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
