name: Docker Publish

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      push-edge:
        required: false
        type: boolean
        default: false
      push-release:
        required: false
        type: boolean
        default: false
      release-tag:
        required: false
        type: string
      platforms:
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
    secrets:
      REGISTRY_USERNAME:
        required: false
      REGISTRY_TOKEN:
        required: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release-tag || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install cosign
        if: ${{ inputs.push-edge || inputs.push-release }}
        uses: sigstore/cosign-installer@v3.5.0

      - name: Log in to the Container registry
        if: ${{ inputs.push-edge || inputs.push-release }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ inputs.image-name }}
          tags: |
            type=raw,value=edge,enable=${{ inputs.push-edge }}
            type=semver,pattern={{version}},value=${{ inputs.release-tag }},enable=${{ inputs.push-release }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.release-tag }},enable=${{ inputs.push-release }}
            type=raw,value=latest,enable=${{ inputs.push-release }}
            type=sha,enable=${{ !inputs.push-release }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push-edge || inputs.push-release }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the published Docker image
        if: ${{ inputs.push-edge || inputs.push-release }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
