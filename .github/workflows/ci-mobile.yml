name: Mobile CI (Android & iOS)

on:
  workflow_call:
    inputs:
      java-version:
        description: "JDK version for Android build (default: '21')"
        required: false
        type: string
        default: '21'
      android-ndk-version:
        description: "Android NDK version (default: '25.1.8937393')"
        required: false
        type: string
        default: '25.1.8937393'
      go-mod-dir:
        description: "Directory containing go.mod (default: 'core')"
        required: false
        type: string
        default: 'core'
      xcode-version:
        description: "Xcode version path (e.g. '/Applications/Xcode_16.4.app/Contents/Developer')"
        required: false
        type: string
        default: '/Applications/Xcode_16.4.app/Contents/Developer'
      ios-destination:
        description: "xcodebuild test destination (default: 'platform=iOS Simulator,name=iPhone 16')"
        required: false
        type: string
        default: 'platform=iOS Simulator,name=iPhone 16'
      ios-scheme:
        description: "Xcode scheme for iOS tests (default: 'BranchDamApp')"
        required: false
        type: string
        default: 'BranchDamApp'
      ios-project:
        description: "Xcode project path (default: 'ios/BranchDamApp.xcodeproj')"
        required: false
        type: string
        default: 'ios/BranchDamApp.xcodeproj'
      ios-slices:
        description: "iOS framework slices to build: 'auto' (all on main, sim-only on PR), 'sim-only', or 'all' (default: 'auto')"
        required: false
        type: string
        default: 'auto'
      upload-aar:
        description: "Whether to upload the built AAR as a workflow artifact (default: false)"
        required: false
        type: boolean
        default: false
      android-sdk-packages:
        description: "sdkmanager packages for the Android job, excluding the NDK (the NDK is always appended from android-ndk-version). Default installs platforms android-35 and android-37.0 plus build-tools 35.0.0 and 36.0.0 (35 stays so callers still on compileSdk 35 do not change; 37.0 is for callers on compileSdk 37)."
        required: false
        type: string
        default: "platform-tools platforms;android-35 platforms;android-37.0 build-tools;35.0.0 build-tools;36.0.0"

jobs:
  test-android:
    name: Android (Build & Test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ inputs.go-mod-dir }}/go.mod
          cache-dependency-path: ${{ inputs.go-mod-dir }}/go.sum

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "${{ inputs.android-sdk-packages }} ndk;${{ inputs.android-ndk-version }}"

      - name: Build Go Core AAR
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ inputs.android-ndk-version }}
        run: |
          if [ ! -f ./scripts/build-mobile.sh ]; then
            echo "::error file=scripts/build-mobile.sh::./scripts/build-mobile.sh is required but not found in repository root"
            exit 1
          fi
          ./scripts/build-mobile.sh --android-only

      - name: Upload Built AAR (optional)
        if: ${{ inputs.upload-aar }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: branchdam-aar
          path: android/app/libs/branchdam.aar
          if-no-files-found: warn

      - name: Run Android Unit Tests & Release Compile Check
        run: |
          cd android
          chmod +x gradlew
          ./gradlew testDebugUnitTest
          ./gradlew compileReleaseKotlin

  test-ios:
    name: iOS (Build & Test)
    runs-on: macos-15
    # 30 minutes for the build and tests, plus room for the Resolve step's
    # worst case (an iOS platform download, capped at 20 minutes).
    timeout-minutes: 50
    env:
      GOTOOLCHAIN: auto
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        env:
          XCODE_VERSION: ${{ inputs.xcode-version }}
        run: |
          if [ -d "${XCODE_VERSION}" ]; then
            sudo xcode-select -s "${XCODE_VERSION}"
          else
            echo "::error::Requested Xcode version not found at: ${XCODE_VERSION}"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ inputs.go-mod-dir }}/go.mod
          cache-dependency-path: ${{ inputs.go-mod-dir }}/go.sum

      - name: Cache Xcode DerivedData
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/DerivedData
          key: ${{ runner.os }}-${{ inputs.xcode-version }}-deriveddata-${{ hashFiles('ios/**/*.xcodeproj', format('{0}/go.mod', inputs.go-mod-dir), format('{0}/go.sum', inputs.go-mod-dir)) }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.xcode-version }}-deriveddata-

      - name: Build Go Core xcframework
        env:
          IOS_SLICES: ${{ inputs.ios-slices }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ ! -f ./scripts/build-mobile.sh ]; then
            echo "::error file=scripts/build-mobile.sh::./scripts/build-mobile.sh is required but not found in repository root"
            exit 1
          fi
          if [ "${IOS_SLICES}" = "all" ] || { [ "${IOS_SLICES}" = "auto" ] && [ "${EVENT_NAME}" != "pull_request" ]; }; then
            echo "Building all iOS slices (ios, iossimulator, macos)..."
            ./scripts/build-mobile.sh --ios-only
          elif [ "${IOS_SLICES}" = "sim-only" ] || { [ "${IOS_SLICES}" = "auto" ] && [ "${EVENT_NAME}" = "pull_request" ]; }; then
            echo "Building simulator slice (iossimulator)..."
            ./scripts/build-mobile.sh --ios-sim-only
          else
            echo "::error::Invalid ios-slices input: '${IOS_SLICES}'. Expected 'auto', 'sim-only', or 'all'."
            exit 1
          fi

      # A macos-15 runner sometimes comes up with no iOS Simulator device for the
      # selected Xcode: xcodebuild then lists only the "Any iOS Simulator Device"
      # placeholder and exits 70 before building. Make sure a runtime and an iPhone
      # device exist, and fall back from the requested name to a device id.
      - name: Resolve iOS Simulator destination
        id: sim
        # The iOS platform download below is several GB; fail it here, with a
        # step-level diagnosis, rather than at the job's timeout.
        timeout-minutes: 20
        env:
          IOS_DESTINATION: ${{ inputs.ios-destination }}
        run: |
          set -euo pipefail

          case "${IOS_DESTINATION}" in
            *"platform=iOS Simulator"*) ;;
            *)
              echo "destination=${IOS_DESTINATION}" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          # Newest available iOS runtime, by version rather than list order.
          newest_ios_runtime() {
            xcrun simctl list -j runtimes available \
              | jq -r '[.runtimes[] | select(.platform == "iOS")]
                  | sort_by((.version // "0") | split(".") | map(tonumber? // 0))
                  | last | .identifier // empty'
          }
          # Every available device on an iOS runtime: udid, name, device type.
          ios_devices() {
            xcrun simctl list -j devices available \
              | jq -r '.devices | to_entries[]
                  | select(.key | contains("SimRuntime.iOS"))
                  | .value[] | "\(.udid)\t\(.name)\t\(.deviceTypeIdentifier)"'
          }

          runtime="$(newest_ios_runtime)"
          if [ -z "${runtime}" ]; then
            echo "::warning::No iOS Simulator runtime available; downloading the iOS platform."
            sudo xcodebuild -downloadPlatform iOS
            runtime="$(newest_ios_runtime)"
          fi
          if [ -z "${runtime}" ]; then
            echo "::error::No iOS Simulator runtime available for $(xcode-select -p)."
            xcrun simctl list runtimes
            exit 1
          fi

          # An explicit device id is the caller's choice: leave it to xcodebuild.
          if grep -qE '(^|,)id=' <<< "${IOS_DESTINATION}"; then
            echo "destination=${IOS_DESTINATION}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          wanted="$(sed -nE 's/(^|.*,)name=([^,]+).*/\2/p' <<< "${IOS_DESTINATION}")"
          devices="$(ios_devices)"
          if [ -n "${wanted}" ] && cut -f2 <<< "${devices}" | grep -qxF "${wanted}"; then
            echo "destination=${IOS_DESTINATION}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Requested device is missing: use its device type when this Xcode has
          # one (so an iPad stays an iPad), otherwise an iPhone 16, otherwise the
          # last iPhone type listed.
          devicetype="$(xcrun simctl list -j devicetypes \
            | jq -r --arg n "${wanted:-iPhone 16}" \
                '.devicetypes as $all
                 | ([$all[] | select(.name == $n)]
                    + [$all[] | select(.name == "iPhone 16")]
                    + ([$all[] | select(.identifier | test("iPhone"))] | reverse))
                 | .[0].identifier // empty')"
          if [ -z "${devicetype}" ]; then
            echo "::error::No simulator device type for '${wanted}' and no iPhone device type available."
            exit 1
          fi

          udid="$(awk -F '\t' -v t="${devicetype}" '$3 == t { print $1; exit }' <<< "${devices}")"
          if [ -n "${udid}" ]; then
            echo "::warning::Simulator '${wanted}' not found; using an existing ${devicetype} (${udid})."
          else
            udid="$(xcrun simctl create "CI ${devicetype##*.}" "${devicetype}" "${runtime}")"
            echo "::warning::Simulator '${wanted}' not found; created ${devicetype} on ${runtime} (${udid})."
          fi
          echo "destination=platform=iOS Simulator,id=${udid}" >> "$GITHUB_OUTPUT"

      - name: Run iOS Unit Tests
        env:
          IOS_PROJECT: ${{ inputs.ios-project }}
          IOS_SCHEME: ${{ inputs.ios-scheme }}
          IOS_DESTINATION: ${{ steps.sim.outputs.destination }}
        run: |
          xcodebuild test \
            -project "${IOS_PROJECT}" \
            -scheme "${IOS_SCHEME}" \
            -destination "${IOS_DESTINATION}" \
            -derivedDataPath build/DerivedData \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
