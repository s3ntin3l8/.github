# Blueprint: Standard Tauri v2 (Rust + frontend) Pre-commit Config
#
# Copy this to .pre-commit-config.yaml in your project root and install hooks:
#   pre-commit install
#   pre-commit install --hook-type pre-push
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt (check)
        entry: bash -c 'cd src-tauri && cargo fmt --check'
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: bash -c 'cd src-tauri && cargo clippy --all-targets --all-features -- -D warnings'
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-lock-check
        name: Cargo.lock freshness (check)
        # --locked asserts Cargo.lock doesn't need to change to resolve
        # against Cargo.toml -- fails if it's out of sync, same role
        # blueprints/go/pre-commit.yaml's go-mod-tidy hook plays for go.sum.
        entry: bash -c 'cd src-tauri && cargo metadata --locked --format-version 1 > /dev/null'
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: bash -c 'cd src-tauri && cargo test --all-features'
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

      - id: cargo-audit
        name: cargo audit
        # Same local, repo-scoped install pattern blueprints/go/pre-commit.yaml
        # uses for govulncheck (`cargo install --root DIR PKG` always nests
        # an extra bin/ under DIR, hence the doubled path below).
        entry: bash -c 'cargo install --root "$(git rev-parse --show-toplevel)/.bin" cargo-audit --quiet && "$(git rev-parse --show-toplevel)/.bin/bin/cargo-audit" audit --file src-tauri/Cargo.lock'
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]
