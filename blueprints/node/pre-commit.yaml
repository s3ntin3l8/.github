# Blueprint: Standard Node.js/TypeScript Pre-commit Config
#
# Copy this to .pre-commit-config.yaml in your project root and install hooks:
#   pre-commit install
#   pre-commit install --hook-type pre-push
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: npm-lint
        name: eslint
        entry: npm run lint
        language: system
        types: [ts, tsx, js, jsx, mjs]
        pass_filenames: false
        stages: [pre-commit]

      - id: npm-typecheck
        name: typecheck
        entry: npm run typecheck
        language: system
        types: [ts, tsx]
        pass_filenames: false
        stages: [pre-push]

      - id: npm-test
        name: vitest (unit tests)
        entry: npm run test
        language: system
        types: [ts, tsx, js, jsx, mjs]
        pass_filenames: false
        stages: [pre-push]
